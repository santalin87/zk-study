<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;color:#111827}
header{background:#2563eb;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
nav{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
nav button{flex:1;min-width:30%;padding:10px 4px;border:1px solid #d1d5db;background:#fff;border-radius:10px;font-size:14px}
nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn{display:block;width:100%;padding:13px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-size:16px;margin:8px 0;text-align:center;text-decoration:none;cursor:pointer}
.btn.gray{background:#e5e7eb;color:#111827}
.btn.green{background:#16a34a}
.btn.red{background:#dc2626}
.mut{color:#6b7280;font-size:14px}
.bar{height:14px;background:#e5e7eb;border-radius:7px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:#2563eb}
.tag{display:inline-block;background:#eff6ff;color:#2563eb;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash.front,.flash.back{white-space:pre-wrap;word-break:break-word;line-height:1.7}
.opt{display:block;width:100%;text-align:left;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;margin:6px 0;font-size:15px;cursor:pointer}
.opt.ok{border-color:#16a34a;background:#f0fdf4}
.opt.bad{border-color:#dc2626;background:#fef2f2}
.explain{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.7;margin-top:8px}
textarea,input[type=text]{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
.row{display:flex;gap:8px}
.row.btn{margin:8px 0}
.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0;background:#fff}
.task input{width:22px;height:22px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#fef3c7;color:#92400e}
select{padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:7px 13px;border:1px solid #d1d5db;background:#fff;border-radius:999px;font-size:14px;cursor:pointer}
.chip.on{background:#2563eb;color:#fff;border-color:#2563eb}
.seg{display:flex;background:#e5e7eb;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border:0;border-radius:8px;background:transparent;font-size:15px;cursor:pointer;color:#374151}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12);color:#111827}
.qa{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0;background:#fff}
.qa.ans{background:#f0fdf4;border-radius:8px;padding:10px;margin-top:8px;white-space:pre-wrap;line-height:1.7}
.chart{display:flex;align-items:flex-end;gap:3px;height:132px;margin:10px 0 2px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .v{font-size:11px;color:#2563eb;font-weight:600;margin-bottom:2px;min-height:14px}
.chart .b{width:100%;max-width:26px;background:#93c5fd;border-radius:3px 3px 0 0}
.chart .b.today{background:#2563eb}
.chart .b.zero{background:#e5e7eb}
.chart .d{font-size:10px;color:#6b7280;margin-top:3px;white-space:nowrap}
.dots{display:flex;gap:3px;margin:6px 0}
.dots i{flex:1;height:8px;border-radius:4px;background:#e5e7eb}
.dots i.on{background:#2563eb}
.statgrid{display:flex;gap:8px;flex-wrap:wrap}
.statgrid .sg{flex:1;min-width:70px;background:#f4f6fb;border-radius:10px;padding:10px;text-align:center}
.statgrid .sg b{display:block;font-size:22px;color:#111827}
.statgrid .sg span{font-size:12px;color:#6b7280}
/* 学习路径 */
.kprow{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #eef1f5;cursor:pointer}
.kprow .kn{flex:1;font-size:15px;line-height:1.45}
.kprow .ks{font-size:12px;color:#6b7280;display:block}
select.lvsel{padding:6px 6px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;background:#fff;max-width:104px}
.kpfig{margin:10px 0}
.kpfig .cap{font-size:12px;color:#6b7280;text-align:center;margin-top:4px}
.vidbox{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin:8px 0}
.vidbox iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
.hintbox{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.7}
.caseans{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.8;white-space:pre-wrap}
details.diag{margin:8px 0}
details.diag summary{cursor:pointer;color:#1d4ed8;font-size:14px}
.chip2{display:inline-block;padding:5px 10px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:12.5px;margin:0 6px 6px 0;border:1px solid #c7d2fe;cursor:pointer}
.chip2.jz{background:#fef3c7;color:#92400e;border-color:#fde68a;cursor:default}
.chip2.nx{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
.pbar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:#2563eb}
.evd{font-size:12px;padding:3px 9px;border-radius:99px;background:#f3f4f6;color:#6b7280;margin-right:6px}
.evd.ok{background:#dcfce7;color:#166534}
.kpsec{border:1px solid #e5e7eb;border-radius:12px;margin:10px 0;background:#fff}
.kpsec>summary{padding:13px 14px;font-weight:600;font-size:15.5px;cursor:pointer;list-style:none}
.kpsec>summary::-webkit-details-marker{display:none}
.kpsecbody{padding:0 14px 12px}
.casebox{background:#fbfcfe;border:1px solid #eef1f5;border-radius:10px;padding:10px 12px;margin:10px 0}
.vsum{max-height:13.6em;overflow:hidden;position:relative;transition:max-height .3s}
.vsum p{font-size:14.5px;line-height:1.75;margin:5px 0}
.vsum:not(.open)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3.2em;background:linear-gradient(transparent,#fff)}
.vsum.open{max-height:200em}
.navrow{display:flex;gap:10px}
.navrow .btn{flex:1;line-height:1.5}
.wrongrow{padding:10px 6px;border-bottom:1px solid #eef1f5;cursor:pointer;font-size:14.5px;line-height:1.6}
</style>

<body>
<header><h1>天娅的学习小站</h1><p>每日任务 · 记忆卡片 · 错题本 · 练习 · 收藏 · 学习路径</p></header>
<nav id="tabs">
<button data-t="today" class="on">每日任务</button>
<button data-t="memory">记忆卡片</button>
<button data-t="book">错题本</button>
<button data-t="practice">练习</button>
<button data-t="fav">收藏</button>
<button data-t="path">学习路径</button>
</nav>
<main id="app"></main>
<div id="exitBar" style="display:none;position:fixed;left:12px;right:12px;bottom:14px;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;z-index:50;font-size:14px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.3)">已经退到第一步啦，再往后退就是离开这个页面。真要退出，点页面左上角的 × 就行。<button onclick="document.getElementById('exitBar').style.display='none'" style="float:right;background:#374151;color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:14px">知道了</button></div>
<script src="data.js"></script>
<script src="img.js"></script>
<script src="path.js"></script>
<script>
var D = window.STUDY_DATA || {scores:[],wrong:[],practice:[],dictation:[]};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* 间隔重复：Leitner 盒子，间隔天数 0,1,2,4,7,15,30 */
var INTERVALS=[0,1,2,4,7,15,30];
function srAll(){return lsGet('ty_sr',{})}
function srGet(id){return srAll()[id]||{box:0,due:0,seen:0}}
function srMark(id,know){
var all=srAll();var r=all[id]||{box:0,due:0,seen:0};
r.seen=(r.seen||0)+1;
r.box=know?Math.min(r.box+1,INTERVALS.length-1):0;
var days=INTERVALS[r.box];
r.due=Date.now()+days*86400000;
all[id]=r;lsSet('ty_sr',all);return r;
}
function isDue(id){return srGet(id).due<=Date.now()}
/* 卡片池：错题卡 + 默写卡 */
var CARDS=[];
D.wrong.forEach(function(w,i){
CARDS.push({id:'w'+i,kind:'wrong',subject:w.subject,no:w.question_no,
kp:w.knowledge_point||'',etype:w.error_type||'',
front:'['+w.subject+' · 第'+w.question_no+'题]\n'+(w.stem? w.stem+'\n\n' : '')+'知识点：'+(w.knowledge_point||'见背面')+'\n\n你当时答：'+(w.student_answer||'（未记录）'),
back:'标准答案：'+(w.std_answer||'见解析')+'\n\n'+(w.note||'')+'\n\n得分：'+w.got_score+' / '+w.full_score,
raw:w});
});
D.dictation.forEach(function(d){
CARDS.push({id:'d'+d.id,kind:'dict',subject:d.subject,no:d.set,
kp:d.prompt,etype:'默写',
front:'['+d.set+']\n'+d.prompt+'\n\n（先在心里默写出来，再点卡片看答案）',
back:d.answer+'\n\n'+(d.explain||''),
raw:d});
});
(D.pairs||[]).forEach(function(p,i){
CARDS.push({id:'pair'+i,kind:'pair',subject:p.subject,no:'辨析',
kp:p.a_name+' vs '+p.b_name,etype:'成对辨析',
front:'',back:'',raw:p});
});
var app=document.getElementById('app');
var curTab='today';
var TODAY={view:'home'};
var MEM={view:'cards'};
var HUB={view:'prac'};
document.getElementById('tabs').addEventListener('click',function(e){
if(e.target.tagName!=='BUTTON')return;
curTab=e.target.getAttribute('data-t');
trackTab(curTab);
if(curTab==='today')TODAY.view='home';
CARD.planIds=null;
if(curTab==='book'||curTab==='memory'||curTab==='fav'){CARD.idx=0;resetCardState()}
var bs=document.querySelectorAll('#tabs button');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i]===e.target);
render();
});
function render(){
if(curTab==='today')renderTodayHub();
else if(curTab==='memory'){if(MEM.view==='concepts')renderConcepts();else renderCards()}
else if(curTab==='book'||curTab==='fav')renderCards();
else if(curTab==='practice'){if(HUB.view==='dict')renderDict();else renderPractice()}
else if(curTab==='path')renderPath();
}
function renderTodayHub(){
  if(TODAY.view==='home'){renderToday();afterNav();return}
  if(TODAY.view==='ask')renderAsk();else if(TODAY.view==='report')renderReport();else if(TODAY.view==='plan')renderPlan();else if(TODAY.view==='stats')renderStats();
  app.innerHTML='<div class="card" style="padding:10px 16px"><button class="btn gray" id="bkHome" style="width:auto;margin:0;padding:8px 14px">← 返回每日任务</button></div>'+app.innerHTML;
  document.getElementById('bkHome').addEventListener('click',function(){TODAY.view='home';render()});
  afterNav();
}
function goConcepts(){MEM.view='concepts';TODAY.view='home';switchTab('memory')}
function segHtml(items,cur,attr){
  return '<div class="seg">'+items.map(function(it){return '<button data-'+attr+'="'+it.v+'"'+(it.v===cur?' class="on"':'')+'>'+it.t+'</button>'}).join('')+'</div>';
}
function subjChipsHtml(cur,attr,subs){
  var subjects=subs||['全部','语文','数学','英语','物理','化学','生物','历史','政治','地理'];
  return '<div class="chips">'+subjects.map(function(s){return '<button class="chip'+(s===cur?' on':'')+'" data-'+attr+'="'+s+'">'+s+'</button>'}).join('')+'</div>';
}
/* ===== 今日任务 ===== */
function doneDays(){return lsGet('ty_days',{})}
function streak(){
  var days=doneDays();var s=0;var d=new Date();
  if(!days[todayStr()])d.setDate(d.getDate()-1);
  while(true){
    var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(days[k]){s++;d.setDate(d.getDate()-1)}else break;
  }
  return s;
}
function markToday(){var days=doneDays();var t=todayStr();var first=!days[t];days[t]=true;lsSet('ty_days',days);if(first)laTrack('checkin')}
/* 每日学习量记录（2026-11-02 加）：给孩子的学习统计页用，按天数评卡/会不会/练习 */
function dayLog(){return lsGet('ty_daylog',{})}
function dlog(f,n){try{var L=dayLog();var t=todayStr();var e=L[t]||{rate:0,yes:0,no:0,prac:0,pracOk:0};e[f]=(e[f]||0)+(n||1);L[t]=e;lsSet('ty_daylog',L)}catch(err){}}
function dstr(off){var d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayEntry(ds){var L=dayLog();return L[ds]||{rate:0,yes:0,no:0,prac:0,pracOk:0}}
function laTrack(ev,params){try{if(window.LA&&LA.track){if(params)LA.track(ev,params);else LA.track(ev)}}catch(e){}}
var __lastTab=null;
function trackTab(t){if(t===__lastTab)return;__lastTab=t;laTrack('tab_switch',{tab:t})}
/* ===== 半期考冲刺计划（11月11日开考）：按学科排，弱科多花时间 ===== */
var PLAN1=[
 ['2026-10-24',[['化学',4],['数学',4],['英语',6]]],
 ['2026-10-25',[['生物',5],['物理',5],['语文',4]]],
 ['2026-10-26',[['化学',4],['地理',3],['英语',4]]],
 ['2026-10-27',[['数学',3],['生物',5],['历史',3]]],
 ['2026-10-28',[['化学',4],['政治',3],['英语',4]]],
 ['2026-10-29',[['生物',5],['地理',3],['物理',3]]],
 ['2026-10-30',[['化学',4],['数学',3],['语文',4]]],
 ['2026-10-31',[['英语',6],['政治',4],['历史',4]]],
 ['2026-11-01',[['生物',5],['地理',4],['语文',5]]],
 ['2026-11-02',[['化学',3],['数学',4],['物理',4]]],
 ['2026-11-03',[['生物',3],['政治',2],['英语',4],['物理',2]]],
 ['2026-11-04',[['英语',7],['历史',4]]]
];
var PLAN2=[
 ['2026-11-05',['化学']],
 ['2026-11-06',['数学','生物']],
 ['2026-11-07',['地理','政治','物理']],
 ['2026-11-08',['英语','历史']],
 ['2026-11-09',['全部']]
];
var PLAN_SUBJ=[
 ['化学','上次月考 31 分','重点攻坚'],['数学','上次月考 59 分（满分 150）','重点攻坚'],
 ['生物','上次月考 55 分','多花时间'],['地理','上次月考 51 分','多花时间'],['政治','上次月考 59 分','多花时间'],
 ['物理','上次月考 61 分','正常推进'],['历史','上次月考 60 分','正常推进'],
 ['英语','上次月考 96.5 分（满分 150）','保持手感'],['语文','上次月考 100 分（满分 150）','保持手感']
];
var PLAN={todayQueues:{}};
function wdOf(ds){return ['周日','周一','周二','周三','周四','周五','周六'][new Date(ds+'T00:00:00').getDay()]}
function mdOf(ds){var p=ds.split('-');return (+p[1])+'月'+(+p[2])+'日'}
function daysToExam(){return Math.round((new Date('2026-11-11T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000)}
function planReviewed(){return lsGet('ty_plan_reviewed',{})}
function planMarkReviewed(id){var pr=planReviewed();if(!pr[id]){pr[id]=todayStr();lsSet('ty_plan_reviewed',pr)}}
function planSegments(){
  var bySubj={};D.wrong.forEach(function(w,i){(bySubj[w.subject]=bySubj[w.subject]||[]).push('w'+i)});
  var used={};var segs={};
  PLAN1.forEach(function(day){day[1].forEach(function(it){
    var s=it[0];used[s]=used[s]||0;var arr=bySubj[s]||[];var ids=arr.slice(used[s],used[s]+it[1]);used[s]+=it[1];
    (segs[s]=segs[s]||[]).push({date:day[0],ids:ids});
  })});
  return segs;
}
function wrongLabel(id){var w=D.wrong[parseInt(id.slice(1),10)];return w?('第'+w.question_no+'题'):id}
function planUnmastered(subjs){
  var out=[];D.wrong.forEach(function(w,i){var id='w'+i;
    if(subjs&&subjs.indexOf('全部')<0&&subjs.indexOf(w.subject)<0)return;
    if(srGet(id).box<3)out.push(id)});
  out.sort(function(a,b){return srGet(a).box-srGet(b).box});
  return out;
}
function startPlan(ids,label){
  if(!ids||!ids.length)return;
  switchTab('book');
  CARD.planIds=ids.slice();CARD.planLabel=label;CARD.idx=0;resetCardState();
  renderCards();
}
function planCardHtml(){
  var t=todayStr();
  if(t>'2026-11-12')return '';
  var rev=planReviewed();var revN=Object.keys(rev).length;
  var total=D.wrong.length;
  var head='<div class="card" style="border:2px solid #2563eb"><h2 style="margin-top:0">🎯 半期考冲刺 · 11月11日开考</h2>';
  if(t<'2026-10-24'){
    return head+'<p>冲刺计划 <b>10月24日（周六）开始</b>：错题按学科排好了——没掌握的学科（化学、数学、生物）排得密、开始得早；还好的学科（语文、英语）少占时间。先用 12 天把 '+total+' 道错题全部过一遍，11月5日起再专攻没掌握的。</p>'
      +'<button class="btn gray" id="planView" style="width:auto;padding:8px 16px">查看完整计划（按学科）</button></div>';
  }
  if(t==='2026-11-11'){
    return head+'<p><b>今天就是半期考，加油！</b></p><p class="mut">把会的都写满；不会的先跳过，回头再想。考完一科就放下，不要对答案。化学、数学是你这个月的主攻，该拿的分稳稳拿住。</p></div>';
  }
  if(t==='2026-11-10'){
    var um=planUnmastered(null).length;
    return head+'<p><b>明天开考，今天轻装回顾，不再刷新题：</b></p>'
      +'<p>· 概念清单里的失分项过一遍 <button class="btn gray" data-lgo="concepts" style="width:auto;margin:0;padding:6px 12px">去看概念清单</button></p>'
      +'<p>· 收藏夹里的题扫一遍 <button class="btn gray" data-lgo="fav" style="width:auto;margin:0;padding:6px 12px">去看收藏</button></p>'
      +'<p>· 化学方程式默写一轮 <button class="btn gray" data-lgo="dict" style="width:auto;margin:0;padding:6px 12px">去默写</button></p>'
      +'<p class="mut">第一轮已复习 '+revN+' / '+total+' 道，还没掌握的剩 '+um+' 道，今晚扫到哪算哪。早点休息，睡好比多刷两道题管用。</p></div>';
  }
  var left=daysToExam();
  var p2=null;PLAN2.forEach(function(d){if(d[0]===t)p2=d});
  if(p2){
    var umAll=planUnmastered(null);

var CARD={list:[],idx:0,flipped:false,subject:'全部',dueOnly:true,status:'all',stage:0,picked:null,checkOpen:false,planIds:null,planLabel:''};
function favs(){return lsGet('ty_favs',[])}
function isFav(id){return favs().indexOf(id)>=0}
function toggleFav(id){
  var f=favs();var i=f.indexOf(id);
  if(i>=0)f.splice(i,1);else f.push(id);
  lsSet('ty_favs',f);
}
function buildDeck(){
  if(curTab==='book'&&CARD.planIds&&CARD.planIds.length){
    var byId={};CARDS.forEach(function(c){byId[c.id]=c});
    CARD.list=CARD.planIds.map(function(id){return byId[id]}).filter(Boolean);
    if(CARD.idx>=CARD.list.length)CARD.idx=0;
    return;
  }
  var favOnly=(curTab==='fav');
  var kinds=curTab==='book'?['wrong']:(curTab==='memory'?['dict','pair']:['wrong','dict','pair']);
  var list=CARDS.filter(function(c){
    if(kinds.indexOf(c.kind)<0)return false;
    if(CARD.subject!=='全部'&&c.subject!==CARD.subject)return false;
    if(favOnly)return isFav(c.id);
    if(curTab==='book'){
      var bx=srGet(c.id).box;
      if(CARD.status==='no'&&bx>=3)return false;
      if(CARD.status==='yes'&&bx<3)return false;
      return true;
    }
    if(CARD.dueOnly&&!isDue(c.id))return false;
    return true;
  });
  list.sort(function(a,b){return srGet(a.id).box-srGet(b.id).box});
  CARD.list=list;
  if(CARD.idx>=list.length)CARD.idx=0;
  if(window.__jumpId){
    for(var ji=0;ji<list.length;ji++){if(list[ji].id===window.__jumpId){CARD.idx=ji;break}}
    window.__jumpId=null;if(!NAV.applying)resetCardState();
  }
}

function wrongCardHtml(c){

    if(CARD.stage===0){
      h+='<button class="btn" id="cReveal" style="margin-top:12px">学完了，考考我</button>';

      h+=checkHtml(w);
      h+=rateHtml();h+=pathBtn;

  if(w.options){

    Object.keys(w.options).sort().forEach(function(k){
      var cls='opt';

    else h+='<p class="mut">点一个选项，就是重做这道题</p>';

function pathLv(uid){
  var st=pStatus(),s=st[uid];
  if(s)return s.lv;
  var u=PATH_BOOK.units[uid],mx=0;
  if(u)u.members.forEach(function(m){var ms=st[m];if(ms&&ms.lv>mx)mx=ms.lv});

function unitEv(uid){
  var ev=pEv(),u=PATH_BOOK.units[uid],out={apply:0,adv:0,redoN:0,redoTot:0,redoDue:0};
  var ue=ev[uid]||{};
  if(ue.apply)out.apply=ue.apply;
  if(ue.adv)out.adv=ue.adv;
  if(u)u.members.forEach(function(m){
    var e=ev[m]||{},n=PATH_BOOK.nodes[m];
    if(n&&n.content&&n.content.case){out.redoTot++;if(e.redo)out.redoN++}
    if(e.apply&&!out.apply)out.apply=e.apply;
    if(e.adv&&!out.adv)out.adv=e.adv;
    if(e.redoDue&&(!out.redoDue||e.redoDue<out.redoDue))out.redoDue=e.redoDue;
  });
  return out;
}

function pathReviewItems(){
  var B=PATH_BOOK,now=Date.now(),week=now-7*864e5,log=pLog(),bad={},ev=pEv(),st=pStatus(),out=[];
  function unitOf(node){if(B.units[node])return{uid:node,mid:null};if(B.nodeUnit[node])return{uid:B.nodeUnit[node],mid:node};return null}
  function has(uid){return out.some(function(o){return o.uid===uid})}
  log.forEach(function(e){if(e.ts>=week&&(e.kind==='quiz'||e.kind==='redo')&&e.ok===0){var r=unitOf(e.node);if(r)bad[r.uid]=(bad[r.uid]||0)+1}});
  Object.keys(bad).forEach(function(uid){out.push({uid:uid,why:'本周做错 '+bad[uid]+' 次'})});
  Object.keys(ev).forEach(function(k){var e=ev[k];if(e.redoDue&&e.redoDue<=now){var r=unitOf(k);if(r&&B.units[r.uid]&&!has(r.uid))out.push({uid:r.uid,mid:r.mid,why:'案例重做还没通过'})}});

function findPathUnit(kp){
  if(!kp)return null;
  var B=PATH_BOOK,found=null;
  B.order.forEach(function(uid){
    if(found)return;
    var u=B.units[uid];
    for(var i=0;i<u.members.length;i++){if(memberMatchWrong(B.nodes[u.members[i]].name,{knowledge_point:kp})){found=uid;break}}
  });
  return found;
}

  var newUrl='https://github.com/santalin87/zk-study/issues/new?labels=tianya-q&title='+encodeURIComponent('[提问] ')+'&body='+encodeURIComponent('科目：\n题目（可以把题目打出来，或者写试卷第几题）：\n\n我卡在哪里：\n');
  var h='<div class="card"><h2 style="margin-top:0">我要提问</h2>'
    +'<p>遇到弄不懂的题，点下面按钮提交。爸爸和 AI 老师看到后会回答，答案会出现在这个页面下面。不用等，提交完先去做别的题。</p>'
    +'<a class="btn" href="'+newUrl+'" target="_blank" rel="noopener">提交新问题（需要登录 GitHub）</a>'
    +'<p class="mut">没有 GitHub 账号的话，把问题发给爸爸代提交也行。</p></div>'
    +'<div class="card"><h2 style="margin-top:0">我的问题</h2><div id="qaList"><p class="mut">加载中…</p></div></div>';
  app.innerHTML=h;
  fetch('https://api.github.com/repos/santalin87/zk-study/issues?labels=tianya-q&state=all&per_page=50')
    .then(function(r){return r.json()})
    .then(function(list){
      var box=document.getElementById('qaList');
      if(!box)return;
      if(!Array.isArray(list)||!list.length){box.innerHTML='<p class="mut">还没有提过问题</p>';return}
      box.innerHTML=list.map(function(it){
        return '<div class="qa"><b>'+esc(it.title)+'</b> <span class="pill">'+(it.state==='open'?'等回答':'已回答/关闭')+'</span>'
          +'<p style="white-space:pre-wrap;line-height:1.7">'+esc(it.body||'')+'</p>'
          +'<button class="btn gray" data-c="'+it.number+'" style="margin:0">看回答（'+it.comments+'）</button><div id="cmt'+it.number+'"></div></div>';
      }).join('');
      box.querySelectorAll('[data-c]').forEach(function(b){
        b.addEventListener('click',function(){
          var n=b.getAttribute('data-c');
          fetch('https://api.github.com/repos/santalin87/zk-study/issues/'+n+'/comments')
            .then(function(r){return r.json()})
            .then(function(cs){
              document.getElementById('cmt'+n).innerHTML=(cs||[]).map(function(c){
                return '<div class="ans"><b>'+esc(c.user.login)+'：</b>\n'+esc(c.body||'')+'</div>';
              }).join('')||'<p class="mut">还没有回答</p>';
            });
        });
      });
    })
    .catch(function(){
      var box=document.getElementById('qaList');
      if(box)box.innerHTML='<p class="mut">网络不通，暂时加载不了问题列表</p>';
    });
}
/* ===== 学习统计（孩子自己看：昨日 / 近一周 / 近一个月，X 分析式柱形图） ===== */
function renderStats(){
  var days=doneDays();
  function tot(ds){var e=dayEntry(ds);return (e.rate||0)+(e.prac||0)}
  function chart(n){
    var max=0,i,ds;
    for(i=n-1;i>=0;i--){var v=tot(dstr(i));if(v>max)max=v}
    var h='<div class="chart">';
    for(i=n-1;i>=0;i--){
      ds=dstr(i);var v2=tot(ds);
      var pct=v2&&max?Math.max(Math.round(v2/max*100),10):0;
      var lab=n<=7?wdOf(ds):(i%5===0||i===0?ds.slice(5).replace('-','/'):'');
      h+='<div class="col"><div class="v">'+(v2||'')+'</div><div class="b'+(i===0?' today':(v2?'':' zero'))+'" style="height:'+(v2?pct:3)+'%"></div><div class="d">'+lab+'</div></div>';
    }
    return h+'</div>';
  }
  function sumN(n){
    var s={rate:0,yes:0,no:0,prac:0,pracOk:0,chk:0};
    for(var i=0;i<n;i++){var ds=dstr(i);var e=dayEntry(ds);s.rate+=e.rate||0;s.yes+=e.yes||0;s.no+=e.no||0;s.prac+=e.prac||0;s.pracOk+=e.pracOk||0;if(days[ds])s.chk++}
    return s;
  }
  var yds=dstr(1),ye=dayEntry(yds),ytot=(ye.rate||0)+(ye.prac||0);
  var h='<div class="card"><h2 style="margin-top:0">昨日学习情况（'+mdOf(yds)+' '+wdOf(yds)+'）</h2>';
  if(!ytot&&!days[yds]){
    h+='<p class="mut">昨天没有留下学习记录。今天补上，从今天开始每天的都会记在这里。</p>';
  }else{
    h+='<div class="statgrid">'
      +'<div class="sg"><b>'+ytot+'</b><span>总学习次数</span></div>'
      +'<div class="sg"><b>'+(ye.rate||0)+'</b><span>复习卡片（张）</span></div>'
      +'<div class="sg"><b>'+(ye.yes||0)+' / '+(ye.no||0)+'</b><span>会了 / 不会</span></div>'
      +'<div class="sg"><b>'+(ye.pracOk||0)+' / '+(ye.prac||0)+'</b><span>练习答对 / 共做</span></div>'
      +'</div><p style="margin:8px 0 0">打卡：'+(days[yds]?'已完成 ✓':'未完成')+'</p>';
  }
  h+='</div>';
  var s7=sumN(7);
  h+='<div class="card"><h2 style="margin-top:0">近一周（近 7 天）</h2>'
    +'<p class="mut" style="margin:0">共学习 '+(s7.rate+s7.prac)+' 次 · 评卡 '+s7.rate+' 张（会了 '+s7.yes+'、不会 '+s7.no+'）· 练习 '+s7.prac+' 题（答对 '+s7.pracOk+'）· 打卡 '+s7.chk+' 天</p>'
    +chart(7)
    +'<p class="mut">最右边一根是今天，柱子越高，当天学得越多。</p></div>';
  var s30=sumN(30);
  h+='<div class="card"><h2 style="margin-top:0">近一个月（近 30 天）</h2>'
    +'<p class="mut" style="margin:0">共学习 '+(s30.rate+s30.prac)+' 次 · 评卡 '+s30.rate+' 张 · 练习 '+s30.prac+' 题 · 打卡 '+s30.chk+' 天 · 当前连续打卡 '+streak()+' 天</p>'
    +chart(30)
    +'<p class="mut" style="margin:10px 0 2px">打卡记录（蓝色 = 当天学过并打卡）：</p><div class="dots">';
  for(var j=29;j>=0;j--){h+='<i class="'+(days[dstr(j)]?'on':'')+'"></i>'}
  h+='</div><p class="mut">逐日次数从 '+mdOf(todayStr())+' 起开始记录；这之前的柱子偏低不代表没学，那时还没开始逐日记——打卡那排是全的，可以对照看。</p></div>';
  app.innerHTML=h;
}
/* ===== 学习报告 ===== */
function renderReport(){
  var order=['语文','英语','数学','物理','历史','政治','生物','地理','化学'];
  var map={};D.scores.forEach(function(x){map[x.subject]=x});
  var total=0,full=0;
  var h='<div class="card"><h2 style="margin-top:0">成绩看板 · 高一上第一次月考</h2>';
  order.forEach(function(s){
    var x=map[s];if(!x)return;
    total+=x.score;full+=x.full;
    var pct=Math.round(x.score/x.full*100);
    h+='<div style="margin:8px 0"><div>'+s+' <b>'+x.score+'</b> / '+x.full+'（'+pct+'%）</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  });
  h+='<p><b>总分 '+total+' / '+full+'</b></p></div>';
  (function(){
    var cs=D.concepts||[];if(!cs.length)return;
    var byS={};
    cs.forEach(function(c){byS[c.subject]=byS[c.subject]||{t:0,w:0};byS[c.subject].t++;if(c.wrong)byS[c.subject].w++});
    var totW=0;cs.forEach(function(c){if(c.wrong)totW++});
    h+='<div class="card"><h2 style="margin-top:0">概念地基盘点</h2><p class="mut">这次考试共涉及 '+cs.length+' 个概念，其中 '+totW+' 个失了分（病根 1 的明细账）：</p>';
    order.forEach(function(s){var b=byS[s];if(!b)return;h+='<p style="margin:4px 0">'+s+'：失分概念 <b style="color:#dc2626">'+b.w+'</b> / 共 '+b.t+' 个</p>'});
    h+='<button class="btn" onclick="goConcepts()">去概念清单逐个补洞</button></div>';
  })();
  h+='<div class="card"><h2 style="margin-top:0">五个病根</h2>'
    +'<p><b>1. 概念地基有洞</b>——化学方程式从不配平、地理把"大气逆辐射"写成"反射"。不是粗心，是真不会。</p>'
    +'<p><b>2. 输出说不到点上</b>——政治材料题丢 26 分、历史主观题丢 17 分。有话，但写不到得分点上。</p>'
    +'<p><b>3. 选择题暗坑</b>——概念边界不清，一比较就选错。错题遮住答案重做，才算真会。</p>'
    +'<p><b>4. 大题空白/没写完</b>——物理刹车题、化学大题整片空白；数学第 19 题考试时写跑偏了（试卷上的完整解法是考后评讲订正补的，订正懂了不等于考试会做）。先保证每道题都按框架动笔。</p>'
    +'<p><b>5. 关系类判断成对翻车</b>——充分/必要方向、相等与包含、中书省与门下省。成对概念要成对记、互相辨析。</p></div>';
  var sr=srAll();var boxes=[0,0,0,0,0,0,0];
  CARDS.forEach(function(c){boxes[srGet(c.id).box]++});
  var pracDone=lsGet('ty_prac_done',{});var pracOk=0,pracN=0;
  Object.keys(pracDone).forEach(function(k){pracN++;if(pracDone[k])pracOk++});
  h+='<div class="card"><h2 style="margin-top:0">我的进度（这台设备）</h2>'
    +'<p>连续打卡：<b>'+streak()+'</b> 天</p>'
    +'<p>卡片熟练度分布（盒子 0 到 6，越高越熟）：'+boxes.join(' · ')+'，共 '+CARDS.length+' 张</p>'
    +'<p>专项练习已做：'+pracN+' 题，答对 '+pracOk+' 题</p>'
    +'<p class="mut">进度存在这台手机的浏览器里，换手机不会同步。每天打开做一点，比一次做很多更管用。</p>'
    +'<button class="btn" onclick="TODAY.view=\'stats\';render()">看我的学习统计（昨日 / 近一周 / 近一个月）</button></div>';
  app.innerHTML=h;
}
/* 站内后退：左滑/返回键 = 退到上一个步骤（上一张卡/上一页/讲解退回题目），退到第一步才提示退出 */
var NAV={lastSnap:'',applying:false};
function navSnapshot(){
  var c=(CARD.list&&CARD.list[CARD.idx])||null;
  return {tab:curTab,tv:TODAY.view,mv:MEM.view,hv:HUB.view,
    cs:CARD.subject,ct:CARD.status,cd:CARD.dueOnly,cid:c?c.id:'',cst:CARD.stage,cpk:CARD.picked,cco:CARD.checkOpen,cfl:CARD.flipped,
    cpi:CARD.planIds?CARD.planIds.join(','):'',cpl:CARD.planLabel,cix:CARD.idx,
    ps:PRAC.subject,pi:PRAC.idx,po:PRAC.only,ds:DICT.set,di:DICT.idx,dr:DICT.revealed,ks:CONC.subject};
}
function afterNav(){
  if(NAV.applying)return;
  try{
    var s=JSON.stringify(navSnapshot());
    if(s===NAV.lastSnap)return;
    NAV.lastSnap=s;
    history.pushState({snap:s},'');
  }catch(e){}
}
function applySnap(s){
  curTab=s.tab;TODAY.view=s.tv;MEM.view=s.mv;HUB.view=s.hv;
  CARD.subject=s.cs;CARD.status=s.ct;CARD.dueOnly=s.cd;CARD.stage=s.cst;CARD.picked=s.cpk;CARD.checkOpen=s.cco;CARD.flipped=s.cfl;
  PRAC.subject=s.ps;PRAC.idx=s.pi;PRAC.only=s.po;
  DICT.set=s.ds;DICT.idx=s.di;DICT.revealed=s.dr;
  CONC.subject=s.ks;
  if(s.cpi){CARD.planIds=s.cpi.split(',');CARD.planLabel=s.cpl||'';CARD.idx=s.cix||0;window.__jumpId=null}
  else if(s.cid&&(s.tab==='book'||s.tab==='memory'||s.tab==='fav')){CARD.planIds=null;window.__jumpId=s.cid}
  else{CARD.planIds=null;window.__jumpId=null}
  var bs=document.querySelectorAll('#tabs button');
  bs.forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===curTab)});
}
function showExitBar(){
  var bar=document.getElementById('exitBar');
  if(!bar)return;
  bar.style.display='block';
  clearTimeout(window.__ebT);
  window.__ebT=setTimeout(function(){bar.style.display='none'},5000);
}
window.addEventListener('popstate',function(e){
  if(e.state&&e.state.snap){
    NAV.applying=true;
    try{applySnap(JSON.parse(e.state.snap));NAV.lastSnap=e.state.snap;render()}catch(err){}
    NAV.applying=false;
  }else{
    try{history.pushState({boot:1},'')}catch(err){}
    showExitBar();
  }
});
try{history.pushState({boot:1},'')}catch(e){}
render();

</script>
