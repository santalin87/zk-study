<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<meta name="theme-color" content="#2563eb">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;color:#111827}
header{background:#2563eb;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
.hdr-in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#hdrUser{font-size:13px;color:#dbeafe;text-align:right;padding-top:2px;white-space:nowrap;line-height:1.5}
#hdrUser a{color:#fff;text-decoration:underline}
nav{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
nav button{flex:1;min-width:30%;padding:10px 4px;border:1px solid #d1d5db;background:#fff;border-radius:10px;font-size:14px}
nav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn{display:block;width:100%;padding:13px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-size:16px;margin:8px 0;text-align:center;text-decoration:none;cursor:pointer}
.btn.gray{background:#e5e7eb;color:#111827}
.btn.green{background:#16a34a}
.btn.red{background:#dc2626}
.mut{color:#6b7280;font-size:14px}
.bar{height:14px;background:#e5e7eb;border-radius:7px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:#2563eb}
.tag{display:inline-block;background:#eff6ff;color:#2563eb;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash.front,.flash.back{white-space:pre-wrap;word-break:break-word;line-height:1.7}
.opt{display:block;width:100%;text-align:left;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;margin:6px 0;font-size:15px;cursor:pointer}
.opt.ok{border-color:#16a34a;background:#f0fdf4}
.opt.bad{border-color:#dc2626;background:#fef2f2}
.opt.sel{border-color:#2563eb;background:#eff6ff}
.explain{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.7;margin-top:8px}
textarea,input[type=text]{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
.row{display:flex;gap:8px}
.row.btn{margin:8px 0}
.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0;background:#fff}
.task input{width:22px;height:22px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#fef3c7;color:#92400e}
select{padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{padding:7px 13px;border:1px solid #d1d5db;background:#fff;border-radius:999px;font-size:14px;cursor:pointer}
.chip.on{background:#2563eb;color:#fff;border-color:#2563eb}
.seg{display:flex;background:#e5e7eb;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border:0;border-radius:8px;background:transparent;font-size:15px;cursor:pointer;color:#374151}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12);color:#111827}
.qa{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0;background:#fff}
.qa.ans{background:#f0fdf4;border-radius:8px;padding:10px;margin-top:8px;white-space:pre-wrap;line-height:1.7}
.chart{display:flex;align-items:flex-end;gap:3px;height:132px;margin:10px 0 2px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .v{font-size:11px;color:#2563eb;font-weight:600;margin-bottom:2px;min-height:14px}
.chart .b{width:100%;max-width:26px;background:#93c5fd;border-radius:3px 3px 0 0}
.chart .b.today{background:#2563eb}
.chart .b.zero{background:#e5e7eb}
.chart .d{font-size:10px;color:#6b7280;margin-top:3px;white-space:nowrap}
.dots{display:flex;gap:3px;margin:6px 0}
.dots i{flex:1;height:8px;border-radius:4px;background:#e5e7eb}
.dots i.on{background:#2563eb}
.statgrid{display:flex;gap:8px;flex-wrap:wrap}
.statgrid .sg{flex:1;min-width:70px;background:#f4f6fb;border-radius:10px;padding:10px;text-align:center}
.statgrid .sg b{display:block;font-size:22px;color:#111827}
.statgrid .sg span{font-size:12px;color:#6b7280}
/* 打卡系统（2026-11-12） */
#streakFlame{font-size:15px;color:#fff;text-align:right;padding-top:2px;white-space:nowrap;line-height:1.5}
.streak-banner{background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px;line-height:1.7;color:#9a3412}
.streak-banner.urgent{background:#fef2f2;border-color:#fca5a5;color:#991b1b;font-weight:600}
.streak-recover{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14.5px;line-height:1.7}
.hmgrid{display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(7,12px);grid-auto-flow:column;gap:3px;margin:8px 0 2px}
.hm{border-radius:3px;background:#e5e7eb}
.hm1{background:#22c55e}
.hmF{background:#38bdf8}
.hmM{background:#f59e0b}
.hmT{outline:2px solid #2563eb;outline-offset:1px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{flex:1;min-width:76px;background:#f3f4f6;border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;line-height:1.5;color:#9ca3af}
.badge.got{background:#fef3c7;color:#92400e}
.badge span{font-size:11px;color:#6b7280}
/* 互动玩具 */
.toybox{position:relative;height:620px;border-radius:10px;overflow:hidden;background:#f8fafc;margin:8px 0}
.toybox iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
@media (max-width:640px){.toybox{height:560px}}
/* 学习路径 */
.kprow{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #eef1f5;cursor:pointer}
.kprow .kn{flex:1;font-size:15px;line-height:1.45}
.kprow .ks{font-size:12px;color:#6b7280;display:block}
select.lvsel{padding:6px 6px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;background:#fff;max-width:104px}
.kpfig{margin:10px 0}
.kpfig .cap{font-size:12px;color:#6b7280;text-align:center;margin-top:4px}
.vidbox{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin:8px 0}
.vidbox iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
.vidbox video{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
.hintbox{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.7}
.caseans{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.8;white-space:pre-wrap}
details.diag{margin:8px 0}
details.diag summary{cursor:pointer;color:#1d4ed8;font-size:14px}
.chip2{display:inline-block;padding:5px 10px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:12.5px;margin:0 6px 6px 0;border:1px solid #c7d2fe;cursor:pointer}
.chip2.on{background:#3730a3;color:#fff;border-color:#3730a3}
.chip2.jz{background:#fef3c7;color:#92400e;border-color:#fde68a;cursor:default}
.chip2.nx{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
.pbar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:#2563eb}
.evd{font-size:12px;padding:3px 9px;border-radius:99px;background:#f3f4f6;color:#6b7280;margin-right:6px}
.evd.ok{background:#dcfce7;color:#166534}
.kpsec{border:1px solid #e5e7eb;border-radius:12px;margin:10px 0;background:#fff}
.kpsec>summary{padding:13px 14px;font-weight:600;font-size:15.5px;cursor:pointer;list-style:none}
.kpsec>summary::-webkit-details-marker{display:none}
.kpsecbody{padding:0 14px 12px}
.casebox{background:#fbfcfe;border:1px solid #eef1f5;border-radius:10px;padding:10px 12px;margin:10px 0}
.vsum{max-height:13.6em;overflow:hidden;position:relative;transition:max-height .3s}
.vsum p{font-size:14.5px;line-height:1.75;margin:5px 0}
.vsum .hl{background:#fff1a8;padding:0 2px;border-radius:3px}
.vsum p.warn{color:#b03a2e;background:#fdecea;border-radius:6px;padding:6px 9px}
.vtop{background:#fffbe8;border:1px solid #f0df9a;border-radius:8px;padding:8px 12px;margin:8px 0}
.vtop .vtopt{font-weight:700;font-size:13.5px;margin:0 0 4px}
.vtop p{font-size:14.5px;line-height:1.7;margin:3px 0}
.vsum:not(.open)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3.2em;background:linear-gradient(transparent,#fff)}
.vsum.open{max-height:200em}
.navrow{display:flex;gap:10px}
.navrow .btn{flex:1;line-height:1.5}
.wrongrow{padding:10px 6px;border-bottom:1px solid #eef1f5;cursor:pointer;font-size:14.5px;line-height:1.6}
.sech{font-size:13px;font-weight:700;letter-spacing:3px;color:#2563eb;margin:20px 2px 2px}
#subjbar{max-width:860px;margin:0 auto;padding:8px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sbtn{border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:999px;padding:7px 16px;font-size:14.5px;cursor:pointer}
.sbtn.on{background:#2563eb;border-color:#2563eb;color:#fff}
#loginMask{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:200;align-items:center;justify-content:center;padding:18px}
#loginMask .lgbox{background:#fff;border-radius:16px;padding:22px 20px;max-width:340px;width:100%}
#loginMask input{width:100%;box-sizing:border-box;padding:11px 12px;margin:0 0 10px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}

@media (min-width:1024px){
main{max-width:1440px;padding:20px}
nav{max-width:1440px;margin:0 auto;padding:12px 20px 0}
nav button{min-width:0;font-size:15px;padding:11px 4px}
#subjbar{max-width:1440px;padding:10px 20px 0}
.hdr-in{max-width:1440px}
body{font-size:17px}
.card{padding:22px;margin-bottom:16px}
header h1{font-size:21px}
}
#colL,#colR{display:none}
.sbh{font-size:13px;letter-spacing:2px;color:#2563eb;margin:0 0 10px}
.sbnav button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;margin:4px 0;border:1px solid #e5e7eb;background:#fff;border-radius:10px;font-size:15px;cursor:pointer;text-align:left}
.sbnav button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.sbnav .bdg{background:#fef3c7;color:#92400e;border-radius:999px;font-size:12px;padding:1px 8px}
.sbnav button.on .bdg{background:#fff;color:#2563eb}
.sbitem{font-size:14px;padding:7px 0;border-bottom:1px solid #f3f4f6;line-height:1.55}
.sbitem:last-child{border-bottom:0}
.sbprog-link{cursor:pointer;border-radius:10px;padding:8px;margin:0 -8px 6px}
.sbprog-link:hover{background:#f0f6ff}
.sbsubj button{display:block;width:100%;padding:10px 12px;margin:4px 0;border:1px solid #e5e7eb;background:#fff;border-radius:10px;font-size:15px;cursor:pointer;text-align:left}
.sbsubj button.on{background:#2563eb;color:#fff;border-color:#2563eb}
@media (min-width:1200px){
#layout{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:18px;max-width:1560px;margin:0 auto;padding:6px 18px 18px;align-items:start}
#colL,#colR{display:block;position:sticky;top:70px}
#layout main{max-width:none;margin:0;padding:30px 0 12px}
#tabs{display:none}
#subjbar{display:flex;justify-content:center;max-width:1560px;margin:0 auto;padding:14px 336px 0 286px;box-sizing:border-box}
#colL>.card:nth-child(2){display:none}
}

<script>
var SUBJ_BOOKS=[];
if(typeof PATH_BOOK_CHN!=='undefined')SUBJ_BOOKS.push({key:'chn',label:'语文',book:PATH_BOOK_CHN});
if(typeof PATH_BOOK!=='undefined')SUBJ_BOOKS.push({key:'math',label:'数学',book:PATH_BOOK});
if(typeof PATH_BOOK_PHY!=='undefined')SUBJ_BOOKS.push({key:'phy',label:'物理',book:PATH_BOOK_PHY});
if(typeof PATH_BOOK_CHEM!=='undefined')SUBJ_BOOKS.push({key:'chem',label:'化学',book:PATH_BOOK_CHEM});
if(typeof PATH_BOOK_ENG!=='undefined')SUBJ_BOOKS.push({key:'eng',label:'英语',book:PATH_BOOK_ENG});
if(typeof PATH_BOOK_HIST!=='undefined')SUBJ_BOOKS.push({key:'hist',label:'历史',book:PATH_BOOK_HIST});
if(typeof PATH_BOOK_GEO!=='undefined')SUBJ_BOOKS.push({key:'geo',label:'地理',book:PATH_BOOK_GEO});
if(typeof PATH_BOOK_BIO!=='undefined')SUBJ_BOOKS.push({key:'bio',label:'生物',book:PATH_BOOK_BIO});
if(typeof PATH_BOOK_POL!=='undefined')SUBJ_BOOKS.push({key:'pol',label:'政治',book:PATH_BOOK_POL});
var SUBJ_LABEL={},SUBJ_KEY={};
SUBJ_BOOKS.forEach(function(x){SUBJ_LABEL[x.key]=x.label;SUBJ_KEY[x.label]=x.key});
SUBJ_BOOKS.forEach(function(x){var B=x.book;if(!B||!B.order||!B.units)return;B.order.forEach(function(uid,i){var u=B.units[uid];if(!u)return;if(!u.prevU&&i>0)u.prevU=B.units[B.order[i-1]];if(!u.nextU&&i<B.order.length-1)u.nextU=B.units[B.order[i+1]];if(!u.nextUnits){var seen={},arr=[];(u.members||[]).forEach(function(nid){var n=B.nodes[nid];((n&&n.next)||[]).forEach(function(nx){var nid2=(typeof nx==='string')?nx:nx.id;var tu=B.nodeUnit[nid2];if(tu&&tu!==uid&&!seen[tu]){seen[tu]=1;arr.push(B.units[tu])}})});u.nextUnits=arr}})});
var CUR_SUBJ='math';try{CUR_SUBJ=lsGet('ty_subj','math')}catch(e){}if(!SUBJ_LABEL[CUR_SUBJ])CUR_SUBJ='math';
function subjBook(key){for(var i=0;i<SUBJ_BOOKS.length;i++){if(SUBJ_BOOKS[i].key===key)return SUBJ_BOOKS[i].book}return null}
function setCurSubj(key){
if(!SUBJ_LABEL[key])return;
CUR_SUBJ=key;lsSet('ty_subj',key);
var lbl=SUBJ_LABEL[key];
if(typeof PRAC!=='undefined'){PRAC.subject=lbl;PRAC.idx=0}
if(typeof CARD!=='undefined'){CARD.subject=lbl;CARD.idx=0}
if(typeof PATH_SUBJ!=='undefined'&&PATH_SUBJ!==key){
if(typeof curTab!=='undefined'&&curTab==='path'&&typeof setPathSubj==='function')setPathSubj(key);
else{PATH_SUBJ=key;PATH_BOOK=subjBook(key);if(typeof PATHV!=='undefined'){PATHV.view='list';PATHV.id=null}}}
renderSubjBars();
if(typeof renderSidebars==='function')renderSidebars();
if(typeof curTab!=='undefined'&&(curTab==='today'||curTab==='practice'||curTab==='book'||curTab==='memory'||curTab==='fav')&&typeof render==='function')render();
}
function renderSubjBars(){
var bar=document.getElementById('subjbar');
if(bar){bar.innerHTML='<span style="font-size:13px;color:#6b7280;letter-spacing:2px">科目</span>'+SUBJ_BOOKS.map(function(x){return '<button class="sbtn'+(CUR_SUBJ===x.key?' on':'')+'" data-gsubj="'+x.key+'">'+x.label+'</button>'}).join('');
bar.querySelectorAll('[data-gsubj]').forEach(function(b){b.addEventListener('click',function(){setCurSubj(b.getAttribute('data-gsubj'))})});}
var sb=document.getElementById('sbSubj');
if(sb){sb.innerHTML=SUBJ_BOOKS.map(function(x){return '<button data-gsubj="'+x.key+'" class="'+(CUR_SUBJ===x.key?'on':'')+'">'+x.label+'</button>'}).join('');
sb.querySelectorAll('[data-gsubj]').forEach(function(b){b.addEventListener('click',function(){setCurSubj(b.getAttribute('data-gsubj'))})});}
}

</script>
<script>
var D = window.STUDY_DATA || {scores:[],wrong:[],practice:[],dictation:[]};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtT(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/==([^=]+)==/g,'<mark class="hl">$1</mark>')}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}if(window.__tySyncHook)try{window.__tySyncHook(k)}catch(e){}}
/* 间隔重复：Leitner 盒子，间隔天数 0,1,2,4,7,15,30 */
var INTERVALS=[0,1,2,4,7,15,30];
function srAll(){return lsGet('ty_sr',{})}

function srMark(id,know){

function syncPushNow(){if(!TYUSER)return;try{fetch('/api/state',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({phone:TYUSER.phone,name:TYUSER.name,data:syncSnapshot()})}).then(function(r){return r.json()}).then(function(j){if(j&&j.ok){try{localStorage.removeItem('ty_sync_dirty');if(j.updated)localStorage.setItem('ty_sync_seen',String(j.updated))}catch(e){}}}).catch(function(){})}catch(e){}}

window.__tySyncHook=function(k){if(__syncApplying)return;if(SYNC_KEYS.indexOf(k)<0)return;try{localStorage.setItem('ty_sync_dirty','1')}catch(e){}syncPush()};
function applyRemote(j){var remote=j.data;
var __changed=false;__syncApplying=true;SYNC_KEYS.forEach(function(k){var old=null;try{old=localStorage.getItem(k)}catch(e){}if(remote[k]===undefined){if(old!==null)__changed=true;try{localStorage.removeItem(k)}catch(e){}}else{if(old!==JSON.stringify(remote[k]))__changed=true;lsSet(k,remote[k])}});__syncApplying=false;
if(remote.ty_subj&&typeof SUBJ_LABEL!=='undefined'&&SUBJ_LABEL[remote.ty_subj]){CUR_SUBJ=remote.ty_subj;try{PRAC.subject=SUBJ_LABEL[CUR_SUBJ];CARD.subject=SUBJ_LABEL[CUR_SUBJ]}catch(e){}}
try{localStorage.setItem('ty_sync_seen',String(j.updated||''));localStorage.removeItem('ty_sync_dirty')}catch(e){}
if(__changed){var rl=false;try{rl=!!sessionStorage.getItem('ty_sync_reloaded')}catch(e){}if(!rl){try{sessionStorage.setItem('ty_sync_reloaded','1')}catch(e){}location.reload();return}}

if(!remote){if(Object.keys(syncSnapshot()).length)syncPushNow();return}
var seen=0;try{seen=parseInt(localStorage.getItem('ty_sync_seen')||'0',10)||0}catch(e){}
var dirty=false;try{dirty=!!localStorage.getItem('ty_sync_dirty')}catch(e){}
if(j.updated&&j.updated<=seen){if(dirty)syncPushNow();try{sessionStorage.removeItem('ty_sync_reloaded')}catch(e){}return}

var VCACHE_NAME='ty-videos-v1';
function dlSupported(){return ('caches' in window)&&('serviceWorker' in navigator)}
if(dlSupported()){try{navigator.serviceWorker.register('/sw.js').catch(function(){})}catch(e){}}
function dlMB(b){return Math.max(1,Math.round(b/1048576))+' MB'}
function dlTitleMap(){var m={};try{(window.SELF_VIDEO_PACKS||[]).forEach(function(p){for(var k in p){if(!m[p[k].src])m[p[k].src]=p[k].src.split('/').pop()}});
SUBJ_BOOKS.forEach(function(sb){var B=sb.book;if(!B||!B.order)return;B.order.forEach(function(uid){var u=B.units[uid];if(!u||!u.video)return;var key=u.video.bvid+'|'+u.video.p;(window.SELF_VIDEO_PACKS||[]).forEach(function(p){if(p[key])m[p[key].src]=sb.label+' · '+(u.t||u.name||uid)})})})}catch(e){}return m}
function dlBindUnit(btn){var src=btn.getAttribute('data-dlvid'),vtt=btn.getAttribute('data-dlvtt');var stat=btn.parentElement.querySelector('[data-dlstat]');
if(!dlSupported()){btn.style.display='none';if(stat)stat.textContent='';return}
caches.open(VCACHE_NAME).then(function(c){return c.match(src)}).then(function(hit){if(hit){var len=hit.headers.get('content-length');btn.textContent='✓ 已缓存本课（点此删除）';btn.setAttribute('data-dlcached','1');if(stat)stat.textContent=len?('已存到手机 · '+dlMB(parseInt(len,10))):'已存到手机';}});
fetch(src,{method:'HEAD'}).then(function(r){var len=r.headers.get('content-length');if(len&&!btn.getAttribute('data-dlcached')&&stat)stat.textContent='约 '+dlMB(parseInt(len,10))+'，请在 WiFi 下缓存'}).catch(function(){});
btn.addEventListener('click',function(){
if(btn.disabled)return;
if(btn.getAttribute('data-dlcached')){btn.disabled=true;caches.open(VCACHE_NAME).then(function(c){c.delete(src);if(vtt)c.delete(vtt)}).then(function(){btn.removeAttribute('data-dlcached');btn.textContent='📥 缓存本课到手机';btn.disabled=false;if(stat)stat.textContent='已删除'});return}
btn.disabled=true;if(stat)stat.textContent='开始下载…';
caches.open(VCACHE_NAME).then(function(cache){
return fetch(src).then(function(resp){if(!resp.ok)throw new Error('bad');
var total=parseInt(resp.headers.get('content-length')||'0',10);
function saveBlob(blob){return cache.put(src,new Response(blob,{headers:{'content-type':'video/mp4','content-length':String(blob.size)}})).then(function(){if(vtt)return fetch(vtt).then(function(vr){if(vr.ok)return cache.put(vtt,vr)}).catch(function(){})}).then(function(){btn.textContent='✓ 已缓存本课（点此删除）';btn.setAttribute('data-dlcached','1');btn.disabled=false;if(stat)stat.textContent='已存到手机 · '+dlMB(blob.size)+'，没网也能看'})}
if(resp.body&&resp.body.getReader){var reader=resp.body.getReader();var chunks=[];var got=0;
function pump(){return reader.read().then(function(r){if(r.done)return saveBlob(new Blob(chunks,{type:'video/mp4'}));chunks.push(r.value);got+=r.value.length;if(stat)stat.textContent='下载中 '+dlMB(got)+(total?' / '+dlMB(total)+'（'+Math.floor(got/total*100)+'%）':'');return pump()})}
return pump()}
return resp.blob().then(saveBlob);
})}).catch(function(){btn.disabled=false;if(stat)stat.textContent='缓存失败，检查网络后再试一次'});
});}
function fillDlCard(){var box=document.getElementById('dlList');if(!box)return;
if(!dlSupported()){box.innerHTML='<p class="mut">暂无缓存内容。</p>';return}
caches.open(VCACHE_NAME).then(function(c){return c.keys()}).then(function(keys){
var vids=keys.map(function(r){return new URL(r.url).pathname}).filter(function(p){return p.slice(-4)==='.mp4'});
if(!vids.length){box.innerHTML='<p class="mut">还没有缓存任何课。在家里连 WiFi 时，打开一节有本站视频的课，点视频下面的「缓存本课到手机」，到学校没网也能看。</p>';return}
var titles=dlTitleMap();var total=0;var rows='';
return Promise.all(vids.map(function(p){return caches.open(VCACHE_NAME).then(function(c){return c.match(p)}).then(function(hit){var len=hit?parseInt(hit.headers.get('content-length')||'0',10):0;total+=len;rows+='<p style="margin:6px 0;font-size:14.5px">'+esc(titles[p]||p.split('/').pop())+' <span class="mut">'+(len?dlMB(len):'')+'</span> <button class="btn gray" style="width:auto;padding:5px 12px;margin:0" data-dldel="'+p+'">删除</button></p>'})})).then(function(){
box.innerHTML='<p style="margin:4px 0">已缓存 '+vids.length+' 节课，共约 '+dlMB(total)+'。看完的及时删，给手机留空间。</p>'+rows;
box.querySelectorAll('[data-dldel]').forEach(function(b){b.addEventListener('click',function(){var p=b.getAttribute('data-dldel');caches.open(VCACHE_NAME).then(function(c){c.delete(p);c.delete(p.replace(/\.mp4$/,'.vtt'))}).then(fillDlCard)})});
});}).catch(function(){box.innerHTML='<p class="mut">读取缓存失败，刷新后再试。</p>'})}

function pathLv(uid){

function unitEv(uid){
  var ev=pEv(),u=PATH_BOOK.units[uid],out={apply:0,adv:0,redoN:0,redoTot:0,redoDue:0};
  var ue=ev[uid]||{};
  if(ue.apply)out.apply=ue.apply;

    var e=ev[m]||{},n=PATH_BOOK.nodes[m];

    if(e.apply&&!out.apply)out.apply=e.apply;
    if(e.adv&&!out.adv)out.adv=e.adv;
    if(e.redoDue&&(!out.redoDue||e.redoDue<out.redoDue))out.redoDue=e.redoDue;
  });

function pathReviewItems(){

function findPathUnit(kp){
  if(!kp)return null;
  var B=PATH_BOOK,found=null;
  B.order.forEach(function(uid){
    if(found)return;
    var u=B.units[uid];
    for(var i=0;i<u.members.length;i++){if(memberMatchWrong(B.nodes[u.members[i]].name,{knowledge_point:kp})){found=uid;break}}
  });
  return found;
}

function renderConcepts(){
  var list=(D.concepts||[]).filter(function(c){return CONC.subject==='全部'||c.subject===CONC.subject});
  var okSet=lsGet('ty_conc_ok',[]);
  var wN=0;list.forEach(function(c){if(c.wrong)wN++});
  var h='<div class="card">'
    +segHtml([{v:'cards',t:'背卡片'},{v:'concepts',t:'概念清单'}],MEM.view,'memview')
    +subjChipsHtml(CONC.subject,'ksubj')
    +'<p class="mut" style="margin:10px 0">这次考试涉及的概念都在这儿：共 '+list.length+' 个，其中 <b style="color:#dc2626">'+wN+' 个失了分</b>。先攻红的；觉得会了的点"✓ 我会了"打勾自查。</p>';
  list=list.slice().sort(function(a,b){return (b.wrong?1:0)-(a.wrong?1:0)});
  list.forEach(function(c,i){
    var ok=okSet.indexOf(concOkKey(c))>=0;
    h+='<div style="border-top:1px solid #eef1f4;padding:10px 0">'
      +'<div><b>'+esc(c.name)+'</b> <span class="pill">'+esc(c.subject)+'</span> '+(c.wrong?'<span class="pill" style="background:#fee2e2;color:#b91c1c">这次失分</span>':'<span class="pill" style="background:#dcfce7;color:#166534">这次过关</span>')+(ok?' <span class="pill" style="background:#dbeafe;color:#1d4ed8">自查✓</span>':'')+'</div>'
      +'<div style="line-height:1.7;margin-top:4px;white-space:pre-wrap">'+esc(c.core)+'</div>'
      +'<div style="margin-top:6px;display:flex;gap:8px">'
      +(c.keys&&c.keys.length?'<button class="btn gray" data-kjump="'+esc(c.keys[0])+'" style="flex:0 0 auto;width:auto;padding:8px 12px">看这道错题</button>':'')
      +'<button class="btn '+(ok?'gray':'green')+'" data-kok="'+i+'" style="flex:0 0 auto;width:auto;padding:8px 12px;margin-left:auto">'+(ok?'↩ 其实没会':'✓ 我会了')+'</button>'
      +'</div></div>';
  });
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-memview]').forEach(function(b){b.addEventListener('click',function(){MEM.view=b.getAttribute('data-memview');render()})});
  app.querySelectorAll('[data-ksubj]').forEach(function(b){b.addEventListener('click',function(){CONC.subject=b.getAttribute('data-ksubj');renderConcepts()})});
  app.querySelectorAll('[data-kjump]').forEach(function(b){b.addEventListener('click',function(){jumpToWrong(b.getAttribute('data-kjump'))})});
  app.querySelectorAll('[data-kok]').forEach(function(b){b.addEventListener('click',function(){
    var c=list[parseInt(b.getAttribute('data-kok'),10)];var k=concOkKey(c);var arr=lsGet('ty_conc_ok',[]);var ix=arr.indexOf(k);
    if(ix>=0)arr.splice(ix,1);else arr.push(k);
    lsSet('ty_conc_ok',arr);renderConcepts();
  })});
  afterNav();
}
function renderAsk(){
  var newUrl='https://github.com/santalin87/zk-study/issues/new?labels=tianya-q&title='+encodeURIComponent('[提问] ')+'&body='+encodeURIComponent('科目：\n题目（可以把题目打出来，或者写试卷第几题）：\n\n我卡在哪里：\n');
  var h='<div class="card"><h2 style="margin-top:0">我要提问</h2>'
    +'<p>遇到弄不懂的题，点下面按钮提交。爸爸和 AI 老师看到后会回答，答案会出现在这个页面下面。不用等，提交完先去做别的题。</p>'
    +'<a class="btn" href="'+newUrl+'" target="_blank" rel="noopener">提交新问题（需要登录 GitHub）</a>'
    +'<p class="mut">没有 GitHub 账号的话，把问题发给爸爸代提交也行。</p></div>'
    +'<div class="card"><h2 style="margin-top:0">我的问题</h2><div id="qaList"><p class="mut">加载中…</p></div></div>';
  app.innerHTML=h;
  fetch('https://api.github.com/repos/santalin87/zk-study/issues?labels=tianya-q&state=all&per_page=50')
    .then(function(r){return r.json()})
    .then(function(list){
      var box=document.getElementById('qaList');
      if(!box)return;
      if(!Array.isArray(list)||!list.length){box.innerHTML='<p class="mut">还没有提过问题</p>';return}
      box.innerHTML=list.map(function(it){
        return '<div class="qa"><b>'+esc(it.title)+'</b> <span class="pill">'+(it.state==='open'?'等回答':'已回答/关闭')+'</span>'
          +'<p style="white-space:pre-wrap;line-height:1.7">'+esc(it.body||'')+'</p>'
          +'<button class="btn gray" data-c="'+it.number+'" style="margin:0">看回答（'+it.comments+'）</button><div id="cmt'+it.number+'"></div></div>';
      }).join('');
      box.querySelectorAll('[data-c]').forEach(function(b){
        b.addEventListener('click',function(){
          var n=b.getAttribute('data-c');
          fetch('https://api.github.com/repos/santalin87/zk-study/issues/'+n+'/comments')
            .then(function(r){return r.json()})
            .then(function(cs){
              document.getElementById('cmt'+n).innerHTML=(cs||[]).map(function(c){
                return '<div class="ans"><b>'+esc(c.user.login)+'：</b>\n'+esc(c.body||'')+'</div>';
              }).join('')||'<p class="mut">还没有回答</p>';
            });
        });
      });
    })
    .catch(function(){
      var box=document.getElementById('qaList');
      if(box)box.innerHTML='<p class="mut">网络不通，暂时加载不了问题列表</p>';
    });
}
/* ===== 学习统计（孩子自己看：昨日 / 近一周 / 近一个月，X 分析式柱形图） ===== */
function renderStats(){
  var days=doneDays();
  function tot(ds){var e=dayEntry(ds);return (e.rate||0)+(e.prac||0)}
  function chart(n){
    var max=0,i,ds;
    for(i=n-1;i>=0;i--){var v=tot(dstr(i));if(v>max)max=v}
    var h='<div class="chart">';
    for(i=n-1;i>=0;i--){
      ds=dstr(i);var v2=tot(ds);
      var pct=v2&&max?Math.max(Math.round(v2/max*100),10):0;
      var lab=n<=7?wdOf(ds):(i%5===0||i===0?ds.slice(5).replace('-','/'):'');
      h+='<div class="col"><div class="v">'+(v2||'')+'</div><div class="b'+(i===0?' today':(v2?'':' zero'))+'" style="height:'+(v2?pct:3)+'%"></div><div class="d">'+lab+'</div></div>';
    }
    return h+'</div>';
  }
  function sumN(n){
    var s={rate:0,yes:0,no:0,prac:0,pracOk:0,chk:0};
    for(var i=0;i<n;i++){var ds=dstr(i);var e=dayEntry(ds);s.rate+=e.rate||0;s.yes+=e.yes||0;s.no+=e.no||0;s.prac+=e.prac||0;s.pracOk+=e.pracOk||0;if(days[ds])s.chk++}
    return s;
  }
  var yds=dstr(1),ye=dayEntry(yds),ytot=(ye.rate||0)+(ye.prac||0);
  var h='<div class="card"><h2 style="margin-top:0">昨日学习情况（'+mdOf(yds)+' '+wdOf(yds)+'）</h2>';
  if(!ytot&&!days[yds]){
    h+='<p class="mut">昨天没有留下学习记录。今天补上，从今天开始每天的都会记在这里。</p>';
  }else{
    h+='<div class="statgrid">'
      +'<div class="sg"><b>'+ytot+'</b><span>总学习次数</span></div>'
      +'<div class="sg"><b>'+(ye.rate||0)+'</b><span>复习卡片（张）</span></div>'
      +'<div class="sg"><b>'+(ye.yes||0)+' / '+(ye.no||0)+'</b><span>会了 / 不会</span></div>'
      +'<div class="sg"><b>'+(ye.pracOk||0)+' / '+(ye.prac||0)+'</b><span>练习答对 / 共做</span></div>'
      +'</div><p style="margin:8px 0 0">打卡：'+(days[yds]?'已完成 ✓':'未完成')+'</p>';
  }
  h+='</div>';
  var s7=sumN(7);
  h+='<div class="card"><h2 style="margin-top:0">近一周（近 7 天）</h2>'
    +'<p class="mut" style="margin:0">共学习 '+(s7.rate+s7.prac)+' 次 · 评卡 '+s7.rate+' 张（会了 '+s7.yes+'、不会 '+s7.no+'）· 练习 '+s7.prac+' 题（答对 '+s7.pracOk+'）· 打卡 '+s7.chk+' 天</p>'
    +chart(7)
    +'<p class="mut">最右边一根是今天，柱子越高，当天学得越多。</p></div>';
  var s30=sumN(30);
  h+='<div class="card"><h2 style="margin-top:0">近一个月（近 30 天）</h2>'
    +'<p class="mut" style="margin:0">共学习 '+(s30.rate+s30.prac)+' 次 · 评卡 '+s30.rate+' 张 · 练习 '+s30.prac+' 题 · 打卡 '+s30.chk+' 天 · 当前连续打卡 '+streak()+' 天</p>'
    +chart(30)
    +'<p class="mut" style="margin:10px 0 2px">打卡记录（蓝色 = 当天学过并打卡）：</p><div class="dots">';
  for(var j=29;j>=0;j--){h+='<i class="'+(days[dstr(j)]?'on':'')+'"></i>'}
  h+='</div><p class="mut">逐日次数从 '+mdOf(todayStr())+' 起开始记录；这之前的柱子偏低不代表没学，那时还没开始逐日记——打卡那排是全的，可以对照看。</p></div>';
  app.innerHTML=h;
}
/* ===== 学习报告 ===== */
function renderReport(){
  var order=['语文','英语','数学','物理','历史','政治','生物','地理','化学'];
  var map={};D.scores.forEach(function(x){map[x.subject]=x});
  var total=0,full=0;
  var h='<div class="card"><h2 style="margin-top:0">成绩看板 · 高一上第一次月考</h2>';
  order.forEach(function(s){
    var x=map[s];if(!x)return;
    total+=x.score;full+=x.full;
    var pct=Math.round(x.score/x.full*100);
    h+='<div style="margin:8px 0"><div>'+s+' <b>'+x.score+'</b> / '+x.full+'（'+pct+'%）</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  });
  h+='<p><b>总分 '+total+' / '+full+'</b></p></div>';
  (function(){
    var cs=D.concepts||[];if(!cs.length)return;
    var byS={};
    cs.forEach(function(c){byS[c.subject]=byS[c.subject]||{t:0,w:0};byS[c.subject].t++;if(c.wrong)byS[c.subject].w++});
    var totW=0;cs.forEach(function(c){if(c.wrong)totW++});
    h+='<div class="card"><h2 style="margin-top:0">概念地基盘点</h2><p class="mut">这次考试共涉及 '+cs.length+' 个概念，其中 '+totW+' 个失了分（病根 1 的明细账）：</p>';
    order.forEach(function(s){var b=byS[s];if(!b)return;h+='<p style="margin:4px 0">'+s+'：失分概念 <b style="color:#dc2626">'+b.w+'</b> / 共 '+b.t+' 个</p>'});
    h+='<button class="btn" onclick="goConcepts()">去概念清单逐个补洞</button></div>';
  })();
  h+='<div class="card"><h2 style="margin-top:0">五个病根</h2>'
    +'<p><b>1. 概念地基有洞</b>——化学方程式从不配平、地理把"大气逆辐射"写成"反射"。不是粗心，是真不会。</p>'
    +'<p><b>2. 输出说不到点上</b>——政治材料题丢 26 分、历史主观题丢 17 分。有话，但写不到得分点上。</p>'
    +'<p><b>3. 选择题暗坑</b>——概念边界不清，一比较就选错。错题遮住答案重做，才算真会。</p>'
    +'<p><b>4. 大题空白/没写完</b>——物理刹车题、化学大题整片空白；数学第 19 题考试时写跑偏了（试卷上的完整解法是考后评讲订正补的，订正懂了不等于考试会做）。先保证每道题都按框架动笔。</p>'
    +'<p><b>5. 关系类判断成对翻车</b>——充分/必要方向、相等与包含、中书省与门下省。成对概念要成对记、互相辨析。</p></div>';
  var sr=srAll();var boxes=[0,0,0,0,0,0,0];
  CARDS.forEach(function(c){boxes[srGet(c.id).box]++});
  var pracDone=lsGet('ty_prac_done',{});var pracOk=0,pracN=0;
  Object.keys(pracDone).forEach(function(k){pracN++;if(pracDone[k])pracOk++});
  h+='<div class="card"><h2 style="margin-top:0">我的进度（这台设备）</h2>'
    +'<p>连续打卡：<b>'+(typeof Streak!=='undefined'?Streak._load().currentStreak:streak())+'</b> 天（最长 '+(typeof Streak!=='undefined'?Streak._load().longestStreak:streak())+' 天）</p>'
    +'<p>卡片熟练度分布（盒子 0 到 6，越高越熟）：'+boxes.join(' · ')+'，共 '+CARDS.length+' 张</p>'
    +'<p>专项练习已做：'+pracN+' 题，答对 '+pracOk+' 题</p>'
    +'<p class="mut">进度存在这台手机的浏览器里，换手机不会同步。每天打开做一点，比一次做很多更管用。</p>'
    +'<button class="btn" onclick="TODAY.view=\'stats\';render()">看我的学习统计（昨日 / 近一周 / 近一个月）</button></div>';
  app.innerHTML=h;
}
/* 站内后退：左滑/返回键 = 退到上一个步骤（上一张卡/上一页/讲解退回题目），退到第一步才提示退出 */
var NAV={lastSnap:'',applying:false};
function navSnapshot(){
  var c=(CARD.list&&CARD.list[CARD.idx])||null;
  return {tab:curTab,tv:TODAY.view,mv:MEM.view,hv:HUB.view,
    cs:CARD.subject,ct:CARD.status,cd:CARD.dueOnly,cid:c?c.id:'',cst:CARD.stage,cpk:CARD.picked,cco:CARD.checkOpen,cfl:CARD.flipped,
    cpi:CARD.planIds?CARD.planIds.join(','):'',cpl:CARD.planLabel,cix:CARD.idx,
    ps:PRAC.subject,pi:PRAC.idx,po:PRAC.only,ds:DICT.set,di:DICT.idx,dr:DICT.revealed,ks:CONC.subject};
}
function afterNav(){
  if(NAV.applying)return;
  try{
    var s=JSON.stringify(navSnapshot());
    if(s===NAV.lastSnap)return;
    NAV.lastSnap=s;
    history.pushState({snap:s},'');
  }catch(e){}
}
function applySnap(s){
  curTab=s.tab;TODAY.view=s.tv;MEM.view=s.mv;HUB.view=s.hv;
  CARD.subject=s.cs;CARD.status=s.ct;CARD.dueOnly=s.cd;CARD.stage=s.cst;CARD.picked=s.cpk;CARD.checkOpen=s.cco;CARD.flipped=s.cfl;
  PRAC.subject=s.ps;PRAC.idx=s.pi;PRAC.only=s.po;
  DICT.set=s.ds;DICT.idx=s.di;DICT.revealed=s.dr;
  CONC.subject=s.ks;
  if(s.cpi){CARD.planIds=s.cpi.split(',');CARD.planLabel=s.cpl||'';CARD.idx=s.cix||0;window.__jumpId=null}
  else if(s.cid&&(s.tab==='book'||s.tab==='memory'||s.tab==='fav')){CARD.planIds=null;window.__jumpId=s.cid}
  else{CARD.planIds=null;window.__jumpId=null}
  var bs=document.querySelectorAll('#tabs button');
  bs.forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===curTab)});
}
function showExitBar(){
  var bar=document.getElementById('exitBar');
  if(!bar)return;
  bar.style.display='block';
  clearTimeout(window.__ebT);
  window.__ebT=setTimeout(function(){bar.style.display='none'},5000);
}
window.addEventListener('popstate',function(e){
  if(e.state&&e.state.snap){
    NAV.applying=true;
    try{applySnap(JSON.parse(e.state.snap));NAV.lastSnap=e.state.snap;render()}catch(err){}
    NAV.applying=false;
  }else{
    try{history.pushState({boot:1},'')}catch(err){}
    showExitBar();
  }
});
try{history.pushState({boot:1},'')}catch(e){}
try{var _cs=lsGet('ty_subj',CUR_SUBJ);if(SUBJ_LABEL[_cs])CUR_SUBJ=_cs}catch(e){}
PRAC.subject=SUBJ_LABEL[CUR_SUBJ];CARD.subject=SUBJ_LABEL[CUR_SUBJ];
var _sbk=subjBook(CUR_SUBJ);if(CUR_SUBJ!=='math'&&_sbk){PATH_SUBJ=CUR_SUBJ;PATH_BOOK=_sbk;PATHV.view='list';PATHV.id=null;}
try{if(window.Streak){Streak.settleOnLoad();Streak.updateHeader()}}catch(e){}
render();

</script>
