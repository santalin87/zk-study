<script id="cards-data" type="application/json">[{"a": "框架：传播机制→关系结构→信息特点→功能定位→舆论作用。要点：微博=广场式裂变传播、弱联系（粉丝关系）、媒体属性、制造热点；微信=社群圈层传播、强联系（熟人关系）、社交属性、沉淀共识。强联系信任高但视野窄（回声室），弱联系公共性强但信任低。", "freq": 3, "q": "微博与微信的区别（论述题）", "tag": "论述"}, {"a": "定义：通过传感设备按约定协议把物品与互联网连接，实现智能化识别、定位、跟踪、监控和管理的网络技术，本质是“万物互联”。架构：感知层（信息采集）、网络层（传输）、应用层。意义：生产、生活、媒体生态（万物皆媒）、社会治理变革；挑战是数据安全、隐私、标准统一。", "freq": 2, "q": "物联网技术及其意义（论述题）", "tag": "论述"}, {"a": "一、机器写作常态化（程式化、数据密集型报道自动化）；二、人机协同（记者负责深度判断，机器负责抓取、初稿）；三、算法分发主导（千人千面，但带来信息茧房、回声室）；四、UGC/PGC/AGC融合，主体多元化；五、机器替代重复劳动，记者竞争力转向调查能力与思想深度。", "freq": 1, "q": "智能化媒体时代新闻生产的新模式（论述题）", "tag": "论述"}, {"a": "由伊丽莎白·诺尔-诺依曼提出。四环节：对孤立的恐惧→对意见气候的判断→发声或沉默的选择→螺旋式强化（多数越发声越壮大，少数越沉默越萎缩）。网络变异：匿名降低孤立恐惧使少数更易发声；算法“信息茧房/回声室”让人误以为小圈子意见即多数；群体极化是螺旋在网络圈群中的表现。", "freq": 1, "q": "网络中“沉默的螺旋”的形成机制（论述题）", "tag": "论述"}, {"a": "格兰诺维特提出：强联系=亲密、频繁、多维（如亲友），弱联系=疏远、低频、单一（如网友）。朋友圈强联系→信任度高、说服力强，但同质化、易回声室；视频号弱联系→传播广、公共性强，但信任度低、需权威背书。结论：用强联系做信任背书，用弱联系做范围扩散，兼得“传得开”与“信得过”。", "freq": 1, "q": "运用强联系/弱联系理论分析新闻信息信任度（论述题）", "tag": "论述"}, {"a": "陪伴需求、互动快感、归属感、打赏的权力感、从众与围观心理。", "freq": 1, "q": "社交互动性直播的心理动因（论述题）", "tag": "论述"}, {"a": "要点：VR/AR技术、社交媒体的拟剧化生存、线上线下消费打通、元宇宙概念；答题时展开融合的表现与界限。", "freq": 1, "q": "互联网如何推动虚拟世界与现实世界的融合（论述题）", "tag": "论述"}, {"a": "结合媒介素养作答：主动管理使用时间、辨别信息真伪、保持线下社交、不做“低头族”。（24全国综合应用题材料为“放下手机、面对真实世界”。）", "freq": 1, "q": "如何善用手机媒体（论述题）", "tag": "论述"}, {"a": "特征：用户既是接收者也是生产者（UGC）；去中心化、人人可参与；互动性强；内容海量化。意义：打破传统媒体信息垄断，实现“自下而上”传播；催生博客、Wiki、SNS；为自媒体、社交媒体时代奠定基础。Web1.0是“只读”门户模式。", "freq": 2, "q": "简述Web2.0的特征和意义", "tag": "简答"}, {"a": "广场式公开传播（信息公开可见、可触达陌生人）；裂变式扩散（转发链无限延伸）；碎片化（短平快，适合即时发布）；弱联系（单向关注的粉丝关系）；媒体属性强（突发新闻首发地、议程设置能力强）。", "freq": 1, "q": "简述微博的传播特点", "tag": "简答"}, {"a": "编辑主导（专业编辑筛选加工）；单向传播（用户只能被动接收，“只读互联网”）；中心化（新浪、搜狐、网易垄断流量入口）；内容同质化（各门户内容高度相似，竞争靠速度和包装）。", "freq": 1, "q": "简述Web1.0时代“大众门户”模式的特点", "tag": "简答"}, {"a": "传播机制：微博广场裂变 vs 微信圈层社群；关系结构：微博弱联系 vs 微信强联系；信息信任：微博广度大信任低 vs 微信信任高视野窄；功能定位：微博媒体属性 vs 微信社交属性；舆论作用：微博制造热点 vs 微信沉淀共识。", "freq": 1, "q": "简述微博与微信的区别", "tag": "简答"}, {"a": "即时性（信息实时到达）；交互性（双向多轮对话、可即时反馈）；私密性（一对一或小圈层）；情感性（熟人关系情感连接强）；多媒体化（文字、语音、视频、表情包综合运用）。", "freq": 1, "q": "简述网络人际传播的渠道特点", "tag": "简答"}, {"a": "加速舆论形成（话题迅速发酵）；下沉传播（深入家族群等私域，扩大覆盖）；情绪化助推（熟人背书使情绪易传染）；谣言温床（“内部消息”难核验、辟谣难）；动员功能（群聊便于组织行动，线上舆论易转线下）。", "freq": 1, "q": "简述即时通信传播对舆论形成的影响", "tag": "简答"}, {"a": "社交类：微信、微博；新闻资讯类：今日头条、澎湃新闻；短视频类：抖音、快手；问答/社区类：知乎、小红书；直播类：斗鱼、抖音直播。（列举5个不同类型即可）", "freq": 1, "q": "请列举五个不同类型的移动端新媒体应用", "tag": "简答"}, {"a": "内容为王（做强原创、做精垂直）；技术赋能（优化算法，兼顾个性化与主流价值）；用户运营（增强互动、发展会员制）；融合发展（结合短视频、直播）；盈利模式（广告+付费+政务服务多元变现）。", "freq": 1, "q": "简述新闻客户端的发展对策", "tag": "简答"}, {"a": "信息茧房（视野越收越窄）；回声室效应（加剧群体极化）；标题党泛滥（劣币驱逐良币）；价值观偏差（流量至上）；隐私问题（过度采集用户数据）。", "freq": 1, "q": "简述目前新闻推荐算法存在的问题", "tag": "简答"}, {"a": "可直接穿戴在身上或整合进服装、配件中的便携式智能设备，如智能手表、智能手环、VR眼镜。特点：贴近人体、持续在线、感知环境；是物联网在个人层面的典型应用、“万物皆媒”的硬件入口。", "freq": 1, "q": "可穿戴设备是什么", "tag": "名解"}, {"a": "虚拟现实，利用计算机生成完全沉浸式的三维虚拟环境的技术，用户佩戴设备后与现实世界隔绝。与AR共同推动虚拟世界与现实世界的融合，是下一代媒体形态的重要技术基础。", "freq": 1, "q": "VR是什么", "tag": "名解"}, {"a": "增强现实，将虚拟信息叠加到现实世界的技术，虚实结合。与VR共同推动虚拟世界与现实世界的融合。", "freq": 1, "q": "AR是什么", "tag": "名解"}, {"a": "由哈贝马斯提出，指介于国家与私人领域之间、公民自由讨论公共事务的话语空间，如咖啡馆、沙龙、网络论坛。理想状态是理性、平等、公开的讨论；网络论坛、微博广场是数字时代的新型公共领域。", "freq": 1, "q": "公共领域是什么", "tag": "名解"}, {"a": "即Social Networking Services（社交网络服务），是基于现实或虚拟社会关系、提供信息发布和互动交流的网络平台，如微信、微博、QQ。核心是人际关系链。", "freq": 1, "q": "SNS是什么", "tag": "名解"}, {"a": "群体成员经过讨论协商后，意见向更极端的方向偏移的现象。网络空间中回声室效应和算法推荐加剧群体极化，使温和意见边缘化、极端意见被强化，是网络舆论非理性化的重要机制。", "freq": 1, "q": "群体极化是什么", "tag": "名解"}, {"a": "通过传感器、射频识别等设备，按约定协议将物品与互联网连接，实现智能化识别、定位、跟踪、监控和管理的网络技术。其实质是“万物互联”，架构包括感知层、网络层、应用层三层。", "freq": 2, "q": "物联网技术是什么", "tag": "名解"}, {"a": "围绕某一新闻事件或主题，集中、多角度、持续进行报道的新闻产品形态。类型包括全面集纳型、动态型、静态型、采访型、事件型（口诀“全动静采事”），是网络媒体深度报道的主要形式。", "freq": 4, "q": "新闻专题是什么", "tag": "名解"}, {"a": "即HTML5，移动端广泛应用的交互式页面技术标准。H5页面以图文、音频、视频、互动测试相结合的形式呈现内容，具有传播便捷、体验沉浸、易于分享的特点，是移动新闻创新的代表形态。", "freq": 1, "q": "H5是什么", "tag": "名解"}, {"a": "以数据为核心素材，运用数据挖掘、可视化技术进行新闻报道的新形态。生产流程包括数据获取、清洗、分析、可视化呈现，体现“用数据说话”的新闻理念，是智能化媒体时代的重要新闻生产模式。", "freq": 1, "q": "数据新闻是什么", "tag": "名解"}, {"a": "用户既是接收者也是生产者的互联网应用模式，以博客、Wiki、SNS为代表。与Web1.0“只读”门户模式不同，Web2.0实现了去中心化、人人可参与，奠定了社交媒体时代的基础。", "freq": 2, "q": "Web2.0是什么", "tag": "名解"}, {"a": "个人或小团队依托网络平台自主生产、发布内容的传播主体，如公众号、UP主、博主。特点是门槛低、个性化、交互强。", "freq": 1, "q": "自媒体是什么", "tag": "名解"}, {"a": "整合文字、图片、音频、视频、数据等多种媒介形态、进行跨平台呈现的新闻产品。打破单一文体界限，以多媒体、交互式方式讲好一个新闻故事，是媒介融合在内容生产层面的体现。", "freq": 1, "q": "融合性新闻是什么", "tag": "名解"}, {"a": "一种多人协作编写的超文本系统，最典型的是维基百科。特点是开放编辑、版本留痕、集体智慧，体现了Web2.0时代用户生产内容的精神，也带来信息权威性方面的争议。", "freq": 1, "q": "Wiki是什么", "tag": "名解"}, {"a": "理论由麦库姆斯和唐纳德·肖提出，认为大众媒介通过选择和强调某些议题，告诉公众“想什么”（而不是“怎么想”），从而影响公众对议题重要性的判断。", "freq": 1, "q": "议程设置是什么", "tag": "名解"}, {"a": "具有独立操作系统、可安装应用软件、持续联网的移动电话。它是手机媒体的核心终端，集通信、娱乐、支付、办公于一体，使用户“永远在线”，成为人体器官的延伸。", "freq": 1, "q": "智能手机是什么", "tag": "名解"}, {"a": "第五代移动通信技术，具有高速率、低时延、大连接三大特性。为4K/8K视频、VR/AR、物联网、自动驾驶等应用提供网络基础，是智能化媒体时代的关键基础设施。", "freq": 1, "q": "5G是什么", "tag": "名解"}, {"a": "用于解释用户接受新技术的心理机制的模型，核心变量是感知有用性和感知易用性：用户觉得一项技术有用且好用，才会采纳。是新媒体用户研究的基础模型之一。", "freq": 1, "q": "技术采纳模型（TAM）是什么", "tag": "名解"}, {"a": "认为个体行为意向取决于行为态度、主观规范和知觉行为控制三个因素的理论。常用于解释网民的信息分享、媒介使用等行为，是新媒体效果研究的重要理论工具。", "freq": 1, "q": "计划行为理论（TPB）是什么", "tag": "名解"}, {"a": "个体只关注自己感兴趣的信息、视野日益狭窄，如同生活在蚕茧中的现象。其个人表征是“个人日报”。它是算法推荐的负效应之一，与回声室效应、群体极化构成网络心理效应链。", "freq": 2, "q": "信息茧房是什么", "tag": "名解"}, {"a": "哈贝马斯", "freq": 1, "q": "提出“公共领域”理论的学者是", "tag": "选择"}, {"a": "浦尔", "freq": 1, "q": "《自由的技术》中提出“媒介融合”概念的学者是", "tag": "选择"}, {"a": "卡斯特", "freq": 1, "q": "提出“流动的空间”概念的学者是", "tag": "选择"}, {"a": "库尔特·卢因", "freq": 1, "q": "提出“把关人”理论的学者是", "tag": "选择"}, {"a": "拉扎斯菲尔德", "freq": 1, "q": "提出“两级传播”理论的学者是", "tag": "选择"}, {"a": "威廉·吉布森", "freq": 1, "q": "《神经漫游者》中提出“赛博空间”概念的作者是", "tag": "选择"}, {"a": "标点符号的重度使用", "freq": 3, "q": "社交媒体文章标题的特性是____（三卷选择第10题连考）", "tag": "选择"}, {"a": "来源陷阱、时间陷阱、专业陷阱、情绪/情感/认知框架陷阱", "freq": 3, "q": "网络假新闻陷阱包括哪四类", "tag": "选择"}, {"a": "情绪框架陷阱", "freq": 3, "q": "“喝酒能抗癌”式急于贴标签属于哪种假新闻陷阱", "tag": "选择"}, {"a": "专业陷阱", "freq": 3, "q": "“抢独家未经求证刊发”属于哪种假新闻陷阱", "tag": "选择"}, {"a": "全面集纳型、动态型、静态型、采访型、事件型（口诀：全动静采事）", "freq": 4, "q": "新闻专题的五种类型是", "tag": "选择"}, {"a": "事件型、静态型、采访型", "freq": 3, "q": "三卷选择连考新闻专题类型：2022.4考____、2022.10考____、2023.4考____", "tag": "选择"}, {"a": "原生网络媒体、合作型新闻网站、聚合型新闻网站、新型网络媒体（聚合型实例：《赫芬顿邮报》、BuzzFeed）", "freq": 2, "q": "新闻网站的四种类型是", "tag": "选择"}, {"a": "蒂姆·伯纳斯-李，1989年", "freq": 2, "q": "WWW技术的构想者及其提出年份", "tag": "选择"}, {"a": "情感连接、话语权利相对平等", "freq": 1, "q": "微信朋友圈传播的特点是", "tag": "选择"}, {"a": "麦库姆斯和唐纳德·肖", "freq": 1, "q": "议程设置理论的提出者是", "tag": "选择"}, {"a": "社会整合作用", "freq": 1, "q": "麦库姆斯和唐纳德·肖还提出议程设置具有哪项社会功能（2022.4选择13考）", "tag": "选择"}, {"a": "基于位置的服务", "freq": 1, "q": "LBS的全称是", "tag": "选择"}, {"a": "基站定位+GPS", "freq": 1, "q": "手机定位主要依靠的技术是", "tag": "选择"}, {"a": "信息茧房→回声室→群体极化", "freq": 1, "q": "网络心理效应链的三环依次是", "tag": "选择"}, {"a": "小圈子信息加强（同类观点相互强化）", "freq": 1, "q": "回声室效应的题眼是", "tag": "选择"}, {"a": "个人日报", "freq": 1, "q": "2024全国卷选择15：信息茧房的个人表征是", "tag": "选择"}, {"q": "媒体是什么", "a": "又称媒介、媒质，是承载信息的载体。《现代汉语词典》解释为“交流、传播信息的工具，如报刊、广播、电视、互联网等”。", "freq": 1, "tag": "名解"}, {"q": "新媒体是什么", "a": "借助计算机传播信息的载体。手机媒体是借助手机进行信息传播的工具，并非独立的媒体形态（即非“第五媒体”），而是网络媒体的延伸。", "freq": 1, "tag": "名解"}, {"q": "媒体生态系统是什么", "a": "以传媒产品生产和传播为核心的相关要素的组合，包括传媒通过版面和节目反映出来的外在形态，以及频道（率）、人力、受众、信息集纳渠道、广告支持等。", "freq": 1, "tag": "名解"}, {"q": "受众是什么", "a": "信息传播的接受者，包括报刊和书籍的读者、广播的听众、电影电视的观众与网民。从宏观上看是一个巨大的集合体，从微观上看则体现为具有丰富社会多样性的人。", "freq": 1, "tag": "名解"}, {"q": "用户是什么", "a": "一般指接受社会某种有偿服务的客户，如接受照明、宽带、视听、通信、供暖、供水、供气等服务的客户。", "freq": 1, "tag": "名解"}, {"q": "创新扩散理论是什么", "a": "由罗杰斯于20世纪60年代提出的关于通过媒介劝服人们接受新观念、新事物及新产品的理论，侧重于大众传播对社会和文化的影响。传播过程用一条S形曲线描述，分为知晓、劝服、决策、证实4个阶段。", "freq": 1, "tag": "名解"}, {"q": "人际传播是什么", "a": "个人与个人之间的信息传播活动，是由两个个体系统相互连接组成的信息传播系统。大致分两种方式：面对面传播；借助某种有形物质媒介的传播。", "freq": 1, "tag": "名解"}, {"q": "情感因素是什么", "a": "人在交际活动中，认识到某个客体的价值，体验到客体是否能满足自己的需要，并由此而产生的相应心理活动。", "freq": 1, "tag": "名解"}, {"q": "短信传播是什么", "a": "从技术角度看，是一种非实时的、非语音的数据通信业务。它可以由移动通信终端（手机）发起，也可由移动网络运营商的短信服务器发起，还可以由与移动运营商短信平台互联的网络业务提供商SP发起。", "freq": 1, "tag": "名解"}, {"q": "微信是什么", "a": "腾讯公司打造的一款社交软件，2011年1月21日正式推出。支持跨通信运营商、跨操作系统平台通过网络快速发送语音短信、视频、图片和文字；提供公众平台、朋友圈、消息推送等功能。", "freq": 1, "tag": "名解"}, {"q": "移动互联网是什么", "a": "通过智能移动终端、采用移动无线通信方式获取业务和服务的新兴业态，它将移动通信和互联网络两者结合为一体。", "freq": 1, "tag": "名解"}, {"q": "人际沟通是什么", "a": "两人或两人以上面对面或凭借书信、电话等简单媒介（非大众传播媒介）进行的信息交流活动。", "freq": 1, "tag": "名解"}, {"q": "强联系与弱联系理论是什么", "a": "格兰诺维特1973年在论文《弱联系的力量》中提出。强联系指每个人接触最频繁的亲人、同学、朋友、同事，构成稳定但传播范围有限的社会认知；弱联系指更广泛、更肤浅的社会认知。微信通讯录多为强联系，因此其中新闻信息信任度高。", "freq": 1, "tag": "名解"}, {"q": "客户端是什么", "a": "与服务器相对应，为客户提供本地服务的程序或终端。", "freq": 1, "tag": "名解"}, {"q": "手机新闻客户端是什么", "a": "为客户提供新闻资讯、实现移动服务的程序或终端；是基于移动互联网技术、满足受众在手机端实现新闻阅读的时代产物。", "freq": 1, "tag": "名解"}, {"q": "付费墙是什么", "a": "传统报纸对其在线内容实行有价阅读而建立的支付模式。但中国的网民虽然愿意为内容付费，却不愿意为新闻付费。", "freq": 1, "tag": "名解"}, {"q": "抖音是什么", "a": "一款可以拍短视频的音乐创意短视频社交软件，2016年9月上线，是一个专注年轻人音乐短视频社区的平台。用户可选择歌曲、拍摄音乐短视频，形成自己的作品。", "freq": 1, "tag": "名解"}, {"q": "算法是什么", "a": "新闻推荐语境下：根据用户的年龄、性别、兴趣等个人属性，结合种族、经济、社交等社会特征以及历史行为数据，构建多维度用户画像，同时综合考量信息产品与用户的地理和技术环境，实现精准的信息适配与新闻分发。", "freq": 1, "tag": "名解"}, {"q": "算法价值是什么", "a": "一套区别于传统新闻价值的判断标准体系，用于决策内容的选取与排除，决定了在算法驱动的新闻源中哪些内容要素得以展现。", "freq": 1, "tag": "名解"}, {"q": "隐私权是什么", "a": "概念源于1890年第4期《哈佛法律评论》中的《论隐私权》。我国2021年1月1日施行的民法典将个人数据、网络虚拟财产等纳入保护范围。", "freq": 1, "tag": "名解"}, {"q": "手机定位是什么", "a": "通过特定的定位技术来获取移动手机或终端用户的位置信息（经纬度坐标），在电子地图上标出被定位对象位置的技术或服务。", "freq": 1, "tag": "名解"}, {"q": "基于位置的服务（LBS）是什么", "a": "通过位置信息帮助用户与移动设备进行交互的服务。功能有4类：基于位置发送定向广告、基于位置创新产品应用、基于位置进行重大决策、基于位置优化治安及案件侦破。", "freq": 1, "tag": "名解"}, {"q": "上下文感知服务是什么", "a": "位置信息所揭露出的个人隐私并不局限于位置信息本身；用户的位置信息还可以与其他信息结合，进而从扩展区域推断出语义含义。", "freq": 1, "tag": "名解"}, {"q": "关联方共享是什么", "a": "互联网企业将本平台收集到的用户个人信息，与其他关联公司、合作机构共享。", "freq": 1, "tag": "名解"}, {"q": "星链卫星网络是什么", "a": "美国太空探索技术公司（SpaceX）推进的庞大低轨卫星通信系统，目的是提供全球高速互联网服务。优势：通信速度快、带宽大、延迟短、效费比较高，不受复杂地形、恶劣气候及复杂电磁环境影响。", "freq": 1, "tag": "名解"}, {"q": "今日头条是什么", "a": "北京字节跳动开发的一款基于数据挖掘的推荐引擎产品，为用户推荐信息，提供连接人与信息的服务。", "freq": 1, "tag": "名解"}]</script>

var KEY='zk_cards_'+SLUG;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.known&&s.wrong)return s;}catch(e){}return {known:[],wrong:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
var store=load();
var queue=[],retry=[],qi=0,roundTotal=0,roundKnown=0,roundAttempted={},phase='';
var TAGC={"名解": "#2a7a4b", "简答": "#b3541e", "论述": "#7a3b12", "选择": "#1a6fa8", "综合": "#6a3fa0", "填空": "#1a6fa8"};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n').join('<br>');}
function freqLabel(f){var hot=f>=2?' hot':'';return '<span class="freq'+hot+'">真题考过 '+f+' 次</span>';}
function tagPill(t){var c=TAGC[t]||'#888';return '<span class="tag" style="background:'+c+'">'+esc(t)+'</span>';}
function knownCount(){return store.known.length;}
function paintProg(done,total){
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ptext').textContent='已掌握 '+knownCount()+' / '+RAW.length+'（本轮 '+done+'/'+total+'）';
}
function startScreen(){
  phase='menu';paintProg(0,0);setTab(true);paintWCount();
  var nWrong=store.wrong.length;
  var h='<div class="center">共 '+RAW.length+' 张卡片<br>已掌握 '+knownCount()+' 张 · 待加强 '+nWrong+' 张<br><br>'+
    '<div class="btnrow"><button class="btn-show" onclick="startRound(\'full\')">开始自测</button></div>';
  if(nWrong){h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">只练错题（'+nWrong+'）</button></div>';}
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
  document.getElementById('b-retry').disabled=!nWrong;
}
function startRound(mode){
  roundAttempted={};roundKnown=0;
  if(mode==='wrong'){queue=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});}
  else{queue=ORDER.slice();}
  retry=[];qi=0;roundTotal=queue.length;phase='quiz';
  if(!queue.length){startScreen();return;}
  showCard(false);
}
function showCard(revealed){
  var i=queue[qi],c=RAW[i],st=document.getElementById('stage');
  paintProg(qi,roundTotal);
  var h='<div class="fcard">'+freqLabel(c.freq)+tagPill(c.tag)+'<div class="q">'+esc(c.q)+'</div>';
  if(revealed){
    h+='<div class="a"><div class="alabel">✓ 答案要点</div>'+esc(c.a)+'</div></div>';
    h+='<div class="btnrow"><button class="btn-know" onclick="mark(true)">会 ✓</button><button class="btn-unknow" onclick="mark(false)">不会 ✗</button></div>';
  }else{
    h+='</div><div class="btnrow"><button class="btn-show" onclick="showCard(true)">显示答案</button></div>';
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function mark(know){
  var i=queue[qi];
  roundAttempted[i]=1;
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(know){
    if(ki<0)store.known.push(i);
    if(wi>=0)store.wrong.splice(wi,1);
    roundKnown++;
  }else{
    if(wi<0)store.wrong.push(i);
    if(retry.indexOf(i)<0)retry.push(i);
  }
  save();qi++;next();
}
function next(){
  if(qi<queue.length){showCard(false);return;}
  if(retry.length){queue=retry;retry=[];qi=0;roundTotal=queue.length;showCard(false);return;}
  summary();
}
function summary(){
  phase='done';
  var total=Object.keys(roundAttempted).length;
  var rate=total?Math.round(roundKnown/total*100):0;
  paintProg(roundTotal,roundTotal);
  var h='<div class="sum"><div style="text-align:center;color:#888;font-size:14px">本轮结算</div>'+
    '<div class="rate">'+roundKnown+' / '+total+'（'+rate+'%）</div>';
  if(store.wrong.length){
    h+='<div style="font-size:14px;color:#888;margin:10px 0 4px">错题本（'+store.wrong.length+'）· 点击展开看答案</div>';
    var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.classList.toggle(\'open\')">'+esc(c.q)+'</div><div class="wa">'+freqLabel(c.freq)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+'</div></div>';
    });
  }else{
    h+='<div class="center">🎉 全部掌握！</div>';
  }
  h+='</div><div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')"'+(store.wrong.length?'':' disabled')+'>再练错题</button>'+
     '<button class="btn-ghost" onclick="startRound(\'full\')">重新开始</button></div>';
  document.getElementById('stage').innerHTML=h;
  window.scrollTo(0,0);
}
function paintWCount(){document.getElementById('wcount').textContent=store.wrong.length;}
function setTab(all){document.getElementById('tab-all').classList.toggle('on',all);document.getElementById('tab-wrong').classList.toggle('on',!all);}
function showWrongList(){
  phase='wrong';setTab(false);
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='不会的卡片共 '+store.wrong.length+' 张 · 点击问题可收起/展开答案';
  paintWCount();
  var st=document.getElementById('stage');
  var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ws.length){
    h='<div class="center">\u0001F389 没有不会的卡片，全部掌握！</div>';
  }else{
    h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">再练一遍（'+ws.length+'）</button></div>';
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.querySelector(\'.wa\').classList.toggle(\'show\')">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+freqLabel(c.freq)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+
         '<br><button class="wmark" onclick="markKnownFromList('+i+',this)">\u2713 会了，移出</button></div></div>';
    });
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function markKnownFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki<0)store.known.push(i);
  if(wi>=0)store.wrong.splice(wi,1);
  save();paintWCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.wrong.length)showWrongList();
}
document.getElementById('tab-all').onclick=function(){startScreen();};
document.getElementById('tab-wrong').onclick=function(){showWrongList();};
document.getElementById('b-retry').onclick=function(){if(store.wrong.length)startRound('wrong');};
document.getElementById('b-reset').onclick=function(){
  if(confirm('清空本门课的全部自测进度？')){localStorage.removeItem(KEY);store={known:[],wrong:[]};startScreen();}
};
startScreen();
</script>
</body></html>
