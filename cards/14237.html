<script id="cards-data" type="application/json">[{"a": "框架：传播机制→关系结构→信息特点→功能定位→舆论作用。要点：微博=广场式裂变传播、弱联系（粉丝关系）、媒体属性、制造热点；微信=社群圈层传播、强联系（熟人关系）、社交属性、沉淀共识。强联系信任高但视野窄（回声室），弱联系公共性强但信任低。", "freq": 3, "q": "微博与微信的区别（论述题）", "tag": "论述"}, {"a": "定义：通过传感设备按约定协议把物品与互联网连接，实现智能化识别、定位、跟踪、监控和管理的网络技术，本质是“万物互联”。架构：感知层（信息采集）、网络层（传输）、应用层。意义：生产、生活、媒体生态（万物皆媒）、社会治理变革；挑战是数据安全、隐私、标准统一。", "freq": 2, "q": "物联网技术及其意义（论述题）", "tag": "论述"}, {"a": "一、机器写作常态化（程式化、数据密集型报道自动化）；二、人机协同（记者负责深度判断，机器负责抓取、初稿）；三、算法分发主导（千人千面，但带来信息茧房、回声室）；四、UGC/PGC/AGC融合，主体多元化；五、机器替代重复劳动，记者竞争力转向调查能力与思想深度。", "freq": 1, "q": "智能化媒体时代新闻生产的新模式（论述题）", "tag": "论述"}, {"a": "由伊丽莎白·诺尔-诺依曼提出。四环节：对孤立的恐惧→对意见气候的判断→发声或沉默的选择→螺旋式强化（多数越发声越壮大，少数越沉默越萎缩）。网络变异：匿名降低孤立恐惧使少数更易发声；算法“信息茧房/回声室”让人误以为小圈子意见即多数；群体极化是螺旋在网络圈群中的表现。", "freq": 1, "q": "网络中“沉默的螺旋”的形成机制（论述题）", "tag": "论述"}, {"a": "格兰诺维特提出：强联系=亲密、频繁、多维（如亲友），弱联系=疏远、低频、单一（如网友）。朋友圈强联系→信任度高、说服力强，但同质化、易回声室；视频号弱联系→传播广、公共性强，但信任度低、需权威背书。结论：用强联系做信任背书，用弱联系做范围扩散，兼得“传得开”与“信得过”。", "freq": 1, "q": "运用强联系/弱联系理论分析新闻信息信任度（论述题）", "tag": "论述"}, {"a": "陪伴需求、互动快感、归属感、打赏的权力感、从众与围观心理。", "freq": 1, "q": "社交互动性直播的心理动因（论述题）", "tag": "论述"}, {"a": "要点：VR/AR技术、社交媒体的拟剧化生存、线上线下消费打通、元宇宙概念；答题时展开融合的表现与界限。", "freq": 1, "q": "互联网如何推动虚拟世界与现实世界的融合（论述题）", "tag": "论述"}, {"a": "结合媒介素养作答：主动管理使用时间、辨别信息真伪、保持线下社交、不做“低头族”。（24全国综合应用题材料为“放下手机、面对真实世界”。）", "freq": 1, "q": "如何善用手机媒体（论述题）", "tag": "论述"}, {"a": "特征：用户既是接收者也是生产者（UGC）；去中心化、人人可参与；互动性强；内容海量化。意义：打破传统媒体信息垄断，实现“自下而上”传播；催生博客、Wiki、SNS；为自媒体、社交媒体时代奠定基础。Web1.0是“只读”门户模式。", "freq": 2, "q": "简述Web2.0的特征和意义", "tag": "简答"}, {"a": "广场式公开传播（信息公开可见、可触达陌生人）；裂变式扩散（转发链无限延伸）；碎片化（短平快，适合即时发布）；弱联系（单向关注的粉丝关系）；媒体属性强（突发新闻首发地、议程设置能力强）。", "freq": 1, "q": "简述微博的传播特点", "tag": "简答"}, {"a": "编辑主导（专业编辑筛选加工）；单向传播（用户只能被动接收，“只读互联网”）；中心化（新浪、搜狐、网易垄断流量入口）；内容同质化（各门户内容高度相似，竞争靠速度和包装）。", "freq": 1, "q": "简述Web1.0时代“大众门户”模式的特点", "tag": "简答"}, {"a": "传播机制：微博广场裂变 vs 微信圈层社群；关系结构：微博弱联系 vs 微信强联系；信息信任：微博广度大信任低 vs 微信信任高视野窄；功能定位：微博媒体属性 vs 微信社交属性；舆论作用：微博制造热点 vs 微信沉淀共识。", "freq": 1, "q": "简述微博与微信的区别", "tag": "简答"}, {"a": "即时性（信息实时到达）；交互性（双向多轮对话、可即时反馈）；私密性（一对一或小圈层）；情感性（熟人关系情感连接强）；多媒体化（文字、语音、视频、表情包综合运用）。", "freq": 1, "q": "简述网络人际传播的渠道特点", "tag": "简答"}, {"a": "加速舆论形成（话题迅速发酵）；下沉传播（深入家族群等私域，扩大覆盖）；情绪化助推（熟人背书使情绪易传染）；谣言温床（“内部消息”难核验、辟谣难）；动员功能（群聊便于组织行动，线上舆论易转线下）。", "freq": 1, "q": "简述即时通信传播对舆论形成的影响", "tag": "简答"}, {"a": "社交类：微信、微博；新闻资讯类：今日头条、澎湃新闻；短视频类：抖音、快手；问答/社区类：知乎、小红书；直播类：斗鱼、抖音直播。（列举5个不同类型即可）", "freq": 1, "q": "请列举五个不同类型的移动端新媒体应用", "tag": "简答"}, {"a": "内容为王（做强原创、做精垂直）；技术赋能（优化算法，兼顾个性化与主流价值）；用户运营（增强互动、发展会员制）；融合发展（结合短视频、直播）；盈利模式（广告+付费+政务服务多元变现）。", "freq": 1, "q": "简述新闻客户端的发展对策", "tag": "简答"}, {"a": "信息茧房（视野越收越窄）；回声室效应（加剧群体极化）；标题党泛滥（劣币驱逐良币）；价值观偏差（流量至上）；隐私问题（过度采集用户数据）。", "freq": 1, "q": "简述目前新闻推荐算法存在的问题", "tag": "简答"}, {"a": "可直接穿戴在身上或整合进服装、配件中的便携式智能设备，如智能手表、智能手环、VR眼镜。特点：贴近人体、持续在线、感知环境；是物联网在个人层面的典型应用、“万物皆媒”的硬件入口。", "freq": 1, "q": "可穿戴设备是什么", "tag": "名解"}, {"a": "虚拟现实，利用计算机生成完全沉浸式的三维虚拟环境的技术，用户佩戴设备后与现实世界隔绝。与AR共同推动虚拟世界与现实世界的融合，是下一代媒体形态的重要技术基础。", "freq": 1, "q": "VR是什么", "tag": "名解"}, {"a": "增强现实，将虚拟信息叠加到现实世界的技术，虚实结合。与VR共同推动虚拟世界与现实世界的融合。", "freq": 1, "q": "AR是什么", "tag": "名解"}, {"a": "由哈贝马斯提出，指介于国家与私人领域之间、公民自由讨论公共事务的话语空间，如咖啡馆、沙龙、网络论坛。理想状态是理性、平等、公开的讨论；网络论坛、微博广场是数字时代的新型公共领域。", "freq": 1, "q": "公共领域是什么", "tag": "名解"}, {"a": "即Social Networking Services（社交网络服务），是基于现实或虚拟社会关系、提供信息发布和互动交流的网络平台，如微信、微博、QQ。核心是人际关系链。", "freq": 1, "q": "SNS是什么", "tag": "名解"}, {"a": "群体成员经过讨论协商后，意见向更极端的方向偏移的现象。网络空间中回声室效应和算法推荐加剧群体极化，使温和意见边缘化、极端意见被强化，是网络舆论非理性化的重要机制。", "freq": 1, "q": "群体极化是什么", "tag": "名解"}, {"a": "通过传感器、射频识别等设备，按约定协议将物品与互联网连接，实现智能化识别、定位、跟踪、监控和管理的网络技术。其实质是“万物互联”，架构包括感知层、网络层、应用层三层。", "freq": 2, "q": "物联网技术是什么", "tag": "名解"}, {"a": "围绕某一新闻事件或主题，集中、多角度、持续进行报道的新闻产品形态。类型包括全面集纳型、动态型、静态型、采访型、事件型（口诀“全动静采事”），是网络媒体深度报道的主要形式。", "freq": 4, "q": "新闻专题是什么", "tag": "名解"}, {"a": "即HTML5，移动端广泛应用的交互式页面技术标准。H5页面以图文、音频、视频、互动测试相结合的形式呈现内容，具有传播便捷、体验沉浸、易于分享的特点，是移动新闻创新的代表形态。", "freq": 1, "q": "H5是什么", "tag": "名解"}, {"a": "以数据为核心素材，运用数据挖掘、可视化技术进行新闻报道的新形态。生产流程包括数据获取、清洗、分析、可视化呈现，体现“用数据说话”的新闻理念，是智能化媒体时代的重要新闻生产模式。", "freq": 1, "q": "数据新闻是什么", "tag": "名解"}, {"a": "用户既是接收者也是生产者的互联网应用模式，以博客、Wiki、SNS为代表。与Web1.0“只读”门户模式不同，Web2.0实现了去中心化、人人可参与，奠定了社交媒体时代的基础。", "freq": 2, "q": "Web2.0是什么", "tag": "名解"}, {"a": "个人或小团队依托网络平台自主生产、发布内容的传播主体，如公众号、UP主、博主。特点是门槛低、个性化、交互强。", "freq": 1, "q": "自媒体是什么", "tag": "名解"}, {"a": "整合文字、图片、音频、视频、数据等多种媒介形态、进行跨平台呈现的新闻产品。打破单一文体界限，以多媒体、交互式方式讲好一个新闻故事，是媒介融合在内容生产层面的体现。", "freq": 1, "q": "融合性新闻是什么", "tag": "名解"}, {"a": "一种多人协作编写的超文本系统，最典型的是维基百科。特点是开放编辑、版本留痕、集体智慧，体现了Web2.0时代用户生产内容的精神，也带来信息权威性方面的争议。", "freq": 1, "q": "Wiki是什么", "tag": "名解"}, {"a": "理论由麦库姆斯和唐纳德·肖提出，认为大众媒介通过选择和强调某些议题，告诉公众“想什么”（而不是“怎么想”），从而影响公众对议题重要性的判断。", "freq": 1, "q": "议程设置是什么", "tag": "名解"}, {"a": "具有独立操作系统、可安装应用软件、持续联网的移动电话。它是手机媒体的核心终端，集通信、娱乐、支付、办公于一体，使用户“永远在线”，成为人体器官的延伸。", "freq": 1, "q": "智能手机是什么", "tag": "名解"}, {"a": "第五代移动通信技术，具有高速率、低时延、大连接三大特性。为4K/8K视频、VR/AR、物联网、自动驾驶等应用提供网络基础，是智能化媒体时代的关键基础设施。", "freq": 1, "q": "5G是什么", "tag": "名解"}, {"a": "用于解释用户接受新技术的心理机制的模型，核心变量是感知有用性和感知易用性：用户觉得一项技术有用且好用，才会采纳。是新媒体用户研究的基础模型之一。", "freq": 1, "q": "技术采纳模型（TAM）是什么", "tag": "名解"}, {"a": "认为个体行为意向取决于行为态度、主观规范和知觉行为控制三个因素的理论。常用于解释网民的信息分享、媒介使用等行为，是新媒体效果研究的重要理论工具。", "freq": 1, "q": "计划行为理论（TPB）是什么", "tag": "名解"}, {"a": "个体只关注自己感兴趣的信息、视野日益狭窄，如同生活在蚕茧中的现象。其个人表征是“个人日报”。它是算法推荐的负效应之一，与回声室效应、群体极化构成网络心理效应链。", "freq": 2, "q": "信息茧房是什么", "tag": "名解"}, {"a": "哈贝马斯", "freq": 1, "q": "提出“公共领域”理论的学者是", "tag": "选择"}, {"a": "浦尔", "freq": 1, "q": "《自由的技术》中提出“媒介融合”概念的学者是", "tag": "选择"}, {"a": "卡斯特", "freq": 1, "q": "提出“流动的空间”概念的学者是", "tag": "选择"}, {"a": "库尔特·卢因", "freq": 1, "q": "提出“把关人”理论的学者是", "tag": "选择"}, {"a": "拉扎斯菲尔德", "freq": 1, "q": "提出“两级传播”理论的学者是", "tag": "选择"}, {"a": "威廉·吉布森", "freq": 1, "q": "《神经漫游者》中提出“赛博空间”概念的作者是", "tag": "选择"}, {"a": "标点符号的重度使用", "freq": 3, "q": "社交媒体文章标题的特性是____（三卷选择第10题连考）", "tag": "选择"}, {"a": "来源陷阱、时间陷阱、专业陷阱、情绪/情感/认知框架陷阱", "freq": 3, "q": "网络假新闻陷阱包括哪四类", "tag": "选择"}, {"a": "情绪框架陷阱", "freq": 3, "q": "“喝酒能抗癌”式急于贴标签属于哪种假新闻陷阱", "tag": "选择"}, {"a": "专业陷阱", "freq": 3, "q": "“抢独家未经求证刊发”属于哪种假新闻陷阱", "tag": "选择"}, {"a": "全面集纳型、动态型、静态型、采访型、事件型（口诀：全动静采事）", "freq": 4, "q": "新闻专题的五种类型是", "tag": "选择"}, {"a": "事件型、静态型、采访型", "freq": 3, "q": "三卷选择连考新闻专题类型：2022.4考____、2022.10考____、2023.4考____", "tag": "选择"}, {"a": "原生网络媒体、合作型新闻网站、聚合型新闻网站、新型网络媒体（聚合型实例：《赫芬顿邮报》、BuzzFeed）", "freq": 2, "q": "新闻网站的四种类型是", "tag": "选择"}, {"a": "蒂姆·伯纳斯-李，1989年", "freq": 2, "q": "WWW技术的构想者及其提出年份", "tag": "选择"}, {"a": "情感连接、话语权利相对平等", "freq": 1, "q": "微信朋友圈传播的特点是", "tag": "选择"}, {"a": "麦库姆斯和唐纳德·肖", "freq": 1, "q": "议程设置理论的提出者是", "tag": "选择"}, {"a": "社会整合作用", "freq": 1, "q": "麦库姆斯和唐纳德·肖还提出议程设置具有哪项社会功能（2022.4选择13考）", "tag": "选择"}, {"a": "基于位置的服务", "freq": 1, "q": "LBS的全称是", "tag": "选择"}, {"a": "基站定位+GPS", "freq": 1, "q": "手机定位主要依靠的技术是", "tag": "选择"}, {"a": "信息茧房→回声室→群体极化", "freq": 1, "q": "网络心理效应链的三环依次是", "tag": "选择"}, {"a": "小圈子信息加强（同类观点相互强化）", "freq": 1, "q": "回声室效应的题眼是", "tag": "选择"}, {"a": "个人日报", "freq": 1, "q": "2024全国卷选择15：信息茧房的个人表征是", "tag": "选择"}, {"q": "媒体是什么", "a": "又称媒介、媒质，是承载信息的载体。《现代汉语词典》解释为“交流、传播信息的工具，如报刊、广播、电视、互联网等”。", "freq": 1, "tag": "名解"}, {"q": "新媒体是什么", "a": "借助计算机传播信息的载体。手机媒体是借助手机进行信息传播的工具，并非独立的媒体形态（即非“第五媒体”），而是网络媒体的延伸。", "freq": 1, "tag": "名解"}, {"q": "媒体生态系统是什么", "a": "以传媒产品生产和传播为核心的相关要素的组合，包括传媒通过版面和节目反映出来的外在形态，以及频道（率）、人力、受众、信息集纳渠道、广告支持等。", "freq": 1, "tag": "名解"}, {"q": "受众是什么", "a": "信息传播的接受者，包括报刊和书籍的读者、广播的听众、电影电视的观众与网民。从宏观上看是一个巨大的集合体，从微观上看则体现为具有丰富社会多样性的人。", "freq": 1, "tag": "名解"}, {"q": "用户是什么", "a": "一般指接受社会某种有偿服务的客户，如接受照明、宽带、视听、通信、供暖、供水、供气等服务的客户。", "freq": 1, "tag": "名解"}, {"q": "创新扩散理论是什么", "a": "由罗杰斯于20世纪60年代提出的关于通过媒介劝服人们接受新观念、新事物及新产品的理论，侧重于大众传播对社会和文化的影响。传播过程用一条S形曲线描述，分为知晓、劝服、决策、证实4个阶段。", "freq": 1, "tag": "名解"}, {"q": "人际传播是什么", "a": "个人与个人之间的信息传播活动，是由两个个体系统相互连接组成的信息传播系统。大致分两种方式：面对面传播；借助某种有形物质媒介的传播。", "freq": 1, "tag": "名解"}, {"q": "情感因素是什么", "a": "人在交际活动中，认识到某个客体的价值，体验到客体是否能满足自己的需要，并由此而产生的相应心理活动。", "freq": 1, "tag": "名解"}, {"q": "短信传播是什么", "a": "从技术角度看，是一种非实时的、非语音的数据通信业务。它可以由移动通信终端（手机）发起，也可由移动网络运营商的短信服务器发起，还可以由与移动运营商短信平台互联的网络业务提供商SP发起。", "freq": 1, "tag": "名解"}, {"q": "微信是什么", "a": "腾讯公司打造的一款社交软件，2011年1月21日正式推出。支持跨通信运营商、跨操作系统平台通过网络快速发送语音短信、视频、图片和文字；提供公众平台、朋友圈、消息推送等功能。", "freq": 1, "tag": "名解"}, {"q": "移动互联网是什么", "a": "通过智能移动终端、采用移动无线通信方式获取业务和服务的新兴业态，它将移动通信和互联网络两者结合为一体。", "freq": 1, "tag": "名解"}, {"q": "人际沟通是什么", "a": "两人或两人以上面对面或凭借书信、电话等简单媒介（非大众传播媒介）进行的信息交流活动。", "freq": 1, "tag": "名解"}, {"q": "强联系与弱联系理论是什么", "a": "格兰诺维特1973年在论文《弱联系的力量》中提出。强联系指每个人接触最频繁的亲人、同学、朋友、同事，构成稳定但传播范围有限的社会认知；弱联系指更广泛、更肤浅的社会认知。微信通讯录多为强联系，因此其中新闻信息信任度高。", "freq": 1, "tag": "名解"}, {"q": "客户端是什么", "a": "与服务器相对应，为客户提供本地服务的程序或终端。", "freq": 1, "tag": "名解"}, {"q": "手机新闻客户端是什么", "a": "为客户提供新闻资讯、实现移动服务的程序或终端；是基于移动互联网技术、满足受众在手机端实现新闻阅读的时代产物。", "freq": 1, "tag": "名解"}, {"q": "付费墙是什么", "a": "传统报纸对其在线内容实行有价阅读而建立的支付模式。但中国的网民虽然愿意为内容付费，却不愿意为新闻付费。", "freq": 1, "tag": "名解"}, {"q": "抖音是什么", "a": "一款可以拍短视频的音乐创意短视频社交软件，2016年9月上线，是一个专注年轻人音乐短视频社区的平台。用户可选择歌曲、拍摄音乐短视频，形成自己的作品。", "freq": 1, "tag": "名解"}, {"q": "算法是什么", "a": "新闻推荐语境下：根据用户的年龄、性别、兴趣等个人属性，结合种族、经济、社交等社会特征以及历史行为数据，构建多维度用户画像，同时综合考量信息产品与用户的地理和技术环境，实现精准的信息适配与新闻分发。", "freq": 1, "tag": "名解"}, {"q": "算法价值是什么", "a": "一套区别于传统新闻价值的判断标准体系，用于决策内容的选取与排除，决定了在算法驱动的新闻源中哪些内容要素得以展现。", "freq": 1, "tag": "名解"}, {"q": "隐私权是什么", "a": "概念源于1890年第4期《哈佛法律评论》中的《论隐私权》。我国2021年1月1日施行的民法典将个人数据、网络虚拟财产等纳入保护范围。", "freq": 1, "tag": "名解"}, {"q": "手机定位是什么", "a": "通过特定的定位技术来获取移动手机或终端用户的位置信息（经纬度坐标），在电子地图上标出被定位对象位置的技术或服务。", "freq": 1, "tag": "名解"}, {"q": "基于位置的服务（LBS）是什么", "a": "通过位置信息帮助用户与移动设备进行交互的服务。功能有4类：基于位置发送定向广告、基于位置创新产品应用、基于位置进行重大决策、基于位置优化治安及案件侦破。", "freq": 1, "tag": "名解"}, {"q": "上下文感知服务是什么", "a": "位置信息所揭露出的个人隐私并不局限于位置信息本身；用户的位置信息还可以与其他信息结合，进而从扩展区域推断出语义含义。", "freq": 1, "tag": "名解"}, {"q": "关联方共享是什么", "a": "互联网企业将本平台收集到的用户个人信息，与其他关联公司、合作机构共享。", "freq": 1, "tag": "名解"}, {"q": "星链卫星网络是什么", "a": "美国太空探索技术公司（SpaceX）推进的庞大低轨卫星通信系统，目的是提供全球高速互联网服务。优势：通信速度快、带宽大、延迟短、效费比较高，不受复杂地形、恶劣气候及复杂电磁环境影响。", "freq": 1, "tag": "名解"}, {"q": "今日头条是什么", "a": "北京字节跳动开发的一款基于数据挖掘的推荐引擎产品，为用户推荐信息，提供连接人与信息的服务。", "freq": 1, "tag": "名解"}, {"a": "【参考答案】D. 蒂姆·伯纳斯－李（1989年）", "ai": true, "freq": 2, "q": "提出 WWW（World Wide Web——万维网）的技术构想的人是\nA. 文顿·瑟夫\nB. 罗伯特·卡恩\nC. 史蒂夫·曼恩\nD. 蒂姆·伯纳斯－李", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】B. 《自由的技术》", "ai": true, "freq": 2, "q": "媒介融合概念是浦尔教授在他的哪本著作中提出的？\nA. 《网络社会的崛起》\nB. 《自由的技术》\nC. 《即将到来的场景时代》\nD. 《信息规则：网络经济的策略指导》", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】C. 哈贝马斯", "ai": true, "freq": 2, "q": "公共领域（Public Sphere）的提出者是\nA. 李普曼\nB. 拉斯韦尔\nC. 哈贝马斯\nD. 施拉姆", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】A. 强联系（亲密、频繁、多维的社会关系）", "ai": true, "freq": 2, "q": "与固定交流对象的联系，可以说是一种\nA. 强联系\nB. 弱联系\nC. 较强联系\nD. 较弱联系", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】D. 作为一个开放的系统，微博整体呈现出一种异质性", "ai": true, "freq": 2, "q": "微博的特点在于\nA. 是一个相对封闭的系统\nB. 相比于公共信息，微博的用户更关注私人社交\nC. 话题的传播主要基于强关系传播\nD. 作为一个开放的系统，微博整体呈现出一种异质性", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】C. 《即时通信工具公众信息服务发展管理暂行规定》（“微信十条”）", "ai": true, "freq": 2, "q": "国家互联网信息办公室 2014 年 8 月 7 日颁布了\nA. 《互联网新闻信息服务管理规定》\nB. 《互联网直播服务管理规定》\nC. 《即时通信工具公众信息服务发展管理暂行规定》（也称“微信十条”）\nD. 《关于加强网络视听节目直播服务管理有关问题的通知》", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】C. 聚合型新闻网站", "ai": true, "freq": 2, "q": "被称为美国“互联网第一大报”的《赫芬顿邮报》（The Huffington Post）属于\nA. 原生网络媒体\nB. 合作型新闻网站\nC. 聚合型新闻网站\nD. 新型网络媒体", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】D. 情绪、情感或认知框架陷阱", "ai": true, "freq": 2, "q": "急于给新闻对象贴标签或者将事件置于某种认知框架中造成的假新闻属于网络媒体的哪一种陷阱？\nA. 来源陷阱\nB. 时间陷阱\nC. 专业陷阱\nD. 情绪、情感或认知框架陷阱", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】B. 用户新闻生产的能量大小取决于网络裂变的效能（用户参与多为非制度性；再生产过程产生“正反馈”效应）", "ai": true, "freq": 2, "q": "网络用户参与新闻生产的特点是\nA. 大多数用户参与新闻生产是制度性的\nB. 用户新闻生产的能量大小取决于网络裂变的效能\nC. 用户新闻生产对专业机构生产具有依附性和嵌入性\nD. 用户的再生产过程会产生一种“负反馈”效应", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】D. 标点符号的重度使用（三卷选择第10题连考）", "ai": true, "freq": 2, "q": "《法官提醒：酒桌上这四种情况要坐牢！千万别不当回事！》这一标题体现了社交媒体文章标题的哪个特性？\nA. 标题制作的细节化\nB. 标题的“内容提要化”\nC. 标题的夹叙夹议化\nD. 标点符号的重度使用", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】D. 事件型专题", "ai": true, "freq": 2, "q": "一些新闻专题针对某个新闻事件来展开报道，这属于新闻专题的哪个类型？\nA. 全面集纳型专题\nB. 动态型专题\nC. 采访型专题\nD. 事件型专题", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】D. 一致行动（基础是共同的目标、情感的认同、高效的协调工具）", "ai": true, "freq": 2, "q": "社群经济的基础不包括\nA. 共同的目标\nB. 情感的认同\nC. 高效的协调工具\nD. 一致行动", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】B. “议程设置”理论（兼具社会整合作用）", "ai": true, "freq": 2, "q": "20 世纪末，麦库姆斯和唐纳德·肖等人在哪个理论中讨论了媒介在进行社会整合方面所起的作用？\nA. “拟剧理论”\nB. “议程设置”理论\nC. “沉默的螺旋”\nD. “议程融合”理论", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】A. 卡斯特", "ai": true, "freq": 2, "q": "“流动的空间”概念的提出者是\nA. 卡斯特\nB. 哈贝马斯\nC. 麦库姆斯\nD. 拉扎斯菲尔德", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】B. 基于位置的服务", "ai": true, "freq": 2, "q": "LBS 指\nA. 基于信息的服务\nB. 基于位置的服务\nC. 基于技术的服务\nD. 基于数据的服务", "src": "2022.4真题", "tag": "单选"}, {"a": "【参考答案】可直接穿戴在身上或整合进服装、配件中的便携式智能设备，如智能手表、智能手环、VR眼镜。特点是贴近人体、持续在线、感知环境，是物联网在个人层面的典型应用、“万物皆媒”的硬件入口。", "ai": true, "freq": 2, "q": "可穿戴设备是什么？", "src": "2022.4真题", "tag": "名解"}, {"a": "【参考答案】虚拟现实（Virtual Reality），利用计算机生成完全沉浸式的三维虚拟环境的技术，用户佩戴设备后与现实世界隔绝。与AR共同推动虚拟世界与现实世界的融合，是下一代媒体形态的重要技术基础。", "ai": true, "freq": 2, "q": "VR是什么？", "src": "2022.4真题", "tag": "名解"}, {"a": "【参考答案】由哈贝马斯提出，指介于国家与私人领域之间、公民自由讨论公共事务的话语空间，如咖啡馆、沙龙、网络论坛。理想状态是理性、平等、公开的讨论；网络论坛、微博广场是数字时代的新型公共领域。", "ai": true, "freq": 2, "q": "公共领域（Public Sphere）是什么？", "src": "2022.4真题", "tag": "名解"}, {"a": "【参考答案】即Social Networking Services（社交网络服务），是基于现实或虚拟社会关系、提供信息发布和互动交流的网络平台，如微信、微博、QQ。核心是人际关系链。", "ai": true, "freq": 2, "q": "SNS是什么？", "src": "2022.4真题", "tag": "名解"}, {"a": "【参考答案】群体成员经过讨论协商后，意见向更极端的方向偏移的现象。网络空间中回声室效应和算法推荐加剧群体极化，使温和意见边缘化、极端意见被强化，是网络舆论非理性化的重要机制。", "ai": true, "freq": 2, "q": "群体极化是什么？", "src": "2022.4真题", "tag": "名解"}, {"a": "【按背诵资料整理】特征：用户既是信息的接收者也是生产者（UGC）；去中心化、人人可参与；互动性强；内容海量化。意义：打破了传统媒体的信息垄断，实现了“自下而上”的传播；催生了博客、Wiki、SNS等新应用；为自媒体、社交媒体时代奠定基础。与Web1.0区别：Web1.0是“只读”的门户模式，用户被动接收。", "ai": true, "freq": 2, "q": "简述 Web2.0 的特征和意义。", "src": "2022.4真题", "tag": "简答"}, {"a": "【按背诵资料整理】广场式公开传播：信息公开可见，可触达陌生人；裂变式扩散：转发链条无限延伸，传播速度快；碎片化：短平快，适合即时发布；弱联系：单向关注的粉丝关系，异质性强；媒体属性强：突发新闻首发地、公共议题发酵场，议程设置能力强。", "ai": true, "freq": 2, "q": "简述微博的传播特点。", "src": "2022.4真题", "tag": "简答"}, {"a": "【按背诵资料整理】一、机器写作常态化：程式化、数据密集型报道实现自动化生产，速度快、成本低；二、人机协同生产：记者负责采访调查、深度思考和价值判断，机器负责数据抓取、初稿撰写、事实核查；三、算法分发主导：根据用户画像实现“千人千面”个性化分发，但也带来信息茧房、回声室效应；四、UGC/PGC/AGC融合：新闻生产主体多元化，媒体机构从“内容生产者”转向“平台运营者+内容生产者”；五、人机关系新定位：机器替代重复性劳动，记者核心竞争力转向调查能力、思想深度和人文关怀。", "ai": true, "freq": 2, "q": "论述智能化媒体时代新闻生产的新模式。", "src": "2022.4真题", "tag": "论述"}, {"a": "【按背诵资料整理】陪伴需求、互动快感、归属感、打赏的权力感、从众与围观心理。", "ai": true, "freq": 2, "q": "论述社交互动性直播的心理动因。", "src": "2022.4真题", "tag": "论述"}, {"a": "【参考答案】C. 1989年", "ai": true, "freq": 2, "q": "蒂姆·伯纳－李在哪一年提出的 WWW（World Wide Web——万维网，简称 Web）？\nA. 1987\nB. 1988\nC. 1989\nD. 1990", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】A. 媒介融合", "ai": true, "freq": 2, "q": "各种媒介呈现出多功能一体化的发展趋势，指的现象是\nA. 媒介融合\nB. 媒介重构\nC. 媒介交叉\nD. 媒介捆绑", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】D. VR脱离现实营造虚拟体验、AR在现实环境中增加虚拟体验", "ai": true, "freq": 2, "q": "VR（Virtual Reality，虚拟现实技术）和 AR（Augmented Reality，增强现实技术）的差异是\nA. AR 是用户当时所处现实环境，而 VR 是在用户所处的现实环境中增加虚拟的体验\nB. VR 是用户当时所处现实环境，而 AR 是在用户所处的现实环境中增加虚拟的体验\nC. AR 是脱离用户当时所处现实环境营造出虚拟体验，而 VR 是在用户所处的现实环境中增加虚拟的体验\nD. VR 是脱离用户当时所处现实环境营造出虚拟体验，而 AR 是在用户所处的现实环境中增加虚拟的体验", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】A. “赛博空间”", "ai": true, "freq": 2, "q": "威廉·吉布森在其科幻小说《神经漫游者》首次提出的概念是\nA. “赛博空间”\nB. “虚拟空间”\nC. “网络空间”\nD. “技术空间”", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】D. 相比于微博，人们在微信朋友圈中更注重情感连接，话语权利相对平等", "ai": true, "freq": 2, "q": "微信朋友圈的特点在于\nA. 相比于私人社交，微信的用户更关注公共信息\nB. 话题的传播主要基于弱关系传播\nC. 作为一个开放的系统，微博整体呈现出一种异质性\nD. 相比于微博，人们在微信朋友圈中更注重情感连接，话语权利相对平等", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】D. 《中国贸易报》", "ai": true, "freq": 2, "q": "中国国内第一家进入互联网发行的报纸是\nA. 《中国社会科学报》\nB. 《中国青年报》\nC. 《中国经济报》\nD. 《中国贸易报》", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】D. 情绪、情感或认知框架陷阱（急于贴标签）", "ai": true, "freq": 2, "q": "2017 年网络中流传的《喝酒能抗癌》的假新闻属于网络媒体的哪一种陷阱？\nA. 来源陷阱\nB. 时间陷阱\nC. 专业陷阱\nD. 情绪、情感或认知框架陷阱", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】C. 每个个体都是这一规则的参与者、阐释者和监督者", "ai": true, "freq": 2, "q": "学者吴飞提出“新闻专业主义 2.0”，表达了\nA. 新闻专业主义已过时\nB. 新闻专业主义是一种行业性的专业精神\nC. 每个个体都是这一规则的参与者、阐释者和监督者\nD. 新闻的客观真实属性已不再重要", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】B. 观众的角色只是观看者（A/C/D是手机新闻直播的特点：直播主体多元、互动成为必要元素、追求当事者或目击者的主观视角）", "ai": true, "freq": 2, "q": "属于电视新闻直播特点的是\nA. 直播主体为媒体、当事者、普通目击者等\nB. 观众的角色只是观看者\nC. 互动成为必要元素\nD. 追求较多当事者或目击者的主观视角", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】D. 标点符号的重度使用", "ai": true, "freq": 2, "q": "《紫菜是废旧塑料袋做的？别扯了，因为塑料……》这一标题体现了社交媒体文章标题的哪个特性？\nA. 标题制作的细节化\nB. 标题的“内容提要化”\nC. 标题的夹叙夹议化\nD. 标点符号的重度使用", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】B. 静态型专题", "ai": true, "freq": 2, "q": "有些新闻专题，一次性完成，一旦推出后便不再更新，这属于新闻专题的哪个类型？\nA. 全面集纳型专题\nB. 静态型专题\nC. 采访型专题\nD. 事件型专题", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】D. 意见领袖话语权力的三种方式：作为强势内容源、作为调节阀、作为意见气候营造者", "ai": true, "freq": 2, "q": "下列不属于社会化媒体平台中意见领袖话语权力产生影响的方式是\nA. 作为强势内容源向他人提供信息\nB. 作为调节阀，影响信息的流量与流向\nC. 作为意见气候的营造者，影响舆论的形成\nD. 作为话语权力的底层，向高层传递信息使信息加倍扩散", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】A. 对于传统媒体议题的放大作用", "ai": true, "freq": 2, "q": "2003 年《南方都市报》关于孙志刚事件的报道引起广泛关注，使这一事件成为网络的焦点话题，还影响到现实世界案件处理的进展，甚至最终促成了实施 21 年的不合理的收容制度的废止，这体现了网络\nA. 对于传统媒体议题的放大作用\nB. 对于传统媒体议题的削弱作用\nC. 对于传统媒体议题的重构作用\nD. 没有对传统媒体的议题起作用", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】B. 突出了社会网络在人际传播中的作用（SNS最本质的特征；C应为双向信息流动）", "ai": true, "freq": 2, "q": "SNS 的传播特点\nA. 是现实互动向虚拟互动的选择\nB. 突出了社会网络在人际传播中的作用\nC. 从传播结构上造就了单向信息流动\nD. 拓展了表达与互动的维度与形式", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】A. “回声室效应”（题眼：小圈子信息加强）", "ai": true, "freq": 2, "q": "信息或想法在一个小圈子里得到加强，这指的是\nA. “回声室效应”\nB. “沉默的螺旋”\nC. “信息茧房”\nD. “后真相”", "src": "2022.10真题", "tag": "单选"}, {"a": "【参考答案】通过传感器、射频识别等设备，按约定协议将物品与互联网连接，实现智能化识别、定位、跟踪、监控和管理的网络技术。其实质是“万物互联”，技术架构包括感知层、网络层、应用层三层。", "ai": true, "freq": 2, "q": "物联网技术是什么？", "src": "2022.10真题", "tag": "名解"}, {"a": "【参考答案】增强现实（Augmented Reality），将虚拟信息叠加到现实世界的技术，虚实结合。与VR共同推动虚拟世界与现实世界的融合。", "ai": true, "freq": 2, "q": "AR是什么？", "src": "2022.10真题", "tag": "名解"}, {"a": "【参考答案】围绕某一新闻事件或主题，集中、多角度、持续进行报道的新闻产品形态。类型包括全面集纳型、动态型、静态型、采访型、事件型（口诀“全动静采事”），是网络媒体深度报道的主要形式。", "ai": true, "freq": 2, "q": "新闻专题是什么？", "src": "2022.10真题", "tag": "名解"}, {"a": "【参考答案】即HTML5，移动端广泛应用的交互式页面技术标准。H5页面以图文、音频、视频、互动测试相结合的形式呈现内容，具有传播便捷、体验沉浸、易于分享的特点，是移动新闻创新的代表形态。", "ai": true, "freq": 2, "q": "H5是什么？", "src": "2022.10真题", "tag": "名解"}, {"a": "【参考答案】以数据为核心素材，运用数据挖掘、可视化技术进行新闻报道的新形态。生产流程包括数据获取、清洗、分析、可视化呈现，体现“用数据说话”的新闻理念，是智能化媒体时代的重要新闻生产模式。", "ai": true, "freq": 2, "q": "数据新闻是什么？", "src": "2022.10真题", "tag": "名解"}, {"a": "【按背诵资料整理】编辑主导：专业编辑筛选、加工、发布内容；单向传播：用户只能被动接收，不能生产内容（“只读互联网”）；中心化：新浪、搜狐、网易等几大门户垄断流量入口；内容同质化：各门户内容高度相似，竞争靠速度和包装。", "ai": true, "freq": 2, "q": "简述 Web1.0 时代“大众门户”模式的特点。", "src": "2022.10真题", "tag": "简答"}, {"a": "【按背诵资料整理】传播机制：微博广场裂变 vs 微信圈层社群；关系结构：微博弱联系 vs 微信强联系；信息信任：微博广度大信任低 vs 微信信任高视野窄；功能定位：微博媒体属性 vs 微信社交属性；舆论作用：微博制造热点 vs 微信沉淀共识。", "ai": true, "freq": 2, "q": "简述微博与微信的区别。", "src": "2022.10真题", "tag": "简答"}, {"a": "【按背诵资料整理】要点：VR/AR技术（VR沉浸隔绝、AR虚实叠加）、社交媒体的拟剧化生存、线上线下消费打通、元宇宙概念；答题时展开融合的表现与界限。", "ai": true, "freq": 2, "q": "试述互联网如何推动虚拟世界与现实世界的融合。", "src": "2022.10真题", "tag": "论述"}, {"a": "【按背诵资料整理】由伊丽莎白·诺尔-诺依曼提出。四环节：对孤立的恐惧→对意见气候的判断→发声或沉默的选择→螺旋式强化（多数越发声越壮大，少数越沉默越萎缩）。网络变异：匿名降低孤立恐惧使少数更易发声；算法“信息茧房/回声室”让人误以为小圈子意见即多数；群体极化是螺旋在网络圈群中的表现。", "ai": true, "freq": 2, "q": "试述网络中“沉默的螺旋”的形成机制。", "src": "2022.10真题", "tag": "论述"}, {"a": "【参考答案】B. 网络连接系统（软件系统由网络通信系统、网络操作系统、网络应用系统组成）", "ai": true, "freq": 2, "q": "从软件系统看，计算机网络系统不包括以下哪个部分？\nA. 网络通信系统\nB. 网络连接系统\nC. 网络操作系统\nD. 网络应用系统", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】B. 1969年", "ai": true, "freq": 2, "q": "互联网的雏形阿帕网（APAnet）于哪一年诞生？\nA. 1968 年\nB. 1969 年\nC. 1970 年\nD. 1971 年", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】C. “场景五力”", "ai": true, "freq": 2, "q": "罗伯特·斯考伯和谢尔·伊斯雷尔所著的《即将到来的场景时代》一书提出了\nA. “场景三力”\nB. “场景四力”\nC. “场景五力”\nD. “场景六力”", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】B. “个人中心”+“内容关联”", "ai": true, "freq": 2, "q": "微博是一种以内容为纽带的社会网络连接，其传播结构是\nA. “社会中心”+“内容关联”\nB. “个人中心”+“内容关联”\nC. “信息中心”+“内容关联”\nD. “技术中心”+“内容关联”", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】A. 确认了商业网站参与新闻传播的资格", "ai": true, "freq": 2, "q": "2000 年 11 月 6 日颁布的《互联网站从事登载新闻业务管理暂行办法》（简称《暂行规定》）中\nA. 确认了商业网站参与新闻传播的资格\nB. 放开了商业网站参与新闻传播的权限\nC. 明确界定了管理中涉及的“新闻”范围\nD. 其实践的管理对象为所有新闻", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】B. “拟剧”理论", "ai": true, "freq": 2, "q": "戈夫曼对人们在社交中的表演行为进行研究并提出了\nA. “使用与满足”理论\nB. “拟剧”理论\nC. “流动空间”理论\nD. “六度分隔”理论", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】D. 新型网络媒体", "ai": true, "freq": 2, "q": "BuzzFeed 属于\nA. 原生网络媒体\nB. 合作型新闻网站\nC. 聚合型新闻网站\nD. 新型网络媒体", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】C. 专业陷阱", "ai": true, "freq": 2, "q": "媒体为了抢独家新闻而未经求证就刊发的虚假信息属于网络媒体的\nA. 来源陷阱\nB. 时间陷阱\nC. 专业陷阱\nD. 情绪、情感或认知框架陷阱", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】A. 库尔特·卢因（题干作“劳因”，照录）", "ai": true, "freq": 2, "q": "“把关人”概念的提出者是\nA. 库尔特·劳因\nB. 拉尔夫·凯伊斯\nC. 古斯塔夫·勒庞\nD. 约翰·舒勒", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】D. 标点符号的重度使用", "ai": true, "freq": 2, "q": "《严重追尾事故，人被甩出车外，这场面完全不需要加特技！》这一标题体现了社交媒体文章标题的\nA. 标题制作的细节化\nB. 标题的内容提要化\nC. 标题的夹叙夹议化\nD. 标点符号的重度使用", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】C. 采访型专题", "ai": true, "freq": 2, "q": "一些新闻专题由网站针对一定的选题，组织力量进行采访报道，最终制作而成，这属于新闻专题的\nA. 全面集纳型专题\nB. 动态型专题\nC. 采访型专题\nD. 事件型专题", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】C. 完整的数据", "ai": true, "freq": 2, "q": "数据中“脏数据”不包括\nA. 重复的数据\nB. 错误的数据\nC. 完整的数据\nD. 相互冲突的数据", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】B. “问题出现－社会讨论－合意达成”", "ai": true, "freq": 2, "q": "舆论是一种社会合意（Social Consensus），它的生产过程为\nA. “合意达成－社会讨论－问题出现”\nB. “问题出现－社会讨论－合意达成”\nC. “社会讨论－问题出现－合意达成”\nD. “合意达成－问题出现－社会讨论”", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】C. 媒介使用中的“文化”差异", "ai": true, "freq": 2, "q": "个体间数字鸿沟的具体表现是\nA. 媒介及其资源获得的平等性\nB. 媒介素养的一致性\nC. 媒介使用中的“文化”差异\nD. 传播技术的差异", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】D. 拉扎斯菲尔德", "ai": true, "freq": 2, "q": "两级传播概念的提出者是\nA. 卡斯特\nB. 哈贝马斯\nC. 麦库姆斯\nD. 拉扎斯菲尔德", "src": "2023.4真题", "tag": "单选"}, {"a": "【参考答案】用户既是接收者也是生产者的互联网应用模式，以博客、Wiki、SNS为代表。与Web1.0“只读”门户模式不同，Web2.0实现了去中心化、人人可参与，奠定了社交媒体时代的基础。", "ai": true, "freq": 2, "q": "Web2.0是什么？", "src": "2023.4真题", "tag": "名解"}, {"a": "【参考答案】个人或小团队依托网络平台自主生产、发布内容的传播主体，如公众号、UP主、博主。特点是门槛低、个性化、交互强。", "ai": true, "freq": 2, "q": "自媒体是什么？", "src": "2023.4真题", "tag": "名解"}, {"a": "【参考答案】整合文字、图片、音频、视频、数据等多种媒介形态、进行跨平台呈现的新闻产品。打破单一文体界限，以多媒体、交互式方式讲好一个新闻故事，是媒介融合在内容生产层面的体现。", "ai": true, "freq": 2, "q": "融合性新闻是什么？", "src": "2023.4真题", "tag": "名解"}, {"a": "【参考答案】一种多人协作编写的超文本系统，最典型的是维基百科。特点是开放编辑、版本留痕、集体智慧，体现了Web2.0时代用户生产内容的精神，也带来信息权威性方面的争议。", "ai": true, "freq": 2, "q": "Wiki是什么？", "src": "2023.4真题", "tag": "名解"}, {"a": "【参考答案】理论由麦库姆斯和唐纳德·肖提出，认为大众媒介通过选择和强调某些议题，告诉公众“想什么”（而不是“怎么想”），从而影响公众对议题重要性的判断。", "ai": true, "freq": 2, "q": "议程设置是什么？", "src": "2023.4真题", "tag": "名解"}, {"a": "【按背诵资料整理】即时性（信息实时到达）；交互性（双向多轮对话、可即时反馈）；私密性（一对一或小圈层）；情感性（熟人关系情感连接强）；多媒体化（文字、语音、视频、表情包综合运用）。", "ai": true, "freq": 2, "q": "简述网络人际传播的渠道特点。", "src": "2023.4真题", "tag": "简答"}, {"a": "【按背诵资料整理】加速舆论形成（话题迅速发酵）；下沉传播（深入家族群等私域，扩大覆盖）；情绪化助推（熟人背书使情绪易传染）；谣言温床（“内部消息”难核验、辟谣难）；动员功能（群聊便于组织行动，线上舆论易转线下）。", "ai": true, "freq": 2, "q": "简述即时通信传播对舆论形成的影响。", "src": "2023.4真题", "tag": "简答"}, {"a": "【按背诵资料整理】一、内涵：通过射频识别、传感器、全球定位系统等信息传感设备，按约定的协议将物品与互联网连接，进行信息交换和通信，以实现智能化识别、定位、跟踪、监控和管理的网络技术，实质是“万物互联”。架构：感知层（信息采集）、网络层（传输）、应用层。二、意义：生产方式变革（工业互联网、智能制造）；生活方式变革（智能家居、可穿戴设备，手机成“万能遥控器”）；媒体生态变革（万物皆媒，信源极大丰富）；社会治理变革（智慧城市、应急管理更精准高效）；挑战与应对（数据安全、隐私保护、标准统一，需技术、法律、伦理协同治理）。", "ai": true, "freq": 2, "q": "论述物联网技术及其意义。", "src": "2023.4真题", "tag": "论述"}, {"a": "【按背诵资料整理】一、传播机制不同：微博广场式、裂变式传播，信息公开可见、可触达陌生人；微信社群式、圈层传播，信息在熟人圈层内流动。二、关系结构不同：微博弱联系（单向关注的粉丝关系）；微信强联系（现实熟人关系的双向好友）。三、信息信任度不同：朋友圈强联系信任度高但视野窄、易回声室；视频号/微博弱联系来源多元、信任度相对低但更具公共性。四、功能定位不同：微博偏媒体属性（突发新闻首发地）；微信偏社交属性（熟人社交、私域流量）。五、舆论作用不同：微博擅长制造热点、议程设置能力强；微信擅长沉淀共识、圈层内深化动员。", "ai": true, "freq": 2, "q": "论述微博与微信的区别。", "src": "2023.4真题", "tag": "论述"}, {"a": "【参考答案】B. 马丁·库帕", "ai": true, "freq": 2, "q": "世界上第一台手机的发明者是\nA. 内森·斯塔布菲尔德\nB. 马丁·库帕\nC. 塔克·卡尔森\nD. 斯诺登", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】D. 新闻客户端", "ai": true, "freq": 2, "q": "下列选项属于新媒体的是\nA. 车载移动电视\nB. 户外媒体\nC. 楼宇电视\nD. 新闻客户端", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】A. 手机媒体", "ai": true, "freq": 2, "q": "被称为“带着体温的媒体”的是\nA. 手机媒体\nB. 电视\nC. 微博\nD. 小红书", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】B. 接收信息的人", "ai": true, "freq": 2, "q": "受众是指\nA. 发送信息的人\nB. 接收信息的人\nC. 发送和接收信息的人\nD. 反馈信息的人", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】D. 学术研究（三大动机：获取信息、休闲娱乐、追求时尚）", "ai": true, "freq": 2, "q": "以下不属于大众手机用户上网的主要动机的是\nA. 获取信息\nB. 休闲娱乐\nC. 追求时尚\nD. 学术研究", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】C. 传统新闻摄影被淘汰（是“受到挑战”而非淘汰）", "ai": true, "freq": 2, "q": "拍摄手机对新闻传播的影响不包括\nA. 受众参与新闻生产\nB. 受众掌握舆论的主动性获得提升\nC. 传统新闻摄影被淘汰\nD. 新闻摄影受到挑战", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】A. S型曲线", "ai": true, "freq": 2, "q": "根据创新扩散理论，可以用来描述创新扩散的传播过程的是\nA. S 型曲线\nB. 抛物线\nC. 直线\nD. 波浪线", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】B. 早期使用者", "ai": true, "freq": 2, "q": "在创新扩散过程中，具有意见领袖特质的是\nA. 先驱者\nB. 早期使用者\nC. 早期大多数\nD. 晚期大多数", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】D. 辅助性表达手段不足（缺少表情、语调等辅助手段）", "ai": true, "freq": 2, "q": "手机短信在用文字符号进行人际传播过程中存在的缺陷是\nA. 互动性低\nB. 私密性差\nC. 太费网络流量\nD. 辅助性表达手段不足", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】D. 崇尚含蓄、内敛的气质（最具中国文化特色的解释）", "ai": true, "freq": 2, "q": "手机短信在我国得以流行的社会心理背景和文化背景是\nA. 比较注重使用成本的性价比\nB. 更习惯使用文字表达\nC. 方言太多不便于口头语言交流\nD. 崇尚含蓄、内敛的气质", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】C. 表达是否充分", "ai": true, "freq": 2, "q": "人际传播活动能否顺利进行，取决于传播双方\nA. 是否是强关系\nB. 是否有共同的利益\nC. 表达是否充分\nD. 是否能够熟练使用工具", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】A. 精神内容", "ai": true, "freq": 2, "q": "人际传播在本质上是个人之间交换\nA. 精神内容\nB. 社会资源\nC. 情绪价值\nD. 功利需求", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】C. 移动服务", "ai": true, "freq": 2, "q": "手机新闻客户端为客户提供新闻资讯，实现\nA. 本地服务\nB. 远程服务\nC. 移动服务\nD. 在地服务", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】B. 订阅收费", "ai": true, "freq": 2, "q": "新闻客户端对一些独特、优质的内容进行收费，这样的盈利模式称为\nA. 娱乐收费\nB. 订阅收费\nC. 流量付费\nD. 广告付费", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】A. 个人日报", "ai": true, "freq": 2, "q": "从网络茧房的个人表征方面观察，其彰显形式是\nA. 个人日报\nB. 群体极化\nC. 分众传播\nD. 网络审判", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】A. 算法和软件", "ai": true, "freq": 2, "q": "随着社交媒体和搜索引擎等数字平台的崛起，把关权力逐渐从传统新闻机构转移到\nA. 算法和软件\nB. 自媒体和算法\nC. 自媒体和用户\nD. 算法和用户", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】C. 预测性", "ai": true, "freq": 2, "q": "算法推荐的应用导致新闻价值中的时效性演变为即时性乃至\nA. 未知性\nB. 全时性\nC. 预测性\nD. 暂时性", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】C. 敏感数据", "ai": true, "freq": 2, "q": "黑客和间谍机构攻击的目标往往是智能手机中存储的个人信息和\nA. 浏览记录\nB. 微信密码\nC. 敏感数据\nD. 软件列表", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】A. 自律和他律", "ai": true, "freq": 2, "q": "对拍照手机侵犯隐私权或窃取机密的控制，实际上是针对有关传播者的\nA. 自律和他律\nB. 立法和执法\nC. 警示和处罚\nD. 发现和阻拦", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】D. GPS", "ai": true, "freq": 2, "q": "手机定位技术一种是基于移动运营网的基站定位，另一种定位是基于\nA. 附近的人\nB. 号码\nC. 手机卡\nD. GPS", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】B. 上下文感知服务", "ai": true, "freq": 2, "q": "用户的位置信息可以同其他个人信息结合，进而从扩展区域推断出语义含义，这种功能被称为\nA. 情感化预测服务\nB. 上下文感知服务\nC. 智能化导航服务\nD. 消费性预测服务", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】A. 管辖权", "ai": true, "freq": 2, "q": "在处理手机跨地域传播中的违法犯罪行为时，往往涉及的棘手问题是\nA. 管辖权\nB. 教育权\nC. 知情权\nD. 立法权", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】C. 政府", "ai": true, "freq": 2, "q": "净化手机媒体内容，保障手机网络安全的关键责任者是\nA. 用户\nB. 手机厂商\nC. 政府\nD. 媒体", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】D. 平衡点", "ai": true, "freq": 2, "q": "在人工智能逐渐代替人类工作的情况下，需要思考找到机器和人之间的\nA. 共同点\nB. 不同点\nC. 不平衡点\nD. 平衡点", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】B. 卫星通信", "ai": true, "freq": 2, "q": "在未来信息战中，将成为更关键因素的是\nA. 书面通信\nB. 卫星通信\nC. 有线通信\nD. 人工通信", "src": "2024.10真题", "tag": "单选"}, {"a": "【参考答案】具有独立操作系统、可安装应用软件、持续联网的移动电话。它是手机媒体的核心终端，集通信、娱乐、支付、办公于一体，使用户“永远在线”，成为人体器官的延伸。", "ai": true, "freq": 2, "q": "智能手机是什么？", "src": "2024.10真题", "tag": "名解"}, {"a": "【参考答案】第五代移动通信技术，具有高速率、低时延、大连接三大特性。为4K/8K视频、VR/AR、物联网、自动驾驶等应用提供网络基础，是智能化媒体时代的关键基础设施。", "ai": true, "freq": 2, "q": "5G是什么？", "src": "2024.10真题", "tag": "名解"}, {"a": "【参考答案】用于解释用户接受新技术的心理机制的模型，核心变量是感知有用性和感知易用性：用户觉得一项技术有用且好用，才会采纳。是新媒体用户研究的基础模型之一。", "ai": true, "freq": 2, "q": "技术采纳模型（TAM）是什么？", "src": "2024.10真题", "tag": "名解"}, {"a": "【参考答案】认为个体行为意向取决于行为态度、主观规范和知觉行为控制三个因素的理论。常用于解释网民的信息分享、媒介使用等行为，是新媒体效果研究的重要理论工具。", "ai": true, "freq": 2, "q": "计划行为理论（TPB）是什么？", "src": "2024.10真题", "tag": "名解"}, {"a": "【参考答案】个体只关注自己感兴趣的信息、视野日益狭窄，如同生活在蚕茧中的现象。其个人表征是“个人日报”。它是算法推荐的负效应之一，与回声室效应、群体极化构成网络心理效应链。", "ai": true, "freq": 2, "q": "信息茧房是什么？", "src": "2024.10真题", "tag": "名解"}, {"a": "【按背诵资料整理】社交类：微信、微博；新闻资讯类：今日头条、澎湃新闻；短视频类：抖音、快手；问答/社区类：知乎、小红书；直播类：斗鱼、抖音直播。（列举5个不同类型即可）", "ai": true, "freq": 2, "q": "请列举五个不同类型的移动端新媒体应用。", "src": "2024.10真题", "tag": "简答"}, {"a": "【按背诵资料整理】STIP模型认为用户是否接受使用一个新媒体产品，主要受4个因素影响：1 社会控制；2 技术特征；3 周围人影响；4 个性特征。（依据串讲：社会控制来自创新扩散理论的“社会体系变量”，技术特征来自创新扩散理论的“意识到的创新特征”和技术采纳模型的“有用性感知”“易用性感知”，周围人影响来自计划行为理论的“主观规范”，个性特征来自创新扩散理论的“接受者变量”和技术采纳模型的“外部因素”）", "ai": true, "freq": 2, "q": "简述新媒体研究的“STIP”模型的四要素。", "src": "2024.10真题", "tag": "简答"}, {"a": "【按背诵资料整理】内容为王（做强原创、做精垂直，避免同质化）；技术赋能（优化算法推荐，兼顾个性化与主流价值）；用户运营（增强互动、培养用户黏性，发展会员制）；融合发展（与短视频、直播结合，形态创新）；盈利模式（广告+付费+政务服务多元变现）。", "ai": true, "freq": 2, "q": "简述新闻客户端的发展对策。", "src": "2024.10真题", "tag": "简答"}, {"a": "【按背诵资料整理】信息茧房（只推用户爱看的，视野越收越窄）；回声室效应（同类观点相互强化，加剧群体极化）；标题党泛滥（迎合点击，劣币驱逐良币）；价值观偏差（流量至上，忽视社会价值）；隐私问题（过度采集用户数据）。", "ai": true, "freq": 2, "q": "简述目前新闻推荐算法存在的问题。", "src": "2024.10真题", "tag": "简答"}, {"a": "【按背诵资料整理】系统级内容审核：内置信息过滤、骚扰拦截、未成年人模式；隐私保护技术：应用权限管理、数据本地化、隐私空间；防沉迷机制：使用时长管理、青少年模式；安全防护：反诈预警、恶意链接识别；配合监管：落实实名制、内容安全管理责任。（开放题，言之成理即可，紧扣“技术管理”）", "ai": true, "freq": 2, "q": "结合华为（HUAWEI）手机，简要谈谈手机厂商如何加强手机媒体管理的技术管理。", "src": "2024.10真题", "tag": "简答"}, {"a": "【按背诵资料整理】一、获取与传播信息动机：拍摄山火现场视频照片，把灾情严重程度、救援进展及时传播到网上——用户既是信息获取者，也成为信息生产者；二、社交协作动机：利用微信群、QQ群发布救援任务、需求信息、现场情况，快速组织协调救援力量，实现高效协作；三、情感表达与利他动机：记录消防员英勇奋战、志愿者搬运物资、市民送水送饭等感人瞬间，表达情感、实现自我价值；四、从众与自我呈现动机：关注热点公共事件、参与公共议题讨论，获得归属感与认同。对照手机用户上网三大动机（获取信息、休闲娱乐、追求时尚），本事件中主导的是信息动机与社交参与动机。", "ai": true, "freq": 2, "q": "请结合以下材料，分析该网络事件中手机用户使用手机的动机。\n8 月，某市发生森林火情。当地迅速行动，调集了包括航空救援队、消防、武警等在内的救援力量 1800 余人参与扑救。同时，来自云南、甘肃、四川的森林消防员也赴赶支援。许多当地居民以及关注此事的人民，通过手机拍摄山火现场的视频和照片，将灾情的严重程度、救援的进展等信息及时传播到网络上。一些志愿者和救援机构利用手机通讯软件，如微信群、QQ 群等，快速组织和协调救援力量。他们在群里发布救援任务、需求信息以及现场情况等，使得救援人员能够及时了解到自己的任务和工作安排，实现了高效协作。手机用户还拍摄记录了大量救援过程中的感人瞬间，比如消防员们英勇奋战、志愿者们不辞辛劳地搬运物资、普通市民为救援人员送水送饭等场景。", "src": "2024.10真题", "tag": "论述"}, {"a": "【按背诵资料整理】强联系/弱联系理论由格兰诺维特提出：强联系指亲密、频繁、多维度的社会关系（如亲友），弱联系指疏远、低频、单一维度的关系（如网友、粉丝）。一、微信朋友圈：强联系带来高信任。朋友圈基于现实熟人关系的双向好友，信任建立在现实社会关系背书之上，转发的新闻信任度高、说服力强；但强联系同质性导致信息同质化，易形成“回声室”。二、微信视频号：弱联系带来广传播。视频号基于算法推荐和单向关注的弱联系，信息来源多元、异质性强，传播范围广、公共性强，但信任度相对较低，受众对陌生账号信息天然存疑，需要权威信源背书。三、结论：新闻信息信任度与关系强度正相关、与传播广度负相关；用强联系做信任背书，用弱联系做范围扩散，兼得“传得开”与“信得过”。", "ai": true, "freq": 2, "q": "请运用强联系和弱联系理论，分析微信朋友圈和微信视频号中的新闻信息信任度。", "src": "2024.10真题", "tag": "论述"}, {"a": "【按背诵资料整理】结合“放下手机、面对真实世界”的材料，从媒介素养角度作答：主动管理使用时间（给抖音等应用设限，不做“低头族”）；辨别信息真伪（不轻信、不盲从短视频内容）；保持线下社交（把点赞换成真实的陪伴与关爱）；让手机媒体服务于真实生活而非支配生活。", "ai": true, "freq": 2, "q": "“别让你的生活追随浮华的网络，给人们你的爱，不要给他们你的赞，不要再为了没有人关注而烦恼，抬起头吧！放下手机，走出门去面对真实的世界！放下令你分心的一切，用新的方式去生活吧！”这是短视频《抬起头吧》最后一句台词，发人深思、令人警醒，请结合抖音使用谈谈如何善用手机媒体。", "src": "2024.10真题", "tag": "综合"}, {"a": "高度的移动性和便携性；信息传播的即时性；互动性；受众资源丰富；多媒体传播；手机也是新闻采访的便捷工具。", "ai": false, "freq": 1, "q": "简述手机媒体的优势。", "src": "简答串讲", "tag": "简答"}, {"a": "助长虚假与不良信息传播；侵犯个人隐私；信息安全隐患。", "ai": false, "freq": 1, "q": "简述手机传播的不足。", "src": "简答串讲", "tag": "简答"}, {"a": "形成新的交流环境；媒体生态更加复杂；传播主体更加多元；受众分化更加明显。", "ai": false, "freq": 1, "q": "简述手机媒体如何改变现有传播格局。", "src": "简答串讲", "tag": "简答"}, {"a": "对传统的舆论调控机制的冲击；冲击信息传播次序；冲击媒体发展环境。", "ai": false, "freq": 1, "q": "简述手机信息传播的舆论化带来的问题。", "src": "简答串讲", "tag": "简答"}, {"a": "操作的低门槛与传播的快捷性；拍摄的低成本与高成功率；编辑的随意性与个性化。", "ai": false, "freq": 1, "q": "简述拍摄手机的传播特性。", "src": "简答串讲", "tag": "简答"}, {"a": "受众参与新闻生产，新闻摄影受到挑战；受众掌控舆论的主动性获得提升。", "ai": false, "freq": 1, "q": "简述拍摄手机对新闻传播的影响。", "src": "简答串讲", "tag": "简答"}, {"a": "新闻图片的真实性与质量受到挑战；需采取对策加以规范。", "ai": false, "freq": 1, "q": "简述拍摄手机在新闻传播中的不足。", "src": "简答串讲", "tag": "简答"}, {"a": "先驱者（采用创新的先锋）；早期使用者（具有意见领袖的特质）；早期大多数（经过深思熟虑接受创新的人）；晚期大多数（多疑的人）；落后者（最后采用者）。", "ai": false, "freq": 1, "q": "罗杰斯将“个人创新性”分为哪5个等级？", "src": "简答串讲", "tag": "简答"}, {"a":  "tag": "简答"}, {"a": "拥有一套先进的算法，这是迎合用户喜好的关键；算法基于大数据、机器学习的智能分发工具，能根据用户反馈做个性化推荐；今日头条的广告模式较好地平衡了商业变现与用户体验；广告分发自动化；广告信息视频化；抓住短视频和直播带货时代机遇；抖音等产品的定位和内容页至关重要。核心战略定位是“让信息找人”。", "ai": false, "freq": 1, "q": "字节跳动公司是如何突围的？", "src": "简答串讲", "tag": "简答"}, {"a": "手机传播带来国家安全问题；手机拍摄功能引发隐私权侵犯问题；手机定位功能带来隐私权侵犯问题。", "ai": false, "freq": 1, "q": "手机媒体引发了哪些问题？", "src": "简答串讲", "tag": "简答"}, {"a": "违法收集用户手机相册中的截图信息；过度收集用户剪切板信息、应用列表信息；过度收集乘客人脸识别信息、年龄段信息、职业信息、亲情关系信息、家和公司打车地址信息；过度收集乘客评价代驾服务时、APP后台运行时、手机连接桔视记录仪设备时的精准位置（经纬度）信息；过度收集司机学历信息、以明文形式存储司机身份证号信息；在未明确告知乘客情况下分析乘客出行意图、常驻城市、异地商务/旅游信息；乘客使用顺风车服务时频繁索取无关的电话权限；未准确、清晰说明用户设备信息等19项个人信息处理目的。", "ai": false, "freq": 1, "q": "滴滴违法违规行为有哪些？", "src": "简答串讲", "tag": "简答"}, {"a": "勒索、心理变态、无目的好奇。", "ai": false, "freq": 1, "q": "偷拍者的动机有哪3种？", "src": "简答串讲", "tag": "简答"}, {"a": "规模大、速度快、多样化、价值高。", "ai": false, "freq": 1, "q": "位置信息有哪些“4V”特征？", "src": "简答串讲", "tag": "简答"}, {"a": "手机用户与信息的海量性；跨地域传播带来的挑战；政策法规滞后。", "ai": false, "freq": 1, "q": "手机媒体监管的难点有哪些？", "src": "简答串讲", "tag": "简答"}, {"a": "时新性（时间上的新近发生以及内容上的新奇）；流行性（内容能否被多数人喜爱并有突然迸发的特质）；互动性（内容能否促进用户点赞、评论、转发）；导向正确（政治逻辑在平台运营中的体现，发挥正面宣传、意识形态教育、网络正能量氛围等功能）。", "ai": false, "freq": 1, "q": "微博热搜的4要素是什么？", "src": "简答串讲", "tag": "简答"}, {"a": "加强关于手机媒体的法律法规建设；加强手机媒体伦理道德规范；技术管理。", "ai": false, "freq": 1, "q": "对手机媒体的控制途径有哪3个方面？", "src": "简答串讲", "tag": "简答"}, {"a": "明确责任主体，理顺管理体制；健全法规制度，严格依法管理；完善技术手段，强化技术管理；推动行业自律，强化自我约束；加强理论与实务研究，为行业发展提供指导帮助。", "ai": false, "freq": 1, "q": "如何科学有效地对手机媒体实施管理？", "src": "简答串讲", "tag": "简答"}, {"a": "尊重手机媒体的特殊规律，确立正确的立法原则；注重知识产权保护；增强政策法规的可操作性。", "ai": false, "freq": 1, "q": "尊重手机媒体发展的特殊规律，创新手机媒体管理应遵循哪些原则？", "src": "简答串讲", "tag": "简答"}, {"a": "勤勤恳恳，态度认真；成本低廉，节约人力。", "ai": false, "freq": 1, "q": "“人工智能智者”有哪两大优势？", "src": "简答串讲", "tag": "简答"}]</script>

var RAW=JSON.parse(document.getElementById('cards-data').textContent);
var ORDER=RAW.map(function(c,i){return i;}).sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
var KEY='zk_cards_'+SLUG;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.known&&s.wrong)return s;}catch(e){}return {known:[],wrong:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
var store=load();
var queue=[],retry=[],qi=0,roundTotal=0,roundKnown=0,roundAttempted={},phase='';
var roundMode='full',inRetry=false,resumed=false;
var POSKEY='zk_pos_'+SLUG;
function loadPos(){try{var p=parseInt(localStorage.getItem(POSKEY),10);if(!isNaN(p))return p;}catch(e){}return 0;}
function savePos(){if(roundMode==='full'&&!inRetry&&qi>=0&&qi<RAW.length){try{localStorage.setItem(POSKEY,String(qi));}catch(e){}}}
function clearPos(){try{localStorage.removeItem(POSKEY);}catch(e){}}
function paintBar(){var bar=document.getElementById('navctrl');if(!bar)return;if(phase==='quiz'){bar.style.display='flex';document.getElementById('navpos').textContent='第 '+(qi+1)+' / '+roundTotal+' 题';}else{bar.style.display='none';}}
function navRowHtml(){return '<div class="btnrow navrow"><button class="btn-ghost" onclick="goPrev()"'+(qi<=0?' disabled':'')+'>← 上一题</button><button class="btn-ghost" onclick="goNext()">'+(qi>=queue.length-1?'进入结算 →':'下一题 →')+'</button></div>';}
function goPrev(){if(phase!=='quiz'||qi<=0)return;resumed=false;qi--;savePos();showCard(false);}
function goNext(){if(phase!=='quiz')return;resumed=false;if(qi<queue.length-1){qi++;savePos();showCard(false);}else{qi++;advance();}}
function goJump(){var inp=document.getElementById('jumpin');var v=parseInt(inp.value,10);if(isNaN(v)||v<1||v>roundTotal){alert('请输入 1 到 '+roundTotal+' 之间的题号');return;}resumed=false;qi=v-1;savePos();inp.value='';showCard(false);}
function restartAll(){clearPos();startRound('full');}
function advance(){next();}

var TAGC={"名解": "#2a7a4b", "简答": "#b3541e", "论述": "#7a3b12", "选择": "#1a6fa8", "单选": "#1a6fa8", "综合": "#6a3fa0", "填空": "#1a6fa8"};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n').join('<br>');}
function freqLabel(f){var hot=f>=2?' hot':'';return '<span class="freq'+hot+'">真题考过 '+f+' 次</span>';}
function tagPill(t){var c=TAGC[t]||'#888';return '<span class="tag" style="background:'+c+'">'+esc(t)+'</span>';}
function srcPill(c){return c.src?'<span class="srcpill">'+esc(c.src)+'</span>':'';}
function knownCount(){return store.known.length;}
function paintProg(done,total){
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ptext').textContent='已掌握 '+knownCount()+' / '+RAW.length+'（本轮 '+done+'/'+total+'）';
}
function startScreen(){
  phase='menu';paintBar();paintProg(0,0);setTab('all');paintWCount();paintKCount();
  var nWrong=store.wrong.length;
  var h='<div class="center">共 '+RAW.length+' 张卡片<br>已掌握 '+knownCount()+' 张 · 待加强 '+nWrong+' 张<br><br>'+
    '<div class="btnrow"><button class="btn-show" onclick="startRound(\'full\')">开始自测</button></div>';
  if(nWrong){h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">只练错题（'+nWrong+'）</button></div>';}
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
  document.getElementById('b-retry').disabled=!nWrong;
}
function startRound(mode){
  roundAttempted={};roundKnown=0;
  if(mode==='wrong'){queue=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});}
  else{queue=ORDER.slice();}
  retry=[];roundMode=mode;inRetry=false;resumed=false;qi=0;roundTotal=queue.length;phase='quiz';
  if(mode==='full'){var _p=loadPos();if(_p>0&&_p<queue.length){qi=_p;resumed=true;}}
  if(!queue.length){startScreen();return;}
  showCard(false);
}
function showCard(revealed){
  var i=queue[qi],c=RAW[i],st=document.getElementById('stage');
  paintProg(qi,roundTotal);
  if(resumed)document.getElementById('ptext').textContent='第 '+(qi+1)+' / '+roundTotal+' 题 · 已从上次进度恢复';
  var h='<div class="fcard">'+freqLabel(c.freq)+srcPill(c)+tagPill(c.tag)+'<div class="q">'+esc(c.q)+'</div>';
  if(revealed){
    h+='<div class="a"><div class="alabel">✓ 答案要点</div>'+esc(c.a)+'</div></div>';
    h+='<div class="btnrow"><button class="btn-know" onclick="mark(true)">会 ✓</button><button class="btn-unknow" onclick="mark(false)">不会 ✗</button></div>';
    h+=navRowHtml();
  }else{
    h+='</div><div class="btnrow"><button class="btn-show" onclick="showCard(true)">显示答案</button></div>';
    h+=navRowHtml();
  }
  st.innerHTML=h;
  paintBar();resumed=false;
  window.scrollTo(0,0);
}
function mark(know){
  var i=queue[qi];
  roundAttempted[i]=1;
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(know){
    if(ki<0)store.known.push(i);
    if(wi>=0)store.wrong.splice(wi,1);
    roundKnown++;
  }else{
    if(wi<0)store.wrong.push(i);
    if(retry.indexOf(i)<0)retry.push(i);
  }
  save();paintKCount();paintWCount();qi++;savePos();next();
}
function next(){
  if(qi<queue.length){showCard(false);return;}
  if(retry.length){queue=retry;retry=[];qi=0;inRetry=true;roundTotal=queue.length;showCard(false);return;}
  summary();
}
function summary(){
  phase='done';clearPos();paintBar();
  var total=Object.keys(roundAttempted).length;
  var rate=total?Math.round(roundKnown/total*100):0;
  paintProg(roundTotal,roundTotal);
  var h='<div class="sum"><div style="text-align:center;color:#888;font-size:14px">本轮结算</div>'+
    '<div class="rate">'+roundKnown+' / '+total+'（'+rate+'%）</div>';
  if(store.wrong.length){
    h+='<div style="font-size:14px;color:#888;margin:10px 0 4px">错题本（'+store.wrong.length+'）· 点击展开看答案</div>';
    var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.classList.toggle(\'open\')">'+esc(c.q)+'</div><div class="wa">'+freqLabel(c.freq)+' '+srcPill(c)+tagPill(c.tag)+'<br>'+esc(c.a)+'</div></div>';
    });
  }else{
    h+='<div class="center">🎉 全部掌握！</div>';
  }
  h+='</div><div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')"'+(store.wrong.length?'':' disabled')+'>再练错题</button>'+
     '<button class="btn-ghost" onclick="startRound(\'full\')">重新开始</button></div>';
  document.getElementById('stage').innerHTML=h;
  window.scrollTo(0,0);
}
function paintWCount(){document.getElementById('wcount').textContent=store.wrong.length;}
function paintKCount(){document.getElementById('kcount').textContent=store.known.length;}
function setTab(mode){document.getElementById('tab-all').classList.toggle('on',mode==='all');document.getElementById('tab-wrong').classList.toggle('on',mode==='wrong');document.getElementById('tab-known').classList.toggle('on',mode==='known');}
function showWrongList(){
  phase='wrong';setTab('wrong');
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='不会的卡片共 '+store.wrong.length+' 张 · 点击问题可收起/展开答案';
  paintWCount();
  var st=document.getElementById('stage');
  var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ws.length){
    h='<div class="center">\u0001F389 没有不会的卡片，全部掌握！</div>';
  }else{
    h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">再练一遍（'+ws.length+'）</button></div>';
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.querySelector(\'.wa\').classList.toggle(\'show\')">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+freqLabel(c.freq)+' '+srcPill(c)+tagPill(c.tag)+'<br>'+esc(c.a)+
         '<br><button class="wmark" onclick="markKnownFromList('+i+',this)">\u2713 会了，移出</button></div></div>';
    });
  }
  st.innerHTML=h;
  paintBar();resumed=false;
  window.scrollTo(0,0);
}
function markKnownFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki<0)store.known.push(i);
  if(wi>=0)store.wrong.splice(wi,1);
  save();paintWCount();paintKCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.wrong.length)showWrongList();
}
function showKnownList(){
  phase='known';setTab('known');
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='已掌握的卡片共 '+store.known.length+' 张 · 答案直接展示';
  paintWCount();paintKCount();
  var st=document.getElementById('stage');
  var ks=store.known.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ks.length){
    h='<div class="center">还没有已掌握的卡片</div>';
  }else{
    ks.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+freqLabel(c.freq)+' '+srcPill(c)+tagPill(c.tag)+'<br>'+esc(c.a)+
         '<br><button class="wmark" onclick="markUnknownFromList('+i+',this)">&#8630; 还是不会</button></div></div>';
    });
  }
  st.innerHTML=h;
  paintBar();resumed=false;
  window.scrollTo(0,0);
}
function markUnknownFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki>=0)store.known.splice(ki,1);
  if(wi<0)store.wrong.push(i);
  save();paintWCount();paintKCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.known.length)showKnownList();
}
document.getElementById('tab-all').onclick=function(){startScreen();};
document.getElementById('tab-wrong').onclick=function(){showWrongList();};
document.getElementById('tab-known').onclick=function(){showKnownList();};
document.getElementById('b-retry').onclick=function(){if(store.wrong.length)startRound('wrong');};
document.getElementById('b-reset').onclick=function(){
  if(confirm('清空本门课的全部自测进度？')){localStorage.removeItem(KEY);localStorage.removeItem(POSKEY);store={known:[],wrong:[]};startScreen();}
};
document.getElementById('jumpbtn').onclick=function(){goJump();};
document.getElementById('restartbtn').onclick=function(){restartAll();};
document.getElementById('jumpin').addEventListener('keydown',function(e){if(e.key==='Enter')goJump();});
(function(){var _sx=0,_sy=0;var _st=document.getElementById('stage');_st.addEventListener('touchstart',function(e){if(e.touches.length===1){_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;}},false);_st.addEventListener('touchend',function(e){if(phase!=='quiz')return;var _t=e.changedTouches[0];var _dx=_t.clientX-_sx,_dy=_t.clientY-_sy;if(Math.abs(_dx)>=48&&Math.abs(_dx)>Math.abs(_dy)*1.4){if(_dx>0)goNext();else goPrev();}},false);})();
(function(){var _p=loadPos();if(_p>0&&_p<RAW.length){startRound('full');}else{startScreen();}})();
</script>
</body></html>
