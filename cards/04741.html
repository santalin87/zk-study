<script id="cards-data" type="application/json">[{"q":"计算机网络最基本的功能是____，最突出的优点是____","a":"最基本功能：数据通信；最突出优点：资源共享。定义：互联的、自治的计算机的集合。","freq":1,"tag":"选择"},{"q":"计算机网络逻辑组成是____ + ____","a":"通信子网（网络核心：结点交换机、通信线路及设备，负责高效可靠的数据通信）+ 资源子网（网络边缘：主机、终端、软件，负责数据处理）。","freq":1,"tag":"选择"},{"q":"按覆盖范围 / 按交换方式 / 按拓扑结构的网络分类","a":"按覆盖范围：LAN / MAN / WAN；按交换方式：电路交换网 / 报文交换网 / 分组交换网；按拓扑：星型 / 树型 / 总线型 / 环型 / 网状型。","freq":1,"tag":"选择"},{"q":"简述协议三要素及其定义的内容（2023.10 简答 36）","a":"语法、语义、时序。时序指执行各种操作的条件与顺序关系。","freq":1,"tag":"简答"},{"q":"简述电路交换与分组交换的区别","a":"电路交换：需建立连接、资源独占、时延小实时性强、信道利用率低；分组交换：存储转发、无需预先建连、线路利用率高、可能失序/丢失/重复、只适用于数字信号。","freq":1,"tag":"简答"},{"q":"OSI 七层（自下而上）和 TCP/IP 四层分别是什么","a":"OSI：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层；TCP/IP：网络接口层（数据链路层）、网际层、运输层、应用层。各层传输单元：物理层比特、数据链路层帧、网络层分组/数据报、传输层报文段。","freq":1,"tag":"选择"},{"q":"网络体系结构是____的集合；服务通过____向紧邻上层提供","a":"各层 + 各层协议 + 层间接口；服务访问点（SAP）。","freq":1,"tag":"选择"},{"q":"无噪声信道与有噪声信道的最大数据率公式","a":"奈奎斯特（无噪声）：Rmax = 2f（bps）；香农（有噪声）：Rmax = B * log2(1+S/N)。","freq":1,"tag":"选择"},{"q":"香农公式计算（2023.10 单选 17：信噪比 30dB、八进制、8KHz；2025.10 单选 23：16KHz、30dB）","a":"30dB 对应信噪比 S/N = 1000，log2(1+S/N) 约等于 10，所以 Rmax 约等于带宽 B * 10。","freq":2,"tag":"选择"},{"q":"画出比特串 1011010010 的差分双相码（差分曼彻斯特码）波形图，并写出编码规则（2024.4-41）","a":"差分双相码：每比特开始边界有跳变表示 0、无跳变表示 1，比特中点固定跳变。编码规则必须会默写 + 画波形。","freq":1,"tag":"简答"},{"q":"画出比特串 1001011010 的双相码（曼彻斯特码）波形图，并写出编码规则（2024.10-41）","a":"曼彻斯特码（双相码）：编码规则默写 + 给定比特串画波形。三选一必考的送分简答。","freq":1,"tag":"简答"},{"q":"画出比特串 0100110011 的 CMI 码波形图，并写出编码规则（2025.10-41）","a":"CMI 码：编码规则默写 + 给定比特串画波形。三选一必考的送分简答。","freq":1,"tag":"简答"},{"q":"简答固定题型：编码规则 + 画波形图（曼彻斯特 / 差分曼彻斯特 / CMI，三选一必考）","a":"5 份真题考了 3 次：2024.4-41 差分双相码画 1011010010；2024.10-41 曼彻斯特码画 1001011010；2025.10-41 CMI 码画 0100110011。编码规则必须会默写 + 画波形，这是最有规律的送分简答。","freq":3,"tag":"简答"},{"q":"四种二进制数字调制中，频带利用率最低、误码率最高的是____（2024.10 单选 24、2024.4 单选 24）","a":"2ASK（2ASK、2FSK、2PSK、2DPSK）。","freq":2,"tag":"选择"},{"q":"频分 / 时分 / 波分 / 码分多路复用及对应的多址接入协议","a":"FDM 频分 / TDM 时分（含同步 STDM 与统计/异步 ATDM）/ WDM 波分（光纤）/ CDM 码分；对应 MAC 协议 FDMA / TDMA / WDMA / CDMA。","freq":1,"tag":"选择"},{"q":"工作在物理层的设备是____","a":"中继器、集线器（集线器下连的仍是一个冲突域）。","freq":1,"tag":"选择"},{"q":"误码率约 1e-9 ~ 1e-10、速率高、损耗小、抗电磁干扰强、保密性好的传输介质是____","a":"光纤。","freq":1,"tag":"选择"},{"q":"双绞线的传输距离限制约为____，主要缺点是____","a":"约 100m；易受干扰。","freq":1,"tag":"选择"},{"q":"数据链路层传输的数据单元称为____，实现数据链路层 + 物理层功能的典型硬件是____","a":"帧；网卡（NIC）。数据链路层功能：组帧、链路接入、可靠传递、差错控制。","freq":1,"tag":"选择"},{"q":"简述差错产生原因、差错控制概念及四种基本控制方式（2024.4 简答 38）","a":"1. 检错重发；2. 前向纠错（适用于单工链路或实时性要求高的应用）；3. 回退校验；4. 检错丢弃。","freq":1,"tag":"简答"},{"q":"简述差错控制的概念、差错两种类型及特点（2025.10 简答 40）","a":"差错两种类型：随机差错（孤立出现）、突发差错（成串出现）。控制方式：检错重发、前向纠错、回退校验、检错丢弃。","freq":1,"tag":"简答"},{"q":"随机差错与突发差错的特点，及突发长度的定义（2024.10 简答 38）","a":"随机差错孤立出现、突发差错成串出现；突发长度指突发差错中第一个出错位到最后一个出错位之间的位数（含正确位）。","freq":1,"tag":"简答"},{"q":"简述停-等协议的主要特点及基本工作过程（2024.10 简答 36）","a":"发送窗口 = 1、接收窗口 = 1，可靠传输最简单的形式，信道利用率最低。","freq":1,"tag":"简答"},{"q":"编码集汉明距离 ds = r+1 可____，ds = 2r+1 可____；汉明码满足____","a":"可检测 r 位差错；可纠正 r 位差错；2^r >= k+r+1（汉明码是线性分组码，可纠 1 位错）。","freq":1,"tag":"选择"},{"q":"奇偶校验码、汉明码、CRC 循环冗余码的特点","a":"奇偶校验码：1 位冗余，开销最小，检错率不高，用于低速串行链路；CRC：多项式编码，生成多项式 G(X) 最高位与最低位系数必须为 1，广泛用于以太网、802.11、PPP。","freq":1,"tag":"选择"},{"q":"已知 G(x) = x4+x2+x+1，对 100111011101 求 CRC 校验位并写出编码结果，要求写计算过程（2024.4-40）","a":"编码三步：信息位后补 r 个 0 -> 模 2 除法求余数 R -> 相减得编码帧。生成多项式 G(X) 最高位与最低位系数必须为 1。模 2 除法必须练熟。","freq":1,"tag":"简答"},{"q":"已知 G(x) = x4+x+1，对 100111011101 做 CRC 编码（2024.10 单选 19）；G(x) = x4+x+1 对 1101011011 求 CRC 冗余位（2025.10 填空 34）","a":"CRC 是简答/选择常客：后补 r 个 0 -> 模 2 除法求余数 R -> 相减得编码帧。","freq":2,"tag":"选择"},{"q":"MAC 协议三类及根本任务","a":"信道划分（多路复用实现）、随机接入（ALOHA、CSMA、CSMA/CD）、受控接入（集中式轮询 / 分散式令牌）。根本任务是解决信道共享问题。","freq":1,"tag":"选择"},{"q":"纯 ALOHA 与时隙 ALOHA 的吞吐量公式及最高值","a":"纯 ALOHA：S = G*e^(-2G)，G = 0.5 时最高 18.4%；时隙 ALOHA：S = G*e^(-G)，G = 1 时最高 36.8%。","freq":1,"tag":"选择"},{"q":"非坚持 / 1-坚持 / P-坚持 CSMA 的特点及共同概括","a":"非坚持：忙则随机等待，冲突少但信道空闲多；1-坚持：忙则持续监听，空闲立即发，冲突多；P-坚持：时隙信道，以概率 P 发送。共同概括先听后说。","freq":1,"tag":"选择"},{"q":"简述 P-坚持 CSMA 的基本原理（2025.10 简答 39）","a":"时隙信道，监听到空闲以概率 P 发送、以概率 1-P 推迟到下一时隙。","freq":1,"tag":"简答"},{"q":"简述 CSMA/CD 的工作原理（2023.10 简答 39）","a":"先听后发、边发边听；冲突检测靠信号强度，只适用于有线信道；冲突后用截断二进制指数退避算法重发；最小帧长满足 Lmin/R >= 2*Dmax/v。","freq":1,"tag":"简答"},{"q":"CSMA/CD 最小帧长公式（2024.4 单选 22 考最远距离计算、2024.10 填空 33 考最小帧长计算）","a":"Lmin/R >= 2*Dmax/v：往返时延内必须能检测到冲突。","freq":2,"tag":"选择"},{"q":"以太网帧结构各字段长度；类型字段 0x0800 表示什么","a":"目的地址 6B + 源地址 6B + 类型 2B + 数据 46~1500B + CRC 4B；0x0800 表示封装 IP 数据报。","freq":1,"tag":"选择"},{"q":"MAC 地址的长度、特点及广播地址","a":"6 字节十六进制；全球唯一、扁平结构（不随位置改变）；广播地址 FF-FF-FF-FF-FF-FF。","freq":1,"tag":"选择"},{"q":"ARP 请求用____帧发送、响应____返回；ARP 表的特点","a":"请求用广播帧发送、响应单播返回；ARP 表自动建立、即插即用。","freq":1,"tag":"选择"},{"q":"交换机的工作原理：自学习 + 转发/过滤 + 泛洪","a":"自学习（按源 MAC 建表）+ 转发/过滤（按目的 MAC 查表）；查不到则泛洪（flood）；广播/组播帧向所有端口转发。","freq":1,"tag":"选择"},{"q":"交换机分割____，不能分割____；____可分割广播域","a":"交换机分割冲突域、不能分割广播域；路由器可分割广播域。","freq":1,"tag":"选择"},{"q":"简述交换机与路由器的区别","a":"交换机工作在数据链路层、按 MAC 地址转发、只分割冲突域；路由器工作在网络层、按 IP 地址（网络 ID）选路、可分割广播域、隔离不需要的通信量。","freq":1,"tag":"简答"},{"q":"VLAN 的作用及划分方法","a":"基于交换机的逻辑分割广播域，抑制广播风暴；划分方法：基于端口 / 基于 MAC 地址 / 基于上层协议。","freq":1,"tag":"简答"},{"q":"HDLC 为保证透明传输用了____方法，PPP 用了____（2023.10 填空 33）","a":"HDLC 用位填充（5 个连续 1 插 0）；PPP 用字节填充（转义字节 0x7D）。","freq":1,"tag":"选择"},{"q":"PPP 的三个功能是____；PPP 的差错处理特点","a":"成帧、LCP 链路控制协议、NCP 网络控制协议；PPP 只检错不纠错。","freq":1,"tag":"选择"},{"q":"点对点链路不存在媒体共享问题，____（是否）需要 MAC 协议","a":"不需要。","freq":1,"tag":"选择"},{"q":"虚电路网络与数据报网络的区别","a":"虚电路：网络层提供面向连接服务（路径 + VC 号 + 沿途转发表项）；数据报：无连接服务，每个分组独立选路，可能失序/丢失/重复。","freq":1,"tag":"选择"},{"q":"路由器工作在 OSI 第____层；按____查转发表；对____减 1 并重算校验和","a":"第三层；目的 IP；TTL。","freq":1,"tag":"选择"},{"q":"简述路由器利用 IP 数据报的目的 IP 地址检索匹配路由表的过程（2024.4 简答 37）","a":"最长前缀匹配；TTL 减 1 并重算校验和；加上下一跳 MAC 后从输出端口转发（排队等待）。","freq":1,"tag":"简答"},{"q":"与 IP 分片有关的 IPv4 首部字段是____；防止分组无限循环的字段是____","a":"标识 / 标志 / 片偏移；TTL。","freq":1,"tag":"选择"},{"q":"超网 195.125.0.0/22 中 IP 地址总数和包括的 C 类地址网络个数（2024.4 单选 15）","a":"1024 和 4。超网包含的子网数 = 2^(被借位差)，会算。","freq":1,"tag":"选择"},{"q":"基于链路状态路由算法的内部网关协议是____，基于距离向量的内部网关协议是____，Internet 标准的外部网关协议是____","a":"OSPF；RIP（基于 Bellman-Ford，定期交换路由表）；BGP（外部网关 / 策略路由协议）。","freq":1,"tag":"选择"},{"q":"IPv6 基本首部长度为固定的____字节（2024.4 / 2024.10 单选 17）","a":"40 字节。IPv6 地址 128 位。","freq":2,"tag":"选择"},{"q":"DHCP 动态分配 IP 的四个阶段","a":"发现 -> 提供 -> 选择 -> 确认。","freq":1,"tag":"选择"},{"q":"NAT 的作用","a":"私网地址与公网地址转换，缓解 IPv4 地址不足。","freq":1,"tag":"选择"},{"q":"ping 和 tracert 分别利用 ICMP 的什么机制测连通性/路径","a":"ping 用回送请求/应答测连通性；tracert 利用 TTL 超时测路径。","freq":1,"tag":"选择"},{"q":"主机跨网段发送 IP 分组时，先把分组发给____（2025.10 填空 32）","a":"默认路由器（默认网关）。","freq":1,"tag":"选择"},{"q":"简述 TCP 与 UDP 的区别","a":"TCP 面向连接、可靠（确认/重传/流量与拥塞控制），适合大数据量；UDP 无连接、不可靠、速度快，适合实时应用（DNS、视频）。","freq":1,"tag":"简答"},{"q":"UDP 套接字是____，TCP 套接字是____","a":"二元组（目的 IP + 目的端口）；四元组（源 IP、源端口、目的 IP、目的端口）。","freq":1,"tag":"选择"},{"q":"TCP 报文首部的主要字段","a":"源/目的端口号、序号、确认号、接收窗口、首部长度、6 个标志位、校验和。功能：连接管理、流量控制、可靠传输、拥塞控制。","freq":1,"tag":"选择"},{"q":"流水线差错恢复的两种基本方法是____","a":"回退 N 步（GBN）与选择重传（SR）。","freq":1,"tag":"选择"},{"q":"停-等协议和滑动窗口协议实现的是____（2025.10 单选 18）","a":"检错重发。","freq":1,"tag":"选择"},{"q":"简述流量控制和拥塞控制的区别（2024.10 简答 37）","a":"流量控制：滑动窗口 + 累积确认；拥塞控制：慢开始 / 拥塞避免、门限 ssthresh，超时与 3 个重复 ACK 的处理不同。","freq":1,"tag":"简答"},{"q":"简述拥塞概念、直接后果及 TCP 拥塞控制机制（2025.10 简答 38）","a":"TCP 拥塞控制机制：慢开始 / 拥塞避免；超时 -> ssthresh = cwnd/2、cwnd = 1MSS 进入慢启动；3 个重复 ACK -> ssthresh = cwnd/2、cwnd = ssthresh 进入拥塞避免。","freq":1,"tag":"简答"},{"q":"TCP 建立连接采用____，释放连接采用____","a":"三次握手建连、四次挥手释放（5 份真题均未要求画三次握手时序图，不押画图）。","freq":1,"tag":"选择"},{"q":"发送两段数据 400B + 600B、首序号 800，确认序号是____（2023.4 单选 24）","a":"1800（确认号 = 首序号 + 已收字节数 = 800 + 400 + 600）。","freq":1,"tag":"选择"},{"q":"发送 300B + 400B + 200B、第 3 段序号 800、第 2 段丢失，确认序号是____（2023.10 单选 24）","a":"400（丢失则确认号停在丢失段的首序号）。","freq":1,"tag":"选择"},{"q":"UDP 首部固定____字节；TCP 首部最大____字节（首部长度字段 * 4）","a":"8；60。","freq":1,"tag":"选择"},{"q":"TCP 首部长度字段值为 10，则首部长度和选项字段长度为____（2024.10 单选 11）","a":"首部长度 = 字段值 * 4 = 40 字节；选项字段 = 40 - 20 = 20 字节。","freq":1,"tag":"选择"},{"q":"FTP / Telnet / SMTP / DNS / HTTP / POP3 的熟知端口号","a":"21 / 23 / 25 / 53 / 80 / 110。","freq":1,"tag":"选择"},{"q":"DNS 运行在____协议____端口上；递归查询与迭代查询的区别；服务器分级","a":"UDP 53；递归查询是代为查到底，迭代查询是告诉你下一步找谁；服务器分级：根 / 顶级 / 权威 / 本地。","freq":1,"tag":"选择"},{"q":"DNS 服务器分级中最高层是____（2025.10 填空 30）","a":"root（根域名服务器）。","freq":1,"tag":"选择"},{"q":"HTTP 状态码 2xx / 3xx / 4xx / 5xx 的含义","a":"2xx 成功 / 3xx 重定向 / 4xx 客户端错 / 5xx 服务器错。","freq":1,"tag":"选择"},{"q":"客户端请求对象在服务器上不存在时，状态码为____（2024.4 填空 28）","a":"404。","freq":1,"tag":"选择"},{"q":"HTTP 非持久连接与持久连接的区别","a":"非持久连接每请求建一次连接；持久连接（流水 / 非流水）复用连接。","freq":1,"tag":"选择"},{"q":"HTTP 的请求方法有____","a":"GET / HEAD / POST。","freq":1,"tag":"选择"},{"q":"简述 Cookie 概念及安全问题（2023.4 简答 38）；Web 网站利用 Cookie 做用户跟踪的最常见用途（2025.10 简答 36）","a":"Cookie 弥补 HTTP 的无状态性；用于 Web 用户跟踪。","freq":2,"tag":"简答"},{"q":"允许用户代理只读取邮件部分内容的邮件读取协议是____（2023.4 单选 17、2025.10 填空 35）","a":"IMAP。发送用 SMTP（TCP 25），读取用 POP3（110）/ IMAP / HTTP；MIME 让 SMTP 传非 7 位 ASCII 内容。","freq":2,"tag":"选择"},{"q":"FTP 使用____号端口，采用____连接","a":"21；控制连接 + 数据连接双连接，双向传文件。","freq":1,"tag":"选择"},{"q":"C/S 与 P2P 的区别","a":"C/S：客户间不直接通信、服务器有固定 IP；P2P：对等实体直接通信、无专用服务器。","freq":1,"tag":"选择"},{"q":"防火墙是什么","a":"软硬件结合体，隔离内网与 Internet，按规则允许/阻止分组通过。","freq":1,"tag":"选择"},{"q":"IDS 的作用","a":"入侵检测系统，监视网络/系统运行状况，发现攻击企图与行为。","freq":1,"tag":"选择"},{"q":"IPSec 的作用","a":"IP 层开放安全架构，用加密保障 IP 通信的机密性与安全。","freq":1,"tag":"选择"},{"q":"网络管理的五大功能","a":"性能管理、故障管理、配置管理、计费（账户）管理、安全管理。","freq":1,"tag":"选择"},{"q":"凯撒密码的原理；密钥 k=3 对 This is an easy problem 加密求密文（2023.4 简答 41）","a":"单表代换，密钥 k 移位。结论：加密考概念 + 凯撒密码手工计算，不考大题证明。","freq":1,"tag":"简答"},{"q":"PGP 用的分组密码是____（2025.10 单选 25）","a":"IDEA。","freq":1,"tag":"选择"},{"q":"数字签名的单向散列算法是____（2024.4 单选 25）","a":"SHA-1（单向散列典型算法还有 MD5）。","freq":1,"tag":"选择"},{"q":"由报文 m 和认证密钥 s 得到 MAC 是____（2023.10 单选 25）","a":"H(m,s)。","freq":1,"tag":"选择"},{"q":"对接入网络的用户/设备进行身份认证与合规性检查，不合规者隔离或拒绝接入称为____（2025.10 填空 31）","a":"网络准入控制。","freq":1,"tag":"选择"},{"q":"SSID 是什么","a":"服务集标识，用于划分需独立身份验证的子网络。","freq":1,"tag":"选择"},{"q":"IEEE 802.11 的 MAC 协议采用____；为什么不用 CSMA/CD（2025.10 单选 24）","a":"CSMA/CA，用 RTS/CTS + ACK 回避冲突；无线信道不能边发边听。","freq":1,"tag":"选择"},{"q":"信号传播距离最远、穿透能力较好、速率为 11Mbit/s 的无线局域网标准是____（2024.10 单选 23）","a":"IEEE 802.11b。","freq":1,"tag":"选择"},{"q":"综合题型：时延 / 吞吐量 / 信道利用率计算（4/5 份真题考，最高频）","a":"发送时延 = 分组长度 / 带宽；传播时延 = 距离 / 传播速率；总时延 = 发送 + 传播 + 排队 + 处理；吞吐量 = min(各段速率)；停等协议利用率 = 发送时延 / (发送时延 + RTT)；时延带宽积 = 传播时延 * 带宽。","freq":4,"tag":"综合"},{"q":"综合题型：GBN / SR 滑动窗口协议分析（2/5 份）","a":"回退 N 步 GBN：累积确认，收到乱序 ACK 后的动作；选择重传 SR：独立确认；重传判断。真题：2023.4-43（13 分 GBN）、2024.4-44（11 分 SR）。","freq":2,"tag":"综合"},{"q":"综合题型：子网划分计算（2/5 份）","a":"子网数 = 2^x（x 为子网位）；每子网主机数 = 2^y - 2；block size = 256 - 掩码十进制数；广播地址 = 下一子网号 - 1。","freq":2,"tag":"综合"},{"q":"综合题型：交换机自学习与转发表（3/5 份，最爱考）","a":"自学习（按源 MAC 建表）+ 转发/过滤（按目的 MAC 查表）；查不到则泛洪；广播/组播帧向所有端口转发。真题：2023.10-44、2024.4-42（13 分）、2025.10-44（15 分）。","freq":3,"tag":"综合"},{"q":"综合题型：ARP 跨网段过程（1/5 份）","a":"ARP 请求广播、响应单播；跨网段时主机先把 IP 分组发给默认网关；ARP 表项更新。真题：2024.10-43（13 分，给拓扑图 + ARP 表）。","freq":1,"tag":"综合"},{"q":"综合题型：TCP 拥塞控制计算（2/5 份）","a":"超时 -> ssthresh = cwnd/2、cwnd = 1MSS 进入慢启动；3 个重复 ACK -> ssthresh = cwnd/2、cwnd = ssthresh 进入拥塞避免；慢启动每 RTT 翻倍。真题：2024.10-44（12 分）、2025.10-42(4)、2025.10 填空 29。","freq":2,"tag":"综合"},{"q":"综合题型：RIP 路由表更新（1/5 份）","a":"收邻居通告 -> 跳数 +1 -> 下一跳改为通告者 -> 取更优。真题：2023.10-43（12 分，给 R6 路由表 + R4 的 RIP 通告，写更新后路由表）。","freq":1,"tag":"综合"},{"q":"综合题型：Dijkstra 最短路径（1/5 份）","a":"给拓扑图填路由表。真题：2025.10-43（8 分，给拓扑图填结点 D 的路由表）。","freq":1,"tag":"综合"},{"q":"定义实体彼此之间采用何种差错编码以及何种差错处理机制的网络协议要素是\nA．语法 B．语义 C．时序 D．编码","a":"【参考答案】B．语义（语法管格式结构，语义管“做什么、用什么”，时序管顺序）","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"以“易于监控与管理，故障诊断与隔离容易”为主要优点的网络是\nA．星形拓扑结构网络 B．总线型拓扑结构网络 C．环形拓扑结构网络 D．网状拓扑结构网络","a":"【参考答案】A．星形拓扑结构网络","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"按照网络所采用的交换技术对计算机网络进行分类，其中不包括的类型是\nA．分组交换网络 B．报文交换网络 C．虚拟交换网络 D．电路交换网络","a":"【参考答案】C．虚拟交换网络（只有电路/报文/分组交换）","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"在讨论网络总时间延迟时常常被忽略的是\nA．传输时延 B．排队时延 C．传播时延 D．结点处理时延","a":"【参考答案】D．结点处理时延","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"最典型、最基本的网络应用结构是\nA．层次结构 B．C/S结构 C．纯P2P结构 D．混合结构","a":"【参考答案】B．C/S结构","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"根据保存的域名信息及在域名解析过程中的作用对域名服务器分类，其中不包括\nA．顶级域名服务器 B．权威域名服务器 C．默认域名服务器 D．中间域名服务器","a":"【参考答案】D．中间域名服务器","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"HTTP报文的四个组成部分中，由报文类型、功能等决定其有无的是\nA．起始行 B．首部行 C．空行 D．实体主体","a":"【参考答案】D．实体主体","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"设码元速率为2400Baud，若采用曼彻斯特编码，无校验位，1位停止位的异步传输，30秒可传输数据\nA．3600B B．4000B C．7200B D．8000B","a":"【参考答案】A．3600B（曼彻斯特每比特2码元→1200bps；异步每字节10位→120B/s；30秒3600B）","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"Internet标准的外部网关协议是\nA．OSPF B．BGP C．EGP D．RIP","a":"【参考答案】B．BGP","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"在OSI参考模型中，实现在相邻结点之间数据可靠而有效传输功能的是\nA．物理层 B．数据链路层 C．网络层 D．传输层","a":"【参考答案】B．数据链路层","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"通常将TCP/IP参考模型传输层封装的数据包称为\nA．帧 B．报文 C．段 D．数据报","a":"【参考答案】C．段","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"Dijkstra路由选择算法属于\nA．链路状态路由选择算法 B．静态路由选择算法 C．距离向量路由选择算法 D．层次化路由选择算法","a":"【参考答案】A．链路状态路由选择算法","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"WWW服务的应用层协议是\nA．FTP B．UDP C．DNS D．HTTP","a":"【参考答案】D．HTTP","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"关于端口号，说法错误的是\nA．Web服务器的默认端口号是80 B．利用端口号可以唯一标识一个应用进程 C．通常服务器进程套接字会分配特定的端口号 D．通常客户进程的套接字会绑定一个随机的唯一端口号","a":"【参考答案】B．唯一标识应用进程需IP地址+端口号（套接字）","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"当本地域名服务器无法对Internet上的一个域名解析时，首先求助于\nA．顶级域名服务器 B．默认域名服务器 C．权威域名服务器 D．根域名服务器","a":"【参考答案】D．根域名服务器","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"关于HTTP状态码，说法错误的是\nA．HTTP状态码由3位十进制数组成 B．HTTP状态码位于HTTP请求报文的起始行 C．HTTP状态码利用第一位数字区分为5种类型 D．HTTP状态码用于服务器向客户端通告响应情况","a":"【参考答案】B．状态码位于响应报文的起始行，不是请求报文","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"Internet邮件系统中允许用户代理只读取邮件部分内容的邮件读取协议是\nA．SMTP B．MIME C．IMAP D．POP3","a":"【参考答案】C．IMAP","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"TCP/IP参考模型中为应用进程之间提供端到端通信服务的层次是\nA．网络接口层 B．网络互连层 C．传输层 D．应用层","a":"【参考答案】C．传输层","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"Internet网络中唯一标识一个UDP套接字的基本信息是基于二元组\nA．源IP地址和源端口号 B．源IP地址和目的IP地址 C．源端口号和目的端口号 D．目的IP地址和目的端口号","a":"【参考答案】D．目的IP地址和目的端口号","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"不可靠传输信道的不可靠性的主要表现不包括在数据传输过程中可能\nA．出现拥塞 B．发生比特差错 C．出现乱序 D．出现数据丢失","a":"【参考答案】A．出现拥塞（比特差错/乱序/丢失才是信道不可靠的表现）","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"实现VPN所涉及的技术中，相对核心的是\nA．数据加密技术 B．隧道技术 C．网络管理技术 D．访问控制","a":"【参考答案】B．隧道技术","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"在传输层使用UDP协议的互联网应用协议是\nA．FTP B．HTTP C．DNS D．SMTP","a":"【参考答案】C．DNS","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"TCP报文段的最大首部长度是\nA．15字节 B．20字节 C．40字节 D．60字节","a":"【参考答案】D．60字节（首部长度字段×4）","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"设主机甲乙之间已建立TCP连接，甲向乙发送了两个连续的分别包含400字节和600字节有效载荷的TCP报文段，第一段的序号为800。在乙正确接收到两个段以后发送给甲的确认序号为\nA．1000 B．1400 C．1800 D．2000","a":"【参考答案】C．1800（确认号=首序号+已收字节数=800+400+600）","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"关于数据报网络与虚电路网络，表述错误的是\nA．虚电路网络中的通信双方在通信前要先建立虚电路 B．虚电路网络在网络层提供面向连接的分组交换服务 C．因特网是一个数据报网络，双方通信前不需要先建立连接 D．数据报网络中的接收方收到分组后在网络层对分组重新排序","a":"【参考答案】D．数据报分组可能失序，不由网络层重新排序","tag":"单选","freq":2,"src":"2023.4真题","ai":true},{"q":"网络单位时间内传送的数据量称为______。","a":"【参考答案】吞吐量","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"TCP拥塞控制的基本策略是______。","a":"【参考答案】慢启动和拥塞避免（慢开始/拥塞避免）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"IEEE802委员会将局域网的数据链路层拆分为两个子层，与介质访问控制有关的内容放在______子层。","a":"【参考答案】MAC（介质访问控制子层）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"差错编码的检错或纠错能力与______有关。","a":"【参考答案】汉明距离（编码集的最小汉明距离）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"无线网络中，______在无线主机和网络基础设施之间起着链路层中继作用。","a":"【参考答案】接入点（AP）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"FTP应用采用______方式实现客户与服务器之间的双向文件传输。","a":"【参考答案】控制连接和数据连接（双连接）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"对于网络拥塞的解决，一般可以从增加网络资源或者______两个方面进行。","a":"【参考答案】降低负载（减少向网络注入的流量）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"一台主机通过局域网与一台路由器直接相连，这台路由器称为该主机的______。","a":"【参考答案】默认路由器（默认网关）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"物理层的接口特性包含机械特性、电气特性、功能特性和______特性。","a":"【参考答案】规程特性","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"网络安全通信需要的基本属性包括机密性、完整性、______、可访问与可用性。","a":"【参考答案】认证（鉴别）","tag":"填空","freq":2,"src":"2023.4真题","ai":true},{"q":"简述分层体系结构中面向连接服务和无连接服务的概念。","a":"【按背诵资料整理】面向连接服务：通信前先建立连接，数据按序传送、通信后释放连接，可提供可靠传送；无连接服务：又称数据报服务，通信前不建立连接，每个分组独立传输，不保证可靠，无建立和拆除链路的过程。","tag":"简答","freq":2,"src":"2023.4真题","ai":true},{"q":"简述HTTP/1.1使用持久连接的主要约束和规则。","a":"【按背诵资料整理】①HTTP/1.1默认使用持久连接，服务器发送响应后保持TCP连接打开，客户可继续发送请求；②客户或服务器任何一方可发送“Connection: close”首部关闭连接；③服务器通常在连接空闲一段时间后自动关闭；④持久连接上可采用流水线方式连续发送请求，服务器必须按收到请求的顺序返回响应；⑤客户端应限制与同一服务器保持的并发连接数。","tag":"简答","freq":2,"src":"2023.4真题","ai":true},{"q":"简述Cookie的概念及Cookie技术带来的安全问题。","a":"【按背诵资料整理】概念：Cookie是服务器生成的小型文本文件，弥补HTTP无状态性，用于Web用户跟踪。安全问题：Cookie可能记录用户隐私信息（如账号密码、浏览习惯），易被窃取或滥用，侵犯用户隐私；网站可利用Cookie限制特定用户访问。","tag":"简答","freq":2,"src":"2023.4真题","ai":true},{"q":"简述异步数据传输和同步数据传输方式的优缺点。","a":"【按背诵资料整理】异步传输：以字符为单位，每个字符加起始位和停止位；优点是设备简单、对同步要求低，缺点是开销大、传输速率低。同步传输：以帧为单位，收发双方时钟同步；优点是开销小、传输速率高，缺点是设备复杂、对同步要求高。","tag":"简答","freq":2,"src":"2023.4真题","ai":true},{"q":"简述移动IP结点通过外部代理完成向归属代理注册COA的步骤。","a":"【按背诵资料整理】①移动结点向外部代理发送注册请求，开始注册过程；②外部代理处理注册请求后，将其转发（中继）给归属代理；③归属代理建立或更新移动绑定（归属地址与转交地址COA关联），向外部代理发送注册应答；④外部代理将应答转发给移动结点，告知注册结果。","tag":"简答","freq":2,"src":"2023.4真题","ai":true},{"q":"简述凯撒密码的优缺点，并给出密钥k=3时，对明文“This is an easy problem”用凯撒密码加密后的密文。","a":"【按背诵资料整理】凯撒密码是单表代换密码，密钥k表示字母移位k位。优点：算法简单、易于实现。缺点：密钥空间极小（仅25种可能），易被穷举破解和频率分析攻击，保密性差。k=3加密：“This is an easy problem”→“Wklv lv dq hdvb sureohp”。","tag":"简答","freq":2,"src":"2023.4真题","ai":true},{"q":"（12分）主机A和主机B由一条带字R=1Gbit/s、长度D=1000km的链路互连，在t=0时刻，主机A通过该链路向主机B连续发送了10个长度L=1000B的分组，信号传播速度V=2×10^8m/s，忽略结点处理延迟。求：（1）第一个分组从主机A到主机B的时延（单位为ms）。（2）第五个分组从主机A到主机B的时延（单位为ms）。（3）链路的时延带宽积。（4）t=8μs时刻，第一个分组的第一位与主机A的距离（单位为m）。（5）10个分组全部发送完毕后，接收端只收到7个分组时的丢包率。","a":"【按背诵资料整理】发送时延=L/R=1000×8/10^9=8μs；传播时延=D/V=10^6/2×10^8=5ms。（1）5ms+8μs=5.008ms。（2）连续发送无排队，第五个分组时延相同=5.008ms。（3）时延带宽积=传播时延×带宽=5ms×1Gbit/s=5Mbit（625000字节）。（4）2×10^8×8×10^-6=1600m。（5）丢包率=(10-7)/10=30%。","tag":"综合","freq":2,"src":"2023.4真题","ai":true},{"q":"（13分）设传输层采用累积ACK确认的GBN协议，分组编号空间为[0，7]，上层有编号为0~4的5个分组等待传输层连续发送。当被上层首次调用时，发送端发送了0、1、2号3个分组，在发送这5个分组的过程中，先后收到确认ACK1、ACK0、ACK2、ACK4、ACK3。问：（1）发送窗口Ws和接收窗口Wr分别是多少？（2）发送端收到ACK1后，发送窗口中分组的基序号变为多少？（3）发送端收到ACK0后做何操作？（4）发送端收到ACK2并作出响应后，发送窗口中有几个分组？第一个可用分组序号是什么？（5）发送端没有按序收到确认是否说明一定出现了重传？为什么？","a":"【按背诵资料整理】（1）首次发送了3个分组→Ws=3；GBN接收窗口Wr=1。（2）ACK1是累积确认，0、1号均已确认，基序号变为2。（3）ACK0是重复确认（0号已确认），丢弃，不做任何操作。（4）ACK2确认到2号，基序号变为3；5个分组已全部发送，窗口内未确认的是3、4号共2个分组；下一个可用分组序号是5。（5）不一定。GBN采用累积确认，乱序到达的ACK只是延迟/重复到达的确认，发送端丢弃重复ACK继续等待；只有计时器超时才触发重传。","tag":"综合","freq":2,"src":"2023.4真题","ai":true},{"q":"（10分）已知网络地址192.168.1.0，对应的子网掩码为255.255.255.128。求：（1）该网络被划分的子网个数；（2）每个子网的主机数；（3）每个子网中主机可用合法IP地址范围；（4）每个子网的网络地址；（5）每个子网的广播地址。","a":"【按背诵资料整理】掩码/25，由/24借1位。（1）子网数=2^1=2个。（2）每子网主机数=2^7-2=126台。（3）子网1可用：192.168.1.1～192.168.1.126；子网2可用：192.168.1.129～192.168.1.254。（4）网络地址：192.168.1.0和192.168.1.128。（5）广播地址：192.168.1.127和192.168.1.255。","tag":"综合","freq":2,"src":"2023.4真题","ai":true},{"q":"计算机网络实现的核心功能是\nA．电子商务 B．资源共享 C．电子邮件 D．WWW服务","a":"【参考答案】B．资源共享","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"绝大多数实际网络的拓扑都属于\nA．混合拓扑结构 B．网状拓扑结构 C．星形拓扑结构 D．树形拓扑结构","a":"【参考答案】A．混合拓扑结构","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"关于数据交换技术，表述错误的是\nA．数据交换是在大规模网络上进行数据传输的技术基础 B．分组交换是计算机网络使用最广泛的一种数据交换技术 C．电路交换的优点是实时性高，时延和时延抖动都比较小 D．利用报文交换进行通信包括建立连接、传输数据和释放连接三个阶段","a":"【参考答案】D．报文交换不需要建立连接","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"10Bbase-5以太网的最短帧长为\nA．64字节 B．46字节 C．32字节 D．18字节","a":"【参考答案】A．64字节","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"关于域名系统（DNS），说法错误的是\nA．DNS服务器按层次结构进行组织 B．每个域名服务器只存储了部分域名信息 C．DNS服务器的管辖范围以“域”为单位 D．实现将域名映射为IP地址的过程称为域名解析","a":"【参考答案】C．DNS服务器的管辖范围以“区”（zone）为单位，区是域的子集（中等置信度，“域vs区”为题目设置的唯一疑似陷阱）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"不能用于用户从自己的邮箱中进行读取邮件操作的协议是\nA．POP3 B．MIME C．IMAP D．HTTP","a":"【参考答案】B．MIME（多用途网际邮件扩展，让SMTP传非ASCII内容，不是读取协议）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"UDP数据报的首部长度为\nA．4个字节 B．8个字节 C．16个字节 D．20个字节","a":"【参考答案】B．8个字节","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"若将信息码的0编码为双极不归零码的01，信息码的1交替编码为双极不归零码的11和00的基带传输码型为\nA．AMI码 B．双相码 C．CMI码 D．米勒码","a":"【参考答案】C．CMI码","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"用于创建套接字的Socket API函数是\nA．accept B．socket C．create D．sendto","a":"【参考答案】B．socket","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"OSI参考模型中，在层的实体之间传送的比特组称为\nA．比特流 B．分组 C．数据报 D．数据单元","a":"【参考答案】D．数据单元（中等置信度：题干泛指“层的实体”，取通用术语）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"在TCP/IP参考模型中，主要解决把数据分组发往目的网络或主机问题的是\nA．网络接口层 B．传输层 C．网络互连层 D．应用层","a":"【参考答案】C．网络互连层","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"若信号传播速度250000km/s，链路带宽1000Mbit/s，则时延带宽积刚好为分组长度1024bit时的链路长度为\nA．128m B．256m C．2560m D．256km","a":"【参考答案】B．256m（传播时延=1024/10^9=1.024μs；长度=250000×1.024e-6=0.256km）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"有关客户/服务器（C/S）结构的网络应用，说法错误的是\nA．服务器必须先运行做好通信准备 B．客户与客户之间的通信是直接进行的 C．服务器计算机一般具有固定的网络地址 D．在通信过程中主动发起通信的一方就是客户","a":"【参考答案】B．C/S中客户之间不直接通信","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"Internet中的任何主机进行网络地址配置时都会配置一个域名服务器作为\nA．默认域名服务器 B．权威域名服务器 C．中间域名服务器 D．顶级域名服务器","a":"【参考答案】A．默认域名服务器","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"在HTTP请求报文中，用于给服务器添加信息的“方法”是\nA．GET B．HEAD C．PUT D．POST","a":"【参考答案】D．POST","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"关于Cookie，说法错误的是\nA．Cookie由服务器端生成 B．Cookie是一个小型的文本文件 C．关闭浏览器不影响会话Cookie的有效周期 D．网站可以利用Cookie限制某些用户的访问","a":"【参考答案】C．会话Cookie关闭浏览器即失效","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"设信噪比为30dB，采用八进制数字调制方式，带宽为8KHz的信道可达到的最大数据传输速率约为\nA．24Kbit/s B．160Kbit/s C．240Kbit/s D．800Kbit/s","a":"【参考答案】D．香农公式：S/N=1000，log2(1001)≈10，8K×10=80Kbit/s；选项D“800Kbit/s”疑为“80Kbit/s”之误（原卷应为80Kbit/s）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"在TCP/IP体系结构的网络中，“端口号”对应的是\nA．服务器 B．通信端点 C．客户机 D．应用进程","a":"【参考答案】D．应用进程","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"传输层实现复用与分解的关键是传输层协议能够唯一标识一个\nA．套接字 B．应用进程 C．服务访问点 D．数据单元","a":"【参考答案】A．套接字","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"如果发送窗口为Ws，接收窗口为Wr，对于选择重传（SR）协议，则有\nA．Ws=1，Wr=1 B．Ws>1，Wr>1 C．Ws≥1，Wr=1 D．Ws≥1，Wr>1","a":"【参考答案】B．Ws>1，Wr>1","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"设10Mbit/s以太网中的信号传播速度为2×10^8m/s，若数据帧最小长度为250bit，则网中站间的最远距离为\nA．1.25km B．2.5km C．12.5km D．25km","a":"【参考答案】B．2.5km（Dmax=Lmin×v/(2R)=250×2e8/(2×1e7)=2500m）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"目前应用最广泛的无线局域网技术是\nA．IEEE802.11 B．IEEE802.12 C．IEEE802.15 D．IEEE802.16","a":"【参考答案】A．IEEE802.11","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"设子网中一个主机的IP地址为213.125.0.143，子网掩码为255.255.255.224，则该子网可分配的IP地址数为\nA．30 B．32 C．62 D．64","a":"【参考答案】A．30（/27，2^5-2=30）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"设主机甲乙之间已建立TCP连接，甲向主机乙发送了3个连续的分别包含300字节、400字节和200字节有效载荷的TCP报文段，第3段的序号为800。若乙仅正确接收到第1、3个报文段，则其发送给甲的确认序号是\nA．400 B．500 C．1100 D．1300","a":"【参考答案】A．400（第2段序号=800-400=400，丢失则确认号停在400）","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"对报文m和认证密钥s应用散列函数H得到的报文认证码MAC是\nA．H(m，s) B．H(m+s) C．H(m，H(m+s)) D．H(s，H(m+s))","a":"【参考答案】A．H(m，s)","tag":"单选","freq":2,"src":"2023.10真题","ai":true},{"q":"Internet的自治系统间路由选择协议称为______协议。","a":"【参考答案】BGP（边界网关协议）","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"数据链路层通常提供的服务包括组帧、______、可靠交付和差错控制。","a":"【参考答案】链路接入","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"网络应用程序可以创建的Socket包括数据报类型套接字、流式套接字和______套接字三种类型。","a":"【参考答案】原始（raw套接字）","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"典型的差错控制方式包括检错重发、前向纠错、反馈校验和______4种基本方式。","a":"【参考答案】检错丢弃","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"若采用曼彻斯特编码，100Mbit/s的数据传输速率需要码元速率达到______Baud。","a":"【参考答案】200M（曼彻斯特每比特2码元）","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"传输层的核心任务是为______之间提供端到端的逻辑通信服务。","a":"【参考答案】应用进程（进程）","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"TCP报文段的最大首部长度为______字节。","a":"【参考答案】60","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"HDLC协议为确保数据的透明传输使用了______方法。","a":"【参考答案】0比特插入（位填充/比特填充）","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"IEEE802委员会将局域网的数据链路层拆分为两个子层，其中______子层与媒介无关。","a":"【参考答案】LLC（逻辑链路控制子层）","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"1991年提出的安全电子邮件标准是______标准。","a":"【参考答案】PGP","tag":"填空","freq":2,"src":"2023.10真题","ai":true},{"q":"简述网络协议三要素及其定义的内容。","a":"【按背诵资料整理】语法：定义实体之间交换信息的格式与结构（传输信号的电平等）；语义：定义需要发送（或包含）哪些控制信息，即要完成何种动作、做出何种应答；时序：定义执行各种操作的条件与顺序关系，包括如何匹配或适应彼此的速度。","tag":"简答","freq":2,"src":"2023.10真题","ai":true},{"q":"简述SMTP发送邮件的过程。","a":"【按背诵资料整理】①客户与服务器的25端口建立TCP连接；②握手（HELO/EHLO）；③MAIL FROM指定发件人、RCPT TO指定收件人；④DATA传送邮件内容，以单独一行“.”结束；⑤QUIT关闭连接。","tag":"简答","freq":2,"src":"2023.10真题","ai":true},{"q":"简述通过MTU=1500字节的链路转发15800字节的IP数据报时的分片过程。","a":"【按背诵资料整理】IP首部20字节，每片最多封装1480字节数据（8的倍数）。3800-20=3780字节数据→分3片：片1长度1500，MF=1，片偏移=0；片2长度1500，MF=1，片偏移=185（1480/8）；片3长度840（820+20），MF=0，片偏移=370（2960/8）。各片标识字段相同。","tag":"简答","freq":2,"src":"2023.10真题","ai":true},{"q":"简述CSMA/CD的基本工作原理。","a":"【按背诵资料整理】先听后发、边发边听；发送前先侦听信道，空闲则发送；发送中通过信号强度检测冲突，只适用于有线信道；发生冲突后停止发送，用截断二进制指数退避算法等待随机时间重发；最小帧长须满足Lmin/R≥2Dmax/v，保证在发送完成前能检测到冲突。","tag":"简答","freq":2,"src":"2023.10真题","ai":true},{"q":"简述二进制数字调制2ASK、2FSK、2PSK和2DPSK的中文名称及其综合性能。","a":"【按背诵资料整理】中文名称：2ASK二进制幅移键控（振幅键控），2FSK二进制频移键控，2PSK二进制相移键控（绝对调相），2DPSK二进制差分相移键控（相对调相）。综合性能：误码率从低到高为2PSK<2DPSK<2FSK<2ASK；频带利用率2PSK和2DPSK最高，2FSK次之，2ASK最低；实现复杂度2ASK最简单，2PSK最复杂。","tag":"简答","freq":2,"src":"2023.10真题","ai":true},{"q":"简述虚拟专用网VPN的概念及实现VPN的关键技术。","a":"【按背诵资料整理】概念：VPN是利用公共网络（如Internet）构建的安全专用网络，通过隧道等技术在公网上传输私有数据。关键技术：隧道技术（最核心）、数据加密技术、身份认证、访问控制、网络管理技术。","tag":"简答","freq":2,"src":"2023.10真题","ai":true},{"q":"（12分）设两台主机之间数据传输只有一条链路，带宽R=10Mbit/s，平均往返时间RTT=100ms，分组长度L=1000B，ACK的发送时间可以忽略不计，试计算：（1）发送一个分组的传输时延dt。（2）传输层采用停-等协议时的信道利用率。（3）传输层协议采用GBN协议（发送窗口Ws=5）时的信道利用率。（4）传输层采用SR协议（发送窗口Ws和接收窗口Wr均为10）时的信道利用率。要求：写出计算过程，信道利用率小数点后保留4位有效数字。","a":"【按背诵资料整理】（1）dt=L/R=1000×8/10^7=0.8ms。（2）停-等：U=dt/(dt+RTT)=0.8/100.8≈0.0079。（3）GBN：U=Ws·dt/( ":true},{"q":"若CSMA/CD网络中两站间数据的传输速率为512Mbps，信号传播速度100000km/s，数据帧的最小长度为5120bit，则两站之间的最远距离可达到\nA．1000m B．800m C．500m D．200m","a":"【参考答案】C．500m（Dmax=Lmin×v/(2R)=5120×1e8/(2×512e6)=500m）","tag":"单选","freq":2,"src":"2024.4真题","ai":true},{"q":"IEEE802.11数据帧的主体（帧的数据部分）不超过\nA．2048字节 B．2312字节 C．1518字节 D．1500字节","a":"【参考答案】B．2312字节","tag":"单选","freq":2,"src":"2024.4真题","ai":true},{"q":"以下的二进制数字调制方式中，误码率最高的是\nA．2ASK B．2FSK C．2PSK D．2DPSK","a":"【参考答案】A．2ASK","tag":"单选","freq":2,"src":"2024.4真题","ai":true},{"q":"典型的用于创建数字签名的单向散列算法是\nA．MD5 B．IDEA C．RSA D．SHA-1","a":"【参考答案】D．SHA-1","tag":"单选","freq":2,"src":"2024.4真题","ai":true},{"q":"WWW服务的应用层协议是______。","a":"【参考答案】HTTP","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"通常将计算机网络中连接两个结点的直接链路称为一个______。","a":"【暂无可靠答案】，先记题干","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"当“客户端请求的对象在服务器上不存在”时，HTTP状态码为______。","a":"【参考答案】404","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"异构网络主要是指两个网络的通信技术和______的不同。","a":"【暂无可靠答案】，先记题干","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"网络层预防拥塞的策略有准入控制和______。","a":"【暂无可靠答案】，先记题干","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"已知IPv4数据报的第1个字节内容为二进制数01000101，数据报长度为4C4H，则该数据报可以封装______字节。","a":"【参考答案】1200（首部20字节，总长0x4C4=1220，数据1220-20=1200）","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"Internet的自治系统内路由选择协议称为______协议。","a":"【参考答案】内部网关协议（IGP）","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"ALOHA系统中，在一帧的发送时间内成功发送的平均帧数称为______。","a":"【参考答案】吞吐量","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"以太交换机的基本工作方式是______。","a":"【参考答案】存储转发","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"若在带宽为4KBaud的无噪声信道上采用8进制调制技术传输数字信号，则理想的信道容量为______。","a":"【参考答案】24kbit/s（奈奎斯特：2×4000×log2(8)=24000bps）","tag":"填空","freq":2,"src":"2024.4真题","ai":true},{"q":"简述分组交换过程中产生的结点处理时延、排队时延、传输时延和传播时延的概念。","a":"【按背诵资料整理】结点处理时延：分组在结点内进行差错检测、选路等处理所耗时间；排队时延：分组在输出队列中等待发送的时间；传输时延（发送时延）：结点将分组全部发送到链路上所需时间=分组长度/带宽；传播时延：信号在链路上传播的时间=距离/传播速率。","tag":"简答","freq":2,"src":"2024.4真题","ai":true},{"q":"简述路由器利用IP数据报的目的IP地址检索匹配路由表的过程。","a":"【按背诵资料整理】路由器提取IP数据报的目的IP地址，用最长前缀匹配原则在路由表中查找匹配的路由表项；将TTL减1并重新计算首部校验和；为分组添加下一跳的MAC地址封装成帧，从匹配的输出端口转发出去（排队等待）。","tag":"简答","freq":2,"src":"2024.4真题","ai":true},{"q":"简述传输差错产生的原因和差错控制的概念，并写出差错的四种基本控制方式。","a":"【按背诵资料整理】产生原因：信号在传输过程中受到噪声干扰（随机噪声引起随机差错，冲击噪声引起突发差错）。差错控制概念：通过差错编码技术实现对传输差错的检测，并基于某种机制进行差错纠正和处理，是实现可靠传输的重要技术手段。四种基本控制方式：检错重发、前向纠错（适用于单工链路或实时性要求高的应用）、回退校验、检错丢弃。","tag":"简答","freq":2,"src":"2024.4真题","ai":true},{"q":"简述流量控制的目的、存在于OSI参考模型的哪一层以及TCP协议实现流量控制的机制。","a":"【按背诵资料整理】目的：防止发送方发送数据过快，使接收方来不及接收而造成数据丢失。存在层次：数据链路层和传输层。TCP实现机制：滑动窗口机制，接收方在确认报文中通告接收窗口rwnd，发送方发送窗口取min(rwnd, cwnd)，不超过接收方接收能力。","tag":"简答","freq":2,"src":"2024.4真题","ai":true},{"q":"设CRC编码采用的生成多项式G(x)=x^4+x^2+x+1，待编码位串为100111011101，试求出该位串的CRC校验位并写出CRC编码后的结果（要求写出计算过程）。","a":"【按背诵资料整理】G(x)=10111，r=4。①信息位后补4个0：1001110111010000；②模2除法：1001110111010000÷10111，余数R=1100（逐位异或相减）；③编码结果=信息位+校验位=1001110111011100。","tag":"简答","freq":2,"src":"2024.4真题","ai":true},{"q":"简述差分双相码（差分曼彻斯特码）的编码规则，并对于比特串1011010010画出其差分双相码的波形图。【原卷此处为波形图】","a":"【按背诵资料整理】编码规则：每个比特周期的中间时刻固定有一次电平跳变（仅用于同步）；用比特开始边界是否存在跳变编码信息：开始边界有跳变表示0，无跳变表示1。波形图：【原卷此处为波形图】（按规则逐比特画：1011010010）。","tag":"简答","freq":2,"src":"2024.4真题","ai":true},{"q":"（13分）某局域网由一台交换机和三台主机组成，当前的交换表为：A|1。回答下列问题：（1）主机A发送一帧数据给主机B的过程中交换机和相应主机的工作内容。（2）主机C发送一帧数据给主机B的过程中交换机和相应主机的工作内容。（3）写出上述通信过程完成后，交换表中增加的MAC地址和接口的内容。【原卷此处为图，略】","a":"【按背诵资料整理】（1）主机A发帧给B：交换机收到帧后自学习（A↔端口1，已在表），查交换表无B→向除接收端口外的所有端口泛洪；B收到。（2）主机C发帧给B：交换机自学习（C↔其端口），查表仍无B→泛洪；B收到。（3）【暂无可靠答案】，先记题干（需原卷拓扑图确定B、C所接端口，图中缺失）","tag":"综合","freq":2,"src":"2024.4真题","ai":true},{"q":"（11分）某企业的IP网结172.16.7.128/25分为三个子网，各子网的主机数为：子网1需30台、子网2需25台、子网3需60台。试写出子网信息表中（1）~（11）处的具体内容（子网掩码/广播地址/可分配IP数）。","a":"【按背诵资料整理】/25共128个地址，按主机数60/30/25用VLSM划分：60台需/26（64地址），30台和25台各需/27（32地址）。（1）255.255.255.224；（2）172.16.7.159；（3）30；（4）172.16.7.160；（5）255.255.255.224；（6）172.16.7.191；（7）30；（8）172.16.7.192；（9）255.255.255.192；（10）172.16.7.255；（11）62。","tag":"综合","freq":2,"src":"2024.4真题","ai":true},{"q":"（11分）设传输层采用典型的SR滑动窗口协议，分组编号空间为[0，15]，发送窗口和接收窗口均为3；上层有编号为0~4的5个分组等待传输层按序连续发送。在传输这5个分组的过程中，发送端先后收到的确认是ACK1、ACK0、ACK4、ACK3、ACK2，接收端成功收到的分组编号顺序是1、0、2、3、4、2。试回答：（1）发送端收到ACK1后做何操作？（2）发送端收到ACK0后做何操作？（3）发送端收到ACK2后做何操作？（4）接收端为何会收到两个2号分组？（5）接收端在成功收到第2个2号分组后为何还要发送一次ACK2？","a":"【按背诵资料整理】（1）收到ACK1：SR采用独立确认，标记1号分组已确认；0号未确认，发送窗口基序号不动，不滑动。（2）收到ACK0：标记0号确认，窗口向前滑动，基序号变为2（1号已确认）。（3）收到ACK2：此时2、3、4号均已确认，发送窗口内无未确认分组。（4）发送端在收到ACK2之前，2号分组的计时器超时（或ACK2丢失/延迟到达），发送端重传了2号分组，接收端因此收到两个2号分组。（5）SR接收端对每个正确收到的分组都要发送确认，即便是重复收到的分组也要重发一次ACK，以防之前的ACK丢失，确保发送端可靠获知。","tag":"综合","freq":2,"src":"2024.4真题","ai":true},{"q":"以下关于英文缩写ISP的中文解释，正确的是\nA．入侵防御系统 B．Internet信息服务 C．Internet服务提供商 D．Internet分组交换协议","a":"【参考答案】C．Internet服务提供商","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"具有“故障诊断与隔离容易”的优点，网络规模受限于中央结点端口数量的网络是\nA．树形拓扑结构网络 B．环形拓扑结构网络 C．网状拓扑结构网络 D．星形拓扑结构网络","a":"【参考答案】D．星形拓扑结构网络","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"以下关于数据交换技术的表述，错误的是\nA．分组交换是计算机网络使用最广泛的一种数据交换技术 B．利用电路交换在传输数据之前必须建立一条端对端的电路 C．分组交换与报文交换相比最主要的区别是事先不需要建立连接 D．与报文交换相比分组交换的优点之一是交换设备存储容量要求低","a":"【参考答案】C．报文交换事先也不需要建立连接","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"实现虚拟专用网VPN的最安全、使用最广泛的技术是\nA．数据加密 B．L2TP C．IPSec D．PPTP","a":"【参考答案】C．IPSec","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"主机A向主机B以分组交换方式发送一个1MB的文件，主机A到B的路径上有三段链路，速率分别为R1=512kbit/s，R2=2Mbit/s，R3=1Mbit/s，则传送该文件到主机B需要的时间是\nA．16s B．32s C．64s D．128s","a":"【参考答案】A．16s（吞吐量=取瓶颈链路=min=512kbit/s；1MB=8Mb，8/0.512=15.625s≈16s）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"以下关于OSI参考模型中的面向连接的服务与无连接的服务的概念表述，错误的是\nA．无连接的服务又称为数据报服务 B．面向连接的服务提供的是可靠的传送方式 C．无连接的服务没有建立和拆除链路的过程 D．面向连接的服务传送数据通常以分组为单位按序传送","a":"【参考答案】B．面向连接不等于可靠（可靠性是服务质量参数）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"域名解析过程中，若本地域名服务器不能直接响应解析结果，则需要\nA．从权威域名服务器开始查询 B．从中间域名服务器开始查询 C．从顶级域名服务器开始查询 D．从根域名服务器开始查询","a":"【参考答案】D．从根域名服务器开始查询","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"以下关于Cookie的正确说法是\nA．Cookie由服务器端生成 B．Cookie是一个小型可执行文件 C．Cookie保存在服务器中 D．Cookie用于记录系统当前状态","a":"【参考答案】A．Cookie由服务器端生成","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"使用默认端口号80的服务器是\nA．SNMP服务器 B．FTP服务器 C．HTTP服务器 D．DNS服务器","a":"【参考答案】C．HTTP服务器","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"在实现可靠数据传输的过程中，用于解决数据丢失问题采取的措施是\nA．差错检测 B．引入序列号 C．确认机制 D．引入计时器","a":"【参考答案】C．确认机制","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"假设TCP报文段首部长度字段的值为10，则该段的最大首部长度和选项字段分别为\nA．40和10字节 B．40和20字节 C．40和30字节 D．60和20字节","a":"【参考答案】B．40和20字节（首部=10×4=40；选项=40-20=20）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"以下关于数据报网络的说法，错误的是\nA．双方通信前需要先建立连接 B．因特网是一个数据报网络 C．按照目的地址进行路径选择 D．接收方要对收到的分组重新排序","a":"【参考答案】A．数据报网络无连接，通信前不建立连接","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"路由器的交换结构不包括\nA．基于网络交换 B．基于地址交换 C．基于总线交换 D．基于内存交换","a":"【参考答案】B．基于地址交换","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"设IPv4数据报第1个字节和数据报长度字段内容分别为十六进制数45H和4D8H，则该数据报封装的数据为\nA．1171字节 B．1220字节 C．1235字节 D．1240字节","a":"【参考答案】B．1220字节（首部20字节，总长0x4D8=1240，数据1240-20=1220）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"设子网中主机的IP地址为195.158.0.135，子网掩码为255.255.255.192，则该子网的子网地址和可分配IP地址数分别为\nA．195.158.0.135/26和62 B．195.158.0.128和64 C．195.158.0.128/24和62 D．195.158.0.128和62","a":"【参考答案】D．195.158.0.128和62（/26，135&192=128；2^6-2=62）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"在传输层不使用UDP协议的Internet应用层协议是\nA．Telnet B．DHCP C．SNMP D．DNS","a":"【参考答案】A．Telnet（用TCP）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"下列选项中只能用作IPv6数据报目的地址的是\nA．单播地址和任播地址 B．单播地址和广播地址 C．组播地址和单播地址 D．组播地址和任播地址","a":"【参考答案】D．组播地址和任播地址（不能做源地址）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"下列基于距离向量路由选择算法的内部网关协议是\nA．IGP B．RIP C．OSPF D．BGP","a":"【参考答案】B．RIP","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"设生成多项式G(x)=X^4+X+1，则对位串100111011101进行CRC编码后的结果为\nA．1001110111010110 B．10011101110111 C．1001110111011100 D．10001010011110","a":"【参考答案】A．1001110111010110（G=10011，r=4，余数0110，已验算）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"可以使每个用户的信息传输速率最高可达到信道的总信息传输速率的多路复用方式是\nA．频分多路复用 B．异步时分多路复用 C．波分多路复用 D．同步时分多路复用","a":"【参考答案】B．异步时分多路复用（统计时分复用）","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"CSMA/CD存在冲突的主要原因是\nA．结点处理速度 B．数据传输速率 C．信号传播时延 D．帧的最小长度","a":"【参考答案】C．信号传播时延","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"数据通信系统是指在信源和信宿端处理的是\nA．数字信号 B．十进制数据 C．模拟信号 D．二进制数据","a":"【参考答案】A．数字信号","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"信号传播距离最远、穿透能力较好，且数据传输速率为11Mbit/s的无线局域网标准是\nA．IEEE802.11a B．IEEE802.11b C．IEEE802.11g D．IEEE802.11n","a":"【参考答案】B．IEEE802.11b","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"以下的二进制数字调制方式中，频带利用率最低的是\nA．2DPSK B．2ASK C．2FSK D．2PSK","a":"【参考答案】B．2ASK","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"在SSL的两层协议中，描述了SSL信息交换过程中的消息格式的是SSL\nA．记录协议 B．警告协议 C．更改密码协议 D．握手协议","a":"【参考答案】A．记录协议","tag":"单选","freq":2,"src":"2024.10真题","ai":true},{"q":"计算机网络实现的资源共享功能包括硬件和软件资源共享以及______资源共享。","a":"【参考答案】信息","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"丢包率常被用作评价网络性能的指标，引发网络丢包的主要因素是______。","a":"【参考答案】拥塞（网络拥塞）","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"在Web应用中，对Web页进行解释并显示的软件是______。","a":"【参考答案】浏览器","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"用于创建套接字的Socket API函数是______。","a":"【参考答案】socket","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"虚电路分组交换分为永久型虚电路和______型虚电路。","a":"【参考答案】交换（交换型/呼叫型虚电路）","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"网络层消除拥塞有流量调节方法和______方法。","a":"【暂无可靠答案】，先记题干","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"一台主机通过局域网与一台路由器直接相连，连接该主机所在子网的路由器接口就是该主机的______。","a":"【参考答案】默认网关","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"在采用CSMA/CD的网络中，站间距为1km，数据传输速率为10Mbps，信号传播速度为200m/μs，则MAC帧的最小帧长度为______。","a":"【参考答案】100（比特；传播时延5μs，最小帧=2×5μs×10Mbit/s=100bit）","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"设密钥key=4、字符集中的字母个数为26，利用凯撒密码求明文“word”的密文是______。","a":"【参考答案】asvh（w→a，o→s，r→v，d→h）","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"若采用4进制数字调制方式使数据传输速率达到4800bit/s，则码元速率应达到______。","a":"【参考答案】2400Baud（4800/log2(4)）","tag":"填空","freq":2,"src":"2024.10真题","ai":true},{"q":"简述“停-等”协议的主要特点及其基本工作过程。","a":"【按背诵资料整理】主要特点：发送窗口=1、接收窗口=1，是可靠传输最简单的形式，信道利用率最低。基本工作过程：发送方发送一帧后停止等待确认，收到确认ACK后再发送下一帧；若计时器超时未收到确认则重传该帧。","tag":"简答","freq":2,"src":"2024.10真题","ai":true},{"q":"简述网络的流量控制和拥塞控制的区别。","a":"【按背诵资料整理】流量控制是端到端的问题，防止发送方发送过快使接收方来不及接收，采用滑动窗口+累积确认机制；拥塞控制是全局性问题，防止网络因负载过重性能下降，采用慢启动/拥塞避免、门限ssthresh，超时与3个重复ACK采用不同处理。","tag":"简答","freq":2,"src":"2024.10真题","ai":true},{"q":"分别简述随机差错、突发差错二者的概念、特点以及突发长度的概念。","a":"【按背诵资料整理】随机差错：由随机噪声引起，孤立出现，具有独立性、稀疏性；突发差错：由冲击噪声引起，成串出现，差错集中发生在某段信息，差错之间具有相关性。突发长度：突发差错中第一个出错位到最后一个出错位之间的位数（含正确位）。","tag":"简答","freq":2,"src":"2024.10真题","ai":true},{"q":"简述虚拟局域网的概念、设置和划分方法。","a":"【按背诵资料整理】概念：VLAN是基于交换机的逻辑分割广播域的技术，可抑制广播风暴。划分方法：基于端口划分、基于MAC地址划分、基于上层协议划分。","tag":"简答","freq":2,"src":"2024.10真题","ai":true},{"q":"简述互联网自治系统（AS）通过边界网关协议（BGP）实现的功能及BGP对AS的作用。","a":"【按背诵资料整理】功能：BGP作为外部网关协议/策略路由协议，实现自治系统之间路由信息的交换和跨AS的路由选择。作用：使各自治系统能按自身策略选择路由，实现Internet的全局可达与互联。","tag":"简答","freq":2,"src":"2024.10真题","ai":true},{"q":"简述双相码（曼彻斯特码）的编码规则并画出二进制比特序列1001011010的双相码信号波形。【原卷此处为波形图】","a":"【按背诵资料整理】编码规则：每个比特周期的中间时刻固定有一次电平跳变（兼作时钟同步和数据信号）；从高电平跳到低电平表示1，从低电平跳到高电平表示0。波形图：【原卷此处为波形图】（按规则逐比特画：1001011010）。","tag":"简答","freq":2,"src":"2024.10真题","ai":true},{"q":"（10分）假设主机A与主机B之间由一条带宽为R=10Mbit/s、长度为D=1000m的链路互连，信号传播速率为V=250000km/s。t=0s时主机A开始向主机B发送长度为L=1000bit的分组。若忽略结点的处理延迟和排队延迟，试求：（1）传播延迟dp（ms）；（2）传输延迟dt（ms）；（3）端到端的延迟T（ms）；（4）时延带宽积G（Mb）；（5）主机A到主机B的最大吞吐量Thr（Mbit/s）。（要求写出计算过程）","a":"【按背诵资料整理】（1）dp=D/V=1000/2.5×10^8=4μs=0.004ms。（2）dt=L/R=1000/10^7=100μs=0.1ms。（3）T=dp+dt=0.104ms。（4）G=dp×R=4×10^-6×10^7=40bit。（5）Thr=R=10Mbit/s。","tag":"综合","freq":2,"src":"2024.10真题","ai":true},{"q":"（13分）某局域网连接如题 43图所示，主机A当前时刻的ARP表如题 43表所示。试回答下列问题：（1）主机A要向主机B发送一个IP数据报时，先构造一个ARP查询分组，写出该分组的发送方IP地址、MAC地址；目的主机的IP地址、MAC地址。（2）写出主机A的网络适配器在发送该ARP分组时的链路层帧的目的地址。（3）路由器在收到该ARP分组后会如何处理？（4）主机B在收到该ARP分组后会向主机A发送一个响应分组，写出该分组的发送方IP地址、MAC地址；目的主机的IP地址、MAC地址。（5）写出主机A在成功收到主机B的响应分组后，在更新其ARP表时所增加的表项内容。【原卷此处为图，略】","a":"【暂无可靠答案】，先记题干（需原卷拓扑图及ARP表确定B的IP/MAC，图中缺失）","tag":"综合","freq":2,"src":"2024.10真题","ai":true},{"q":"（12分）假设主机甲和主机乙已建立了TCP连接，甲始终以MSS=1KB大小的报文段发送数据，并一直有数据发送；乙每收到一个报文段都会发出一个接收窗口为10KB的确认段；甲在t时刻的拥塞窗口为16KB且发生了计时器超时。回答下列问题：（1）甲在响应计时器超时事件后，其拥塞窗口阈值、拥塞窗口大小分别是多少？拥塞控制进入什么阶段？（2）若从t时刻起不再发生丢包事件，则经过多少个RTT后，甲进入拥塞避免阶段？为什么？（3）若从t时刻起不再发生丢包事件，则经过10个RTT后，甲的发送窗口是多少？为什么？（4）若甲在t时刻未发生计时器超时，而是接收到了乙发来的三个重复ACK，则甲的拥塞窗口阈值和拥塞窗口会如何变化？拥塞控制进入什么阶段？","a":"【按背诵资料整理】（1）超时后：ssthresh=cwnd/2=8KB，cwnd=1MSS=1KB，进入慢启动阶段。（2）慢启动每RTT翻倍：1KB→2KB→4KB→8KB，经过3个RTT后cwnd达到ssthresh，进入拥塞避免阶段。（3）前3个RTT慢启动到8KB，第4个RTT起拥塞避免每RTT加1MSS：8+7=15KB；发送窗口=min(cwnd, rwnd)=min(15KB,10KB)=10KB。（4）3个重复ACK：ssthresh=16/2=8KB，cwnd=ssthresh=8KB，进入拥塞避免阶段（快速重传/快速恢复）。","tag":"综合","freq":2,"src":"2024.10真题","ai":true},{"q":"网络协议的三个基本要素之一的“语法”定义实体之间交换信息\nA．格式与结构或者传输信号的电平等 B．顺序及如何匹配或适应彼此的速度 C．需要采用哪种通信介质和通信设备 D．需要发送（或包含）哪些控制信息","a":"【官方答案】A．格式与结构或者传输信号的电平等","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"利用有线电视网络接入技术、基于频分多路复用技术且为共享式接入的“非对称”接入网络技术是\nA．电话拨号接入 B．HFC接入 C．移动接入网络 D．ADSL接入","a":"【官方答案】B．HFC接入","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"以下关于数据交换技术的表述错误的是\nA．报文交换事先不需要建立连接 B．电路交换方式在传输数据之前要建立电路 C．分组传输过程通常采用存储—转发交换方式 D．现代计算机网络都采用报文交换或分组交换技术","a":"【官方答案】D．现代计算机网络都采用报文交换或分组交换技术（说法错误：现代网络采用分组交换）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"主机A向主机B以分组交换方式发送文件，主机A到B的路径上有三段链路，速率分别为R1=100Mbit/s，R2=2Mbit/s，R3=10Mbit/s，若网络中没有其他流量，则该文件传送的吞吐量是\nA．112Mbit/s B．100Mbit/s C．10Mbit/s D．2Mbit/s","a":"【官方答案】D．2Mbit/s（吞吐量=取三段链路最小速率）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"OSI参考模型的数据链路层功能不包括\nA．帧同步 B．物理寻址 C．路由选择 D．差错控制","a":"【官方答案】C．路由选择（路由选择是网络层功能）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"在TCP/IP参考模型中，网络接口层封装的数据包采用的名称是\nA．帧 B．数据报 C．段 D．报文","a":"【官方答案】A．帧","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"假设某主机的域名为www.abc.xyz.cn，则可能存在的中间域名服务器是\nA．abc B．abc.xyz C．xyz.cn D．www.abc.xyz","a":"【官方答案】C．xyz.cn","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"以下选项中不是电子邮件应用的客户端软件的是\nA．AppleMail B．IMAP C．FoxMail D．Outlook","a":"【官方答案】B．IMAP（邮件读取协议，不是客户端软件）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"TCP/IP体系结构中，同一主机上唯一对应一个应用进程的是\nA．IP地址 B．套接字 C．MAC地址 D．端口号","a":"【官方答案】D．端口号","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"以下关于TCP与UDP主要区别的说法错误的是\nA．TCP提供可靠服务，UDP不保证可靠交付 B．TCP是面向分组的，UDP是面向字节流的 C．TCP对系统资源要求较多，UDP对系统资源要求较少 D．TCP首部开销至少20字节，UDP的首部开销只有8个字节","a":"【官方答案】B．TCP是面向分组的，UDP是面向字节流的（说法错误：TCP面向字节流，UDP面向数据报）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"若甲乙双方采用GBN协议发送报文且甲已发送了0~7号报文段，当计时器超时甲只收到0、1、3号报文段的确认，则甲需要重发的报文段为\nA．2~7号报文段 B．2号报文段 C．4~7号报文段 D．2和4~7号报文段","a":"【官方答案】C．4~7号报文段（GBN累积确认，ACK3确认0~3号；超时重传窗口内所有未确认分组）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"以下关于数据报网络与虚电路网络的表述错误的是\nA．数据报网络提供面向连接的交换 B．虚电路网络在双方通信前要建立虚电路 C．虚电路网络可保证分组按序传输 D．因特网是一个数据报网络","a":"【官方答案】A．数据报网络提供面向连接的交换（表述错误）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"性能最低，相应的路由器价格也最便宜的路由器交换结构是\nA．基于端口交换 B．基于总线交换 C．基于网络交换 D．基于内存交换","a":"【官方答案】D．基于内存交换","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"已知IP数据报首部为20字节，若将总长度为5800B的IP数据报通过MTU为1400B的链路传输，则该数据报被分成的片数为\nA．3个 B．4个 C．5个 D．6个","a":"【官方答案】C．5个（每片数据≤1376，5780/1376→5片）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"设某主机的IP地址为213.125.0.143，子网掩码为255.255.255.224，则该主机所在子网的子网地址和直接广播地址分别为\nA．213.125.0.128和213.125.0.224 B．213.125.0.128和213.125.0.159 C．213.125.0.239和255.255.255.255 D．213.125.0.128和213.125.0.239","a":"【官方答案】B．213.125.0.128和213.125.0.159","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"主要功能是进行主机或路由器间的网络层差错报告与网络探测的协议是\nA．ICMP B．Ping C．SNMP D．IDS","a":"【官方答案】A．ICMP","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"以下IPv6地址中正确的是\nA．A1F1:202.202.224.135:CC5B B．DCBA:4001::C89B:221.120.115.51 C．2555:6700::4572:0ABC::12:12 D．193.F1.1.13:BD20:221A:F110:1111","a":"【官方答案】B．DCBA:4001::C89B:221.120.115.51（唯一合法写法：单个::，可嵌套IPv4）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"停-等协议和滑动窗口协议实现的差错控制方式是\nA．检错重发 B．前向纠错 C．反馈校验 D．检错丢弃","a":"【官方答案】A．检错重发","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"对于二进制数据0101011采用奇校验和偶校验编码后的码字分别为\nA．10101011和00101011 B．1010111和1010110 C．01010111和01010110 D．1101011和1010110","a":"【官方答案】C．01010111和01010110（校验位追加在末尾）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"目前模拟通信中常采用的一种分路方便的多路复用技术是\nA．时分多路复用TDM B．波分多路复用WDM C．频分多路复用FDM D．码分多路复用CDM","a":"【官方答案】C．频分多路复用FDM","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"以太网和IEEE802.11无线局域网等使用的MAC地址个数可达到\nA．2^6个 B．2^8个 C．2^32个 D．2^48个","a":"【官方答案】D．2^48个（MAC地址48位）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"在以太网的帧结构中，数据字段的长度为\nA．46~1500字节 B．64~1500字节 C．46~1518字节 D．48~1518字节","a":"【官方答案】A．46~1500字节","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"设信道带宽为16kHz，信噪比为30dB，则该信道的信道容量大约为\nA．160kbit/s B．80kbit/s C．160kHz D．160kBaud","a":"【官方答案】A．160kbit/s（香农公式：16K×10=160K）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"IEEE802.11的MAC协议采用的是\nA．CSMA B．CSMA/CA C．ALOHA D．CSMA/CD","a":"【官方答案】B．CSMA/CA（无线信道不能边发边听）","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"广泛应用在安全电子邮件PGP中的分组密码是\nA．AES B．DES C．RSA D．IDEA","a":"【官方答案】D．IDEA","tag":"单选","freq":2,"src":"2025.10真题","ai":false},{"q":"计算机网络通过信息交换实现的核心功能是______。","a":"【官方答案】资源共享","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"计算机网络所划分的层次以及各层协议的集合称为______。","a":"【官方答案】计算机网络体系结构","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"Web应用中，存储并管理供用户请求浏览的Web页面的软件是______。","a":"【官方答案】Web服务器","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"假设TCP拥塞控制处于拥塞避免阶段，拥塞窗口大小为32 MSS时发生了超时，则阈值将调整为______。","a":"【官方答案】16MSS（阈值=cwnd/2）","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"在Linux操作系统中创建原始套接字的用户需要有______权限。","a":"【官方答案】root","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"网络层采用的拥塞控制措施中，一种广泛应用于虚电路网络的拥塞预防技术是______。","a":"【官方答案】准入控制","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"一台主机通过局域网与一台路由器直接相连，这台路由器称为该主机的______。","a":"【官方答案】默认路由器","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"设码元速率为4800Baud，若采用4进制数字调制方式，则数据传输速率为______。","a":"【官方答案】9600bps（4800×log2(4)）","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"设生成多项式G(x)=x^4+x+1，对位串1101011011的CRC冗余位为______。","a":"【官方答案】1110（G=10011，r=4，模2除法求余数）","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"允许用户代理只读取邮件部分内容的邮件读取协议是______。","a":"【官方答案】IMAP","tag":"填空","freq":2,"src":"2025.10真题","ai":false},{"q":"简述Web网站利用Cookie技术进行用户跟踪的最常见的用途。","a":"【官方答案】（1）利用Cookie的ID准确统计网站实际访问人数、新老访客对比、访问频率等；（2）利用Cookie限制特定用户访问；（3）存储用户操作习惯和偏好，呈现个性化界面；（4）记录用户名密码等，免重复输入；（5）电子商务网站实现“购物车”功能。","tag":"简答","freq":2,"src":"2025.10真题","ai":false},{"q":"简述全局式路由选择算法及其典型代表。","a":"【官方答案】全局式路由选择算法需根据网络完整信息（完整拓扑）计算最短路径；并非指路由计算只在某个路由器上进行，而是指每个路由器计算时都要获取完整拓扑信息；典型代表是链路状态路由选择算法（LS算法）。","tag":"简答","freq":2,"src":"2025.10真题","ai":false},{"q":"简述“拥塞”的概念、直接后果以及TCP拥塞控制机制。","a":"【官方答案】拥塞：大多数主机以太快速度向网络发送太多数据，超出网络处理能力，大量分组“拥挤”在中间设备队列中等待转发，网络性能显著下降。直接后果：分组通过网络的时延显著增加、队列满导致大量分组被丢弃。TCP拥塞控制采用窗口机制。","tag":"简答","freq":2,"src":"2025.10真题","ai":false},{"q":"简述P-坚持CSMA的基本原理。","a":"【官方答案】P-坚持CSMA：有数据发送先侦听信道；信道空闲则以概率P在最近时隙开始时刻发送，以概率Q=1-P推迟到下一时隙；下一时隙仍空闲则重复，直至发出或被占用；信道忙则等下一时隙重来；发送冲突则随机等待后重来。","tag":"简答","freq":2,"src":"2025.10真题","ai":false},{"q":"简述差错控制的概念、差错的两种类型及其特点。","a":"【官方答案】差错控制：通过差错编码技术实现对传输差错的检测，并基于某种机制进行差错纠正和处理，是实现可靠传输的重要技术手段。随机差错：随机噪声引起，具有独立性、稀疏性、非相关性，呈现为随机比特差错。突发差错：冲击噪声引起，连续成片，差错间有相关性，集中发生在某段信息。","tag":"简答","freq":2,"src":"2025.10真题","ai":false},{"q":"简述CMI码的编码规则，并画出二进制比特序列0100110011的CMI码信号波形。【原卷此处为波形图】","a":"【官方答案】CMI码编码规则：信息码的0编码为双极不归零码的01，信息码的1交替编码为11和00。波形图：【原卷此处为波形图】（0100110011）。","tag":"简答","freq":2,"src":"2025.10真题","ai":false},{"q":"（12分）假定要在网络上传送1.5MB的文件。设分组长度为1KB，往返时间RTT=100ms。传送数据之前需要有建立TCP连接的时间2RTT=200ms。试计算在以下几种情况下接收方收到该文件的最后一个比特所需的时间。（1）数据发送速率为10Mbit/s，数据分组可以连续发送。（2）数据发送速率为10Mbit/s，但每发送完一个分组后要等待一个RTT时间才能再发送下一个分组。（3）数据发送速率极快，可以不考虑发送数据所需的时间，但规定在每一个RTT往返时间内只能发送20个分组。（4）数据发送速率极快，可以不考虑发送数据所需的时间，但在第一个RTT往返时间内只能发送一个分组，在第二个RTT内可发送两个分组，在第三个RTT内可发送四个分组……（TCP拥塞控制中的慢启动）","a":"【官方答案】（1）1.5MB/10Mbit/s=1.258s，所需时间=2×RTT+1.258+0.5×RTT=1.508s。（2）1.508s+1535×RTT=155.008s。（3）1.5MB分为1536个分组，需76.5个RTT发送，所需时间=76.5×RTT+2×RTT=7.85s。（4）(2+10+0.5)×RTT=1.25s。","tag":"综合","freq":2,"src":"2025.10真题","ai":false},{"q":"（8分）设网络拓扑如题 43图所示。利用Dijkstra最短路径算法计算节点D到网络中所有节点的最短路径。写出应填写在题 43表中序号（1）~（8）处的计算结果。题 43表 结点D的路由表：目的地|下一跳|代价。【原卷此处为图，略】","a":"【官方答案】（1）A （2）2 （3）E （4）4 （5）E （6）2 （7）E （8）1。即：到A下一跳A代价2；到B下一跳E代价4；到C下一跳E代价2；到E下一跳E代价1。","tag":"综合","freq":2,"src":"2025.10真题","ai":false},{"q":"（15分）网络A和网络B通过Router1、Router2两台路由器实现互联，中间为网络C。各设备接口及IP分配如题 44表（PC1:192.168.1.100/M1；PC2:192.168.2.100/M2；Router1:192.168.1.254/M3、192.168.3.1/M4；Router2:192.168.3.2/M5、192.168.2.254/M6）。（1）写出题 44-1表、题 44-2表中各序号处的内容。（2）假设PC1向PC2发送数据，写出题 44-3表中各序号处的内容。（3）PC1与PC2通信时，在封装IP分组前如何判断是否在同一个网络中？若PC1的ARP表为空，则该主机发出的第一个以太网帧的目的MAC地址是什么？【原卷此处为图，略】","a":"【官方答案】（1）44-1表：①M1 ②M3 ③M2 ④M6 ⑤192.168.1.0 ⑦192.168.3.0 ⑧192.168.2.0 ⑨192.168.3.2 ⑩192.168.2.0 ⑪192.168.3.0 ⑫192.168.1.0 ⑬192.168.3.1。44-2表：Router1直连192.168.1.0/GE_0/1、192.168.3.0/GE_0/0，静态路由192.168.2.0下一跳192.168.3.2；Router2直连192.168.2.0/GE_0/1、192.168.3.0/GE_0/0，静态路由192.168.1.0下一跳192.168.3.1。（2）①192.168.1.100 ②192.168.2.100 ③M4 ④M5。（3）将PC2的IP与子网掩码逐位与运算得网络地址192.168.2.0，与PC1不在同一网络；第一个以太网帧目的MAC为FF-FF-FF-FF-FF-FF（广播）。","tag":"综合","freq":2,"src":"2025.10真题","ai":false}]</script>
<script>
var SLUG="04741", NAME="计算机网络原理";
var RAW=JSON.parse(document.getElementById('cards-data').textContent);
var ORDER=RAW.map(function(c,i){return i;}).sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
var KEY='zk_cards_'+SLUG;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.known&&s.wrong)return s;}catch(e){}return {known:[],wrong:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
var store=load();
var queue=[],retry=[],qi=0,roundTotal=0,roundKnown=0,roundAttempted={},phase='';
var TAGC={"名解": "#2a7a4b", "简答": "#b3541e", "论述": "#7a3b12", "选择": "#1a6fa8", "单选": "#1a6fa8", "综合": "#6a3fa0", "填空": "#1a6fa8"};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n').join('<br>');}
function freqLabel(f){var hot=f>=2?' hot':'';return '<span class="freq'+hot+'">真题考过 '+f+' 次</span>';}
function srcLabel(s){if(!s)return '';return '<span class="src">'+esc(s)+'</span>';}
function paintKCount(){document.getElementById('kcount').textContent=store.known.length;}
function tagPill(t){var c=TAGC[t]||'#888';return '<span class="tag" style="background:'+c+'">'+esc(t)+'</span>';}
function knownCount(){return store.known.length;}
function paintProg(done,total){
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ptext').textContent='已掌握 '+knownCount()+' / '+RAW.length+'（本轮 '+done+'/'+total+'）';
}
function startScreen(){
  phase='menu';paintProg(0,0);setTab('all');paintWCount();paintKCount();
  var nWrong=store.wrong.length;
  var h='<div class="center">共 '+RAW.length+' 张卡片<br>已掌握 '+knownCount()+' 张 · 待加强 '+nWrong+' 张<br><br>'+
    '<div class="btnrow"><button class="btn-show" onclick="startRound(\'full\')">开始自测</button></div>';
  if(nWrong){h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">只练错题（'+nWrong+'）</button></div>';}
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
  document.getElementById('b-retry').disabled=!nWrong;
}
function startRound(mode){
  roundAttempted={};roundKnown=0;
  if(mode==='wrong'){queue=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});}
  else{queue=ORDER.slice();}
  retry=[];qi=0;roundTotal=queue.length;phase='quiz';
  if(!queue.length){startScreen();return;}
  showCard(false);
}
function showCard(revealed){
  var i=queue[qi],c=RAW[i],st=document.getElementById('stage');
  paintProg(qi,roundTotal);
  var h='<div class="fcard">'+freqLabel(c.freq)+srcLabel(c.src)+tagPill(c.tag)+'<div class="q">'+esc(c.q)+'</div>';
  if(revealed){
    h+='<div class="a"><div class="alabel">✓ 答案要点</div>'+esc(c.a)+'</div></div>';
    h+='<div class="btnrow"><button class="btn-know" onclick="mark(true)">会 ✓</button><button class="btn-unknow" onclick="mark(false)">不会 ✗</button></div>';
  }else{
    h+='</div><div class="btnrow"><button class="btn-show" onclick="showCard(true)">显示答案</button></div>';
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function mark(know){
  var i=queue[qi];
  roundAttempted[i]=1;
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(know){
    if(ki<0)store.known.push(i);
    if(wi>=0)store.wrong.splice(wi,1);
    roundKnown++;
  }else{
    if(wi<0)store.wrong.push(i);
    if(retry.indexOf(i)<0)retry.push(i);
  }
  save();paintKCount();qi++;next();
}
function next(){
  if(qi<queue.length){showCard(false);return;}
  if(retry.length){queue=retry;retry=[];qi=0;roundTotal=queue.length;showCard(false);return;}
  summary();
}
function summary(){
  phase='done';
  var total=Object.keys(roundAttempted).length;
  var rate=total?Math.round(roundKnown/total*100):0;
  paintProg(roundTotal,roundTotal);
  var h='<div class="sum"><div style="text-align:center;color:#888;font-size:14px">本轮结算</div>'+
    '<div class="rate">'+roundKnown+' / '+total+'（'+rate+'%）</div>';
  if(store.wrong.length){
    h+='<div style="font-size:14px;color:#888;margin:10px 0 4px">错题本（'+store.wrong.length+'）· 点击展开看答案</div>';
    var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.classList.toggle(\'open\')">'+esc(c.q)+'</div><div class="wa">'+freqLabel(c.freq)+' '+srcLabel(c.src)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+'</div></div>';
    });
  }else{
    h+='<div class="center">🎉 全部掌握！</div>';
  }
  h+='</div><div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')"'+(store.wrong.length?'':' disabled')+'>再练错题</button>'+
     '<button class="btn-ghost" onclick="startRound(\'full\')">重新开始</button></div>';
  document.getElementById('stage').innerHTML=h;
  window.scrollTo(0,0);
}
function paintWCount(){document.getElementById('wcount').textContent=store.wrong.length;}
function setTab(w){document.getElementById('tab-all').classList.toggle('on',w==='all');document.getElementById('tab-wrong').classList.toggle('on',w==='wrong');document.getElementById('tab-known').classList.toggle('on',w==='known');}
function showWrongList(){
  phase='wrong';setTab('wrong');
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='不会的卡片共 '+store.wrong.length+' 张 · 点击问题可收起/展开答案';
  paintWCount();paintKCount();
  var st=document.getElementById('stage');
  var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ws.length){
    h='<div class="center">\u0001F389 没有不会的卡片，全部掌握！</div>';
  }else{
    h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">再练一遍（'+ws.length+'）</button></div>';
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.querySelector(\'.wa\').classList.toggle(\'show\')">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+freqLabel(c.freq)+' '+srcLabel(c.src)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+
         '<br><button class="wmark" onclick="markKnownFromList('+i+',this)">\u2713 会了，移出</button></div></div>';
    });
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function markKnownFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki<0)store.known.push(i);
  if(wi>=0)store.wrong.splice(wi,1);
  save();paintWCount();paintKCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.wrong.length)showWrongList();
}
function showKnownList(){
  phase='known';setTab('known');
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='已掌握的卡片共 '+store.known.length+' 张 · 答案直接展示 · 点"还是不会"可回炉';
  paintWCount();paintKCount();
  var st=document.getElementById('stage');
  var ks=store.known.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ks.length){
    h='<div class="center">还没有已掌握的卡片<br>去背诵练习里把会的内容标"会"吧</div>';
  }else{
    ks.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.querySelector(\'.wa\').classList.toggle(\'show\')">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+freqLabel(c.freq)+' '+srcLabel(c.src)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+
         '<br><button class="wmark" style="background:#c0392b" onclick="markWrongFromList('+i+',this)">↩ 还是不会</button></div></div>';
    });
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function markWrongFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki>=0)store.known.splice(ki,1);
  if(wi<0)store.wrong.push(i);
  save();paintWCount();paintKCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.known.length)showKnownList();
}
document.getElementById('tab-all').onclick=function(){startScreen();};
document.getElementById('tab-wrong').onclick=function(){showWrongList();};
document.getElementById('tab-known').onclick=function(){showKnownList();};
document.getElementById('b-retry').onclick=function(){if(store.wrong.length)startRound('wrong');};
document.getElementById('b-reset').onclick=function(){
  if(confirm('清空本门课的全部自测进度？')){localStorage.removeItem(KEY);store={known:[],wrong:[]};startScreen();}
};
startScreen();
</script>
</body></html>
