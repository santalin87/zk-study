<script id="cards-data" type="application/json">[{"q": "计算机网络最基本的功能是____，最突出的优点是____", "a": "最基本功能：数据通信；最突出优点：资源共享。定义：互联的、自治的计算机的集合。", "freq": 1, "tag": "选择"}, {"q": "计算机网络逻辑组成是____ + ____", "a": "通信子网（网络核心：结点交换机、通信线路及设备，负责高效可靠的数据通信）+ 资源子网（网络边缘：主机、终端、软件，负责数据处理）。", "freq": 1, "tag": "选择"}, {"q": "按覆盖范围 / 按交换方式 / 按拓扑结构的网络分类", "a": "按覆盖范围：LAN / MAN / WAN；按交换方式：电路交换网 / 报文交换网 / 分组交换网；按拓扑：星型 / 树型 / 总线型 / 环型 / 网状型。", "freq": 1, "tag": "选择"}, {"q": "简述协议三要素及其定义的内容（2023.10 简答 36）", "a": "语法、语义、时序。时序指执行各种操作的条件与顺序关系。", "freq": 1, "tag": "简答"}, {"q": "简述电路交换与分组交换的区别", "a": "电路交换：需建立连接、资源独占、时延小实时性强、信道利用率低；分组交换：存储转发、无需预先建连、线路利用率高、可能失序/丢失/重复、只适用于数字信号。", "freq": 1, "tag": "简答"}, {"q": "OSI 七层（自下而上）和 TCP/IP 四层分别是什么", "a": "OSI：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层；TCP/IP：网络接口层（数据链路层）、网际层、运输层、应用层。各层传输单元：物理层比特、数据链路层帧、网络层分组/数据报、传输层报文段。", "freq": 1, "tag": "选择"}, {"q": "网络体系结构是____的集合；服务通过____向紧邻上层提供", "a": "各层 + 各层协议 + 层间接口；服务访问点（SAP）。", "freq": 1, "tag": "选择"}, {"q": "无噪声信道与有噪声信道的最大数据率公式", "a": "奈奎斯特（无噪声）：Rmax = 2f（bps）；香农（有噪声）：Rmax = B * log2(1+S/N)。", "freq": 1, "tag": "选择"}, {"q": "香农公式计算（2023.10 单选 17：信噪比 30dB、八进制、8KHz；2025.10 单选 23：16KHz、30dB）", "a": "30dB 对应信噪比 S/N = 1000，log2(1+S/N) 约等于 10，所以 Rmax 约等于带宽 B * 10。", "freq": 2, "tag": "选择"}, {"q": "画出比特串 1011010010 的差分双相码（差分曼彻斯特码）波形图，并写出编码规则（2024.4-41）", "a": "差分双相码：每比特开始边界有跳变表示 0、无跳变表示 1，比特中点固定跳变。编码规则必须会默写 + 画波形。", "freq": 1, "tag": "简答"}, {"q": "画出比特串 1001011010 的双相码（曼彻斯特码）波形图，并写出编码规则（2024.10-41）", "a": "曼彻斯特码（双相码）：编码规则默写 + 给定比特串画波形。三选一必考的送分简答。", "freq": 1, "tag": "简答"}, {"q": "画出比特串 0100110011 的 CMI 码波形图，并写出编码规则（2025.10-41）", "a": "CMI 码：编码规则默写 + 给定比特串画波形。三选一必考的送分简答。", "freq": 1, "tag": "简答"}, {"q": "简答固定题型：编码规则 + 画波形图（曼彻斯特 / 差分曼彻斯特 / CMI，三选一必考）", "a": "5 份真题考了 3 次：2024.4-41 差分双相码画 1011010010；2024.10-41 曼彻斯特码画 1001011010；2025.10-41 CMI 码画 0100110011。编码规则必须会默写 + 画波形，这是最有规律的送分简答。", "freq": 3, "tag": "简答"}, {"q": "四种二进制数字调制中，频带利用率最低、误码率最高的是____（2024.10 单选 24、2024.4 单选 24）", "a": "2ASK（2ASK、2FSK、2PSK、2DPSK）。", "freq": 2, "tag": "选择"}, {"q": "频分 / 时分 / 波分 / 码分多路复用及对应的多址接入协议", "a": "FDM 频分 / TDM 时分（含同步 STDM 与统计/异步 ATDM）/ WDM 波分（光纤）/ CDM 码分；对应 MAC 协议 FDMA / TDMA / WDMA / CDMA。", "freq": 1, "tag": "选择"}, {"q": "工作在物理层的设备是____", "a": "中继器、集线器（集线器下连的仍是一个冲突域）。", "freq": 1, "tag": "选择"}, {"q": "误码率约 1e-9 ~ 1e-10、速率高、损耗小、抗电磁干扰强、保密性好的传输介质是____", "a": "光纤。", "freq": 1, "tag": "选择"}, {"q": "双绞线的传输距离限制约为____，主要缺点是____", "a": "约 100m；易受干扰。", "freq": 1, "tag": "选择"}, {"q": "数据链路层传输的数据单元称为____，实现数据链路层 + 物理层功能的典型硬件是____", "a": "帧；网卡（NIC）。数据链路层功能：组帧、链路接入、可靠传递、差错控制。", "freq": 1, "tag": "选择"}, {"q": "简述差错产生原因、差错控制概念及四种基本控制方式（2024.4 简答 38）", "a": "1. 检错重发；2. 前向纠错（适用于单工链路或实时性要求高的应用）；3. 回退校验；4. 检错丢弃。", "freq": 1, "tag": "简答"}, {"q": "简述差错控制的概念、差错两种类型及特点（2025.10 简答 40）", "a": "差错两种类型：随机差错（孤立出现）、突发差错（成串出现）。控制方式：检错重发、前向纠错、回退校验、检错丢弃。", "freq": 1, "tag": "简答"}, {"q": "随机差错与突发差错的特点，及突发长度的定义（2024.10 简答 38）", "a": "随机差错孤立出现、突发差错成串出现；突发长度指突发差错中第一个出错位到最后一个出错位之间的位数（含正确位）。", "freq": 1, "tag": "简答"}, {"q": "简述停-等协议的主要特点及基本工作过程（2024.10 简答 36）", "a": "发送窗口 = 1、接收窗口 = 1，可靠传输最简单的形式，信道利用率最低。", "freq": 1, "tag": "简答"}, {"q": "编码集汉明距离 ds = r+1 可____，ds = 2r+1 可____；汉明码满足____", "a": "可检测 r 位差错；可纠正 r 位差错；2^r >= k+r+1（汉明码是线性分组码，可纠 1 位错）。", "freq": 1, "tag": "选择"}, {"q": "奇偶校验码、汉明码、CRC 循环冗余码的特点", "a": "奇偶校验码：1 位冗余，开销最小，检错率不高，用于低速串行链路；CRC：多项式编码，生成多项式 G(X) 最高位与最低位系数必须为 1，广泛用于以太网、802.11、PPP。", "freq": 1, "tag": "选择"}, {"q": "已知 G(x) = x4+x2+x+1，对 100111011101 求 CRC 校验位并写出编码结果，要求写计算过程（2024.4-40）", "a": "编码三步：信息位后补 r 个 0 -> 模 2 除法求余数 R -> 相减得编码帧。生成多项式 G(X) 最高位与最低位系数必须为 1。模 2 除法必须练熟。", "freq": 1, "tag": "简答"}, {"q": "已知 G(x) = x4+x+1，对 100111011101 做 CRC 编码（2024.10 单选 19）；G(x) = x4+x+1 对 1101011011 求 CRC 冗余位（2025.10 填空 34）", "a": "CRC 是简答/选择常客：后补 r 个 0 -> 模 2 除法求余数 R -> 相减得编码帧。", "freq": 2, "tag": "选择"}, {"q": "MAC 协议三类及根本任务", "a": "信道划分（多路复用实现）、随机接入（ALOHA、CSMA、CSMA/CD）、受控接入（集中式轮询 / 分散式令牌）。根本任务是解决信道共享问题。", "freq": 1, "tag": "选择"}, {"q": "纯 ALOHA 与时隙 ALOHA 的吞吐量公式及最高值", "a": "纯 ALOHA：S = G*e^(-2G)，G = 0.5 时最高 18.4%；时隙 ALOHA：S = G*e^(-G)，G = 1 时最高 36.8%。", "freq": 1, "tag": "选择"}, {"q": "非坚持 / 1-坚持 / P-坚持 CSMA 的特点及共同概括", "a": "非坚持：忙则随机等待，冲突少但信道空闲多；1-坚持：忙则持续监听，空闲立即发，冲突多；P-坚持：时隙信道，以概率 P 发送。共同概括先听后说。", "freq": 1, "tag": "选择"}, {"q": "简述 P-坚持 CSMA 的基本原理（2025.10 简答 39）", "a": "时隙信道，监听到空闲以概率 P 发送、以概率 1-P 推迟到下一时隙。", "freq": 1, "tag": "简答"}, {"q": "简述 CSMA/CD 的工作原理（2023.10 简答 39）", "a": "先听后发、边发边听；冲突检测靠信号强度，只适用于有线信道；冲突后用截断二进制指数退避算法重发；最小帧长满足 Lmin/R >= 2*Dmax/v。", "freq": 1, "tag": "简答"}, {"q": "CSMA/CD 最小帧长公式（2024.4 单选 22 考最远距离计算、2024.10 填空 33 考最小帧长计算）", "a": "Lmin/R >= 2*Dmax/v：往返时延内必须能检测到冲突。", "freq": 2, "tag": "选择"}, {"q": "以太网帧结构各字段长度；类型字段 0x0800 表示什么", "a": "目的地址 6B + 源地址 6B + 类型 2B + 数据 46~1500B + CRC 4B；0x0800 表示封装 IP 数据报。", "freq": 1, "tag": "选择"}, {"q": "MAC 地址的长度、特点及广播地址", "a": "6 字节十六进制；全球唯一、扁平结构（不随位置改变）；广播地址 FF-FF-FF-FF-FF-FF。", "freq": 1, "tag": "选择"}, {"q": "ARP 请求用____帧发送、响应____返回；ARP 表的特点", "a": "请求用广播帧发送、响应单播返回；ARP 表自动建立、即插即用。", "freq": 1, "tag": "选择"}, {"q": "交换机的工作原理：自学习 + 转发/过滤 + 泛洪", "a": "自学习（按源 MAC 建表）+ 转发/过滤（按目的 MAC 查表）；查不到则泛洪（flood）；广播/组播帧向所有端口转发。", "freq": 1, "tag": "选择"}, {"q": "交换机分割____，不能分割____；____可分割广播域", "a": "交换机分割冲突域、不能分割广播域；路由器可分割广播域。", "freq": 1, "tag": "选择"}, {"q": "简述交换机与路由器的区别", "a": "交换机工作在数据链路层、按 MAC 地址转发、只分割冲突域；路由器工作在网络层、按 IP 地址（网络 ID）选路、可分割广播域、隔离不需要的通信量。", "freq": 1, "tag": "简答"}, {"q": "VLAN 的作用及划分方法", "a": "基于交换机的逻辑分割广播域，抑制广播风暴；划分方法：基于端口 / 基于 MAC 地址 / 基于上层协议。", "freq": 1, "tag": "简答"}, {"q": "HDLC 为保证透明传输用了____方法，PPP 用了____（2023.10 填空 33）", "a": "HDLC 用位填充（5 个连续 1 插 0）；PPP 用字节填充（转义字节 0x7D）。", "freq": 1, "tag": "选择"}, {"q": "PPP 的三个功能是____；PPP 的差错处理特点", "a": "成帧、LCP 链路控制协议、NCP 网络控制协议；PPP 只检错不纠错。", "freq": 1, "tag": "选择"}, {"q": "点对点链路不存在媒体共享问题，____（是否）需要 MAC 协议", "a": "不需要。", "freq": 1, "tag": "选择"}, {"q": "虚电路网络与数据报网络的区别", "a": "虚电路：网络层提供面向连接服务（路径 + VC 号 + 沿途转发表项）；数据报：无连接服务，每个分组独立选路，可能失序/丢失/重复。", "freq": 1, "tag": "选择"}, {"q": "路由器工作在 OSI 第____层；按____查转发表；对____减 1 并重算校验和", "a": "第三层；目的 IP；TTL。", "freq": 1, "tag": "选择"}, {"q": "简述路由器利用 IP 数据报的目的 IP 地址检索匹配路由表的过程（2024.4 简答 37）", "a": "最长前缀匹配；TTL 减 1 并重算校验和；加上下一跳 MAC 后从输出端口转发（排队等待）。", "freq": 1, "tag": "简答"}, {"q": "与 IP 分片有关的 IPv4 首部字段是____；防止分组无限循环的字段是____", "a": "标识 / 标志 / 片偏移；TTL。", "freq": 1, "tag": "选择"}, {"q": "超网 195.125.0.0/22 中 IP 地址总数和包括的 C 类地址网络个数（2024.4 单选 15）", "a": "1024 和 4。超网包含的子网数 = 2^(被借位差)，会算。", "freq": 1, "tag": "选择"}, {"q": "基于链路状态路由算法的内部网关协议是____，基于距离向量的内部网关协议是____，Internet 标准的外部网关协议是____", "a": "OSPF；RIP（基于 Bellman-Ford，定期交换路由表）；BGP（外部网关 / 策略路由协议）。", "freq": 1, "tag": "选择"}, {"q": "IPv6 基本首部长度为固定的____字节（2024.4 / 2024.10 单选 17）", "a": "40 字节。IPv6 地址 128 位。", "freq": 2, "tag": "选择"}, {"q": "DHCP 动态分配 IP 的四个阶段", "a": "发现 -> 提供 -> 选择 -> 确认。", "freq": 1, "tag": "选择"}, {"q": "NAT 的作用", "a": "私网地址与公网地址转换，缓解 IPv4 地址不足。", "freq": 1, "tag": "选择"}, {"q": "ping 和 tracert 分别利用 ICMP 的什么机制测连通性/路径", "a": "ping 用回送请求/应答测连通性；tracert 利用 TTL 超时测路径。", "freq": 1, "tag": "选择"}, {"q": "主机跨网段发送 IP 分组时，先把分组发给____（2025.10 填空 32）", "a": "默认路由器（默认网关）。", "freq": 1, "tag": "选择"}, {"q": "简述 TCP 与 UDP 的区别", "a": "TCP 面向连接、可靠（确认/重传/流量与拥塞控制），适合大数据量；UDP 无连接、不可靠、速度快，适合实时应用（DNS、视频）。", "freq": 1, "tag": "简答"}, {"q": "UDP 套接字是____，TCP 套接字是____", "a": "二元组（目的 IP + 目的端口）；四元组（源 IP、源端口、目的 IP、目的端口）。", "freq": 1, "tag": "选择"}, {"q": "TCP 报文首部的主要字段", "a": "源/目的端口号、序号、确认号、接收窗口、首部长度、6 个标志位、校验和。功能：连接管理、流量控制、可靠传输、拥塞控制。", "freq": 1, "tag": "选择"}, {"q": "流水线差错恢复的两种基本方法是____", "a": "回退 N 步（GBN）与选择重传（SR）。", "freq": 1, "tag": "选择"}, {"q": "停-等协议和滑动窗口协议实现的是____（2025.10 单选 18）", "a": "检错重发。", "freq": 1, "tag": "选择"}, {"q": "简述流量控制和拥塞控制的区别（2024.10 简答 37）", "a": "流量控制：滑动窗口 + 累积确认；拥塞控制：慢开始 / 拥塞避免、门限 ssthresh，超时与 3 个重复 ACK 的处理不同。", "freq": 1, "tag": "简答"}, {"q": "简述拥塞概念、直接后果及 TCP 拥塞控制机制（2025.10 简答 38）", "a": "TCP 拥塞控制机制：慢开始 / 拥塞避免；超时 -> ssthresh = cwnd/2、cwnd = 1MSS 进入慢启动；3 个重复 ACK -> ssthresh = cwnd/2、cwnd = ssthresh 进入拥塞避免。", "freq": 1, "tag": "简答"}, {"q": "TCP 建立连接采用____，释放连接采用____", "a": "三次握手建连、四次挥手释放（5 份真题均未要求画三次握手时序图，不押画图）。", "freq": 1, "tag": "选择"}, {"q": "发送两段数据 400B + 600B、首序号 800，确认序号是____（2023.4 单选 24）", "a": "1800（确认号 = 首序号 + 已收字节数 = 800 + 400 + 600）。", "freq": 1, "tag": "选择"}, {"q": "发送 300B + 400B + 200B、第 3 段序号 800、第 2 段丢失，确认序号是____（2023.10 单选 24）", "a": "400（丢失则确认号停在丢失段的首序号）。", "freq": 1, "tag": "选择"}, {"q": "UDP 首部固定____字节；TCP 首部最大____字节（首部长度字段 * 4）", "a": "8；60。", "freq": 1, "tag": "选择"}, {"q": "TCP 首部长度字段值为 10，则首部长度和选项字段长度为____（2024.10 单选 11）", "a": "首部长度 = 字段值 * 4 = 40 字节；选项字段 = 40 - 20 = 20 字节。", "freq": 1, "tag": "选择"}, {"q": "FTP / Telnet / SMTP / DNS / HTTP / POP3 的熟知端口号", "a": "21 / 23 / 25 / 53 / 80 / 110。", "freq": 1, "tag": "选择"}, {"q": "DNS 运行在____协议____端口上；递归查询与迭代查询的区别；服务器分级", "a": "UDP 53；递归查询是代为查到底，迭代查询是告诉你下一步找谁；服务器分级：根 / 顶级 / 权威 / 本地。", "freq": 1, "tag": "选择"}, {"q": "DNS 服务器分级中最高层是____（2025.10 填空 30）", "a": "root（根域名服务器）。", "freq": 1, "tag": "选择"}, {"q": "HTTP 状态码 2xx / 3xx / 4xx / 5xx 的含义", "a": "2xx 成功 / 3xx 重定向 / 4xx 客户端错 / 5xx 服务器错。", "freq": 1, "tag": "选择"}, {"q": "客户端请求对象在服务器上不存在时，状态码为____（2024.4 填空 28）", "a": "404。", "freq": 1, "tag": "选择"}, {"q": "HTTP 非持久连接与持久连接的区别", "a": "非持久连接每请求建一次连接；持久连接（流水 / 非流水）复用连接。", "freq": 1, "tag": "选择"}, {"q": "HTTP 的请求方法有____", "a": "GET / HEAD / POST。", "freq": 1, "tag": "选择"}, {"q": "简述 Cookie 概念及安全问题（2023.4 简答 38）；Web 网站利用 Cookie 做用户跟踪的最常见用途（2025.10 简答 36）", "a": "Cookie 弥补 HTTP 的无状态性；用于 Web 用户跟踪。", "freq": 2, "tag": "简答"}, {"q": "允许用户代理只读取邮件部分内容的邮件读取协议是____（2023.4 单选 17、2025.10 填空 35）", "a": "IMAP。发送用 SMTP（TCP 25），读取用 POP3（110）/ IMAP / HTTP；MIME 让 SMTP 传非 7 位 ASCII 内容。", "freq": 2, "tag": "选择"}, {"q": "FTP 使用____号端口，采用____连接", "a": "21；控制连接 + 数据连接双连接，双向传文件。", "freq": 1, "tag": "选择"}, {"q": "C/S 与 P2P 的区别", "a": "C/S：客户间不直接通信、服务器有固定 IP；P2P：对等实体直接通信、无专用服务器。", "freq": 1, "tag": "选择"}, {"q": "防火墙是什么", "a": "软硬件结合体，隔离内网与 Internet，按规则允许/阻止分组通过。", "freq": 1, "tag": "选择"}, {"q": "IDS 的作用", "a": "入侵检测系统，监视网络/系统运行状况，发现攻击企图与行为。", "freq": 1, "tag": "选择"}, {"q": "IPSec 的作用", "a": "IP 层开放安全架构，用加密保障 IP 通信的机密性与安全。", "freq": 1, "tag": "选择"}, {"q": "网络管理的五大功能", "a": "性能管理、故障管理、配置管理、计费（账户）管理、安全管理。", "freq": 1, "tag": "选择"}, {"q": "凯撒密码的原理；密钥 k=3 对 This is an easy problem 加密求密文（2023.4 简答 41）", "a": "单表代换，密钥 k 移位。结论：加密考概念 + 凯撒密码手工计算，不考大题证明。", "freq": 1, "tag": "简答"}, {"q": "PGP 用的分组密码是____（2025.10 单选 25）", "a": "IDEA。", "freq": 1, "tag": "选择"}, {"q": "数字签名的单向散列算法是____（2024.4 单选 25）", "a": "SHA-1（单向散列典型算法还有 MD5）。", "freq": 1, "tag": "选择"}, {"q": "由报文 m 和认证密钥 s 得到 MAC 是____（2023.10 单选 25）", "a": "H(m,s)。", "freq": 1, "tag": "选择"}, {"q": "对接入网络的用户/设备进行身份认证与合规性检查，不合规者隔离或拒绝接入称为____（2025.10 填空 31）", "a": "网络准入控制。", "freq": 1, "tag": "选择"}, {"q": "SSID 是什么", "a": "服务集标识，用于划分需独立身份验证的子网络。", "freq": 1, "tag": "选择"}, {"q": "IEEE 802.11 的 MAC 协议采用____；为什么不用 CSMA/CD（2025.10 单选 24）", "a": "CSMA/CA，用 RTS/CTS + ACK 回避冲突；无线信道不能边发边听。", "freq": 1, "tag": "选择"}, {"q": "信号传播距离最远、穿透能力较好、速率为 11Mbit/s 的无线局域网标准是____（2024.10 单选 23）", "a": "IEEE 802.11b。", "freq": 1, "tag": "选择"}, {"q": "综合题型：时延 / 吞吐量 / 信道利用率计算（4/5 份真题考，最高频）", "a": "发送时延 = 分组长度 / 带宽；传播时延 = 距离 / 传播速率；总时延 = 发送 + 传播 + 排队 + 处理；吞吐量 = min(各段速率)；停等协议利用率 = 发送时延 / (发送时延 + RTT)；时延带宽积 = 传播时延 * 带宽。", "freq": 4, "tag": "综合"}, {"q": "综合题型：GBN / SR 滑动窗口协议分析（2/5 份）", "a": "回退 N 步 GBN：累积确认，收到乱序 ACK 后的动作；选择重传 SR：独立确认；重传判断。真题：2023.4-43（13 分 GBN）、2024.4-44（11 分 SR）。", "freq": 2, "tag": "综合"}, {"q": "综合题型：子网划分计算（2/5 份）", "a": "子网数 = 2^x（x 为子网位）；每子网主机数 = 2^y - 2；block size = 256 - 掩码十进制数；广播地址 = 下一子网号 - 1。", "freq": 2, "tag": "综合"}, {"q": "综合题型：交换机自学习与转发表（3/5 份，最爱考）", "a": "自学习（按源 MAC 建表）+ 转发/过滤（按目的 MAC 查表）；查不到则泛洪；广播/组播帧向所有端口转发。真题：2023.10-44、2024.4-42（13 分）、2025.10-44（15 分）。", "freq": 3, "tag": "综合"}, {"q": "综合题型：ARP 跨网段过程（1/5 份）", "a": "ARP 请求广播、响应单播；跨网段时主机先把 IP 分组发给默认网关；ARP 表项更新。真题：2024.10-43（13 分，给拓扑图 + ARP 表）。", "freq": 1, "tag": "综合"}, {"q": "综合题型：TCP 拥塞控制计算（2/5 份）", "a": "超时 -> ssthresh = cwnd/2、cwnd = 1MSS 进入慢启动；3 个重复 ACK -> ssthresh = cwnd/2、cwnd = ssthresh 进入拥塞避免；慢启动每 RTT 翻倍。真题：2024.10-44（12 分）、2025.10-42(4)、2025.10 填空 29。", "freq": 2, "tag": "综合"}, {"q": "综合题型：RIP 路由表更新（1/5 份）", "a": "收邻居通告 -> 跳数 +1 -> 下一跳改为通告者 -> 取更优。真题：2023.10-43（12 分，给 R6 路由表 + R4 的 RIP 通告，写更新后路由表）。", "freq": 1, "tag": "综合"}, {"q": "综合题型：Dijkstra 最短路径（1/5 份）", "a": "给拓扑图填路由表。真题：2025.10-43（8 分，给拓扑图填结点 D 的路由表）。", "freq": 1, "tag": "综合"}]</script>
<script>
var SLUG="04741", NAME="计算机网络原理";
var RAW=JSON.parse(document.getElementById('cards-data').textContent);
var ORDER=RAW.map(function(c,i){return i;}).sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
var KEY='zk_cards_'+SLUG;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.known&&s.wrong)return s;}catch(e){}return {known:[],wrong:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
var store=load();
var queue=[],retry=[],qi=0,roundTotal=0,roundKnown=0,roundAttempted={},phase='';
var TAGC={"名解": "#2a7a4b", "简答": "#b3541e", "论述": "#7a3b12", "选择": "#1a6fa8", "综合": "#6a3fa0", "填空": "#1a6fa8"};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n').join('<br>');}
function freqLabel(f){var hot=f>=2?' hot':'';return '<span class="freq'+hot+'">真题考过 '+f+' 次</span>';}
function tagPill(t){var c=TAGC[t]||'#888';return '<span class="tag" style="background:'+c+'">'+esc(t)+'</span>';}
function knownCount(){return store.known.length;}
function paintProg(done,total){
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ptext').textContent='已掌握 '+knownCount()+' / '+RAW.length+'（本轮 '+done+'/'+total+'）';
}
function startScreen(){
  phase='menu';paintProg(0,0);
  var nWrong=store.wrong.length;
  var h='<div class="center">共 '+RAW.length+' 张卡片<br>已掌握 '+knownCount()+' 张 · 待加强 '+nWrong+' 张<br><br>'+
    '<div class="btnrow"><button class="btn-show" onclick="startRound(\'full\')">开始自测</button></div>';
  if(nWrong){h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">只练错题（'+nWrong+'）</button></div>';}
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
  document.getElementById('b-retry').disabled=!nWrong;
}
function startRound(mode){
  roundAttempted={};roundKnown=0;
  if(mode==='wrong'){queue=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});}
  else{queue=ORDER.slice();}
  retry=[];qi=0;roundTotal=queue.length;phase='quiz';
  if(!queue.length){startScreen();return;}
  showCard(false);
}
function showCard(revealed){
  var i=queue[qi],c=RAW[i],st=document.getElementById('stage');
  paintProg(qi,roundTotal);
  var h='<div class="fcard">'+freqLabel(c.freq)+tagPill(c.tag)+'<div class="q">'+esc(c.q)+'</div>';
  if(revealed){
    h+='<div class="a"><div class="alabel">✓ 答案要点</div>'+esc(c.a)+'</div></div>';
    h+='<div class="btnrow"><button class="btn-know" onclick="mark(true)">会 ✓</button><button class="btn-unknow" onclick="mark(false)">不会 ✗</button></div>';
  }else{
    h+='</div><div class="btnrow"><button class="btn-show" onclick="showCard(true)">显示答案</button></div>';
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function mark(know){
  var i=queue[qi];
  roundAttempted[i]=1;
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(know){
    if(ki<0)store.known.push(i);
    if(wi>=0)store.wrong.splice(wi,1);
    roundKnown++;
  }else{
    if(wi<0)store.wrong.push(i);
    if(retry.indexOf(i)<0)retry.push(i);
  }
  save();qi++;next();
}
function next(){
  if(qi<queue.length){showCard(false);return;}
  if(retry.length){queue=retry;retry=[];qi=0;roundTotal=queue.length;showCard(false);return;}
  summary();
}
function summary(){
  phase='done';
  var total=Object.keys(roundAttempted).length;
  var rate=total?Math.round(roundKnown/total*100):0;
  paintProg(roundTotal,roundTotal);
  var h='<div class="sum"><div style="text-align:center;color:#888;font-size:14px">本轮结算</div>'+
    '<div class="rate">'+roundKnown+' / '+total+'（'+rate+'%）</div>';
  if(store.wrong.length){
    h+='<div style="font-size:14px;color:#888;margin:10px 0 4px">错题本（'+store.wrong.length+'）· 点击展开看答案</div>';
    var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.classList.toggle(\'open\')">'+esc(c.q)+'</div><div class="wa">'+freqLabel(c.freq)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+'</div></div>';
    });
  }else{
    h+='<div class="center">🎉 全部掌握！</div>';
  }
  h+='</div><div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')"'+(store.wrong.length?'':' disabled')+'>再练错题</button>'+
     '<button class="btn-ghost" onclick="startRound(\'full\')">重新开始</button></div>';
  document.getElementById('stage').innerHTML=h;
  window.scrollTo(0,0);
}
document.getElementById('b-retry').onclick=function(){if(store.wrong.length)startRound('wrong');};
document.getElementById('b-reset').onclick=function(){
  if(confirm('清空本门课的全部自测进度？')){localStorage.removeItem(KEY);store={known:[],wrong:[]};startScreen();}
};
startScreen();
</script>
</body></html>
