<script id="cards-data" type="application/json">[{"q": "哪位人物在1744年首次提出了“公共舆论”的现代意义？(2026.4新考)", "a": "法国的卢梭，1744年。", "freq": 1, "tag": "选择"}, {"q": "“舆论”一词最早可追溯到哪部古籍？(2026.4新考)", "a": "范晔的《后汉书》。", "freq": 1, "tag": "选择"}, {"q": "梁启超的舆论主张是什么？(2026.4新考)", "a": "“通民隐、达民情”。", "freq": 1, "tag": "选择"}, {"q": "两高司法解释：诽谤信息被点击、浏览多少次以上或被转发多少次以上，认定情节严重？(2026.4新考)", "a": "被点击、浏览5000次以上，或被转发500次以上。", "freq": 1, "tag": "选择"}, {"q": "“两微一端”指的是什么？(2026.4新考)", "a": "微信、微博、客户端。", "freq": 1, "tag": "选择"}, {"q": "危机的产生原因是？(2026.4新考)", "a": "社会结构和社会规则范式的整体扭曲。", "freq": 1, "tag": "选择"}, {"q": "社群回音壁效应会带来什么结果？(2026.4新考)", "a": "群内同质性和群际异质性双向增强。", "freq": 1, "tag": "选择"}, {"q": "舆论监测的基本方法是？(2026.4新考)", "a": "定向采集 + 非定向采集。", "freq": 1, "tag": "选择"}, {"q": "舆论长尾期的原因是？(2026.4新考)", "a": "事件已成为“社会集体记忆”。", "freq": 1, "tag": "选择"}, {"q": "入户调查一般采用什么抽样方法？(2026.4新考)", "a": "概率抽样（PPS抽样）。", "freq": 1, "tag": "选择"}, {"q": "态度形成三阶段是？（多选）(2026.4新考)", "a": "依从、同化、内化。", "freq": 1, "tag": "选择"}, {"q": "中国共产党不同历史时期的舆论观包括哪些？（多选）(2026.4新考)", "a": "作为斗争的舆论、作为引导的舆论、作为宣传的舆论、作为导向的舆论（全选）。", "freq": 1, "tag": "选择"}, {"q": "艺术形态的舆论包括哪些？（多选）(2026.4新考)", "a": "音乐《小苹果》、电影《哪吒2之魔童闹海》、舞蹈《江南style》、网游《黑神话·悟空》（全选）。", "freq": 1, "tag": "选择"}, {"q": "拉扎斯菲尔德意见领袖三要素是？（多选）(2026.4新考)", "a": "人格属性、能力、社会声望。", "freq": 1, "tag": "选择"}, {"q": "舆论议题包括哪些？（多选）(2026.4新考)", "a": "领导干部违法乱纪、热点明星火爆事件、涉及国家利益、敏感国家突发国际事件（全选）。", "freq": 1, "tag": "选择"}, {"q": "舆论发展生命周期包括哪些阶段？（多选）(2026.4新考)", "a": "生成、发展、高潮、消亡（全选）。", "freq": 1, "tag": "选择"}, {"q": "决定舆论质量的要素包括哪些？（多选）(2026.4新考)", "a": "意见发表的平台、群体利益相关性、意见发表的自由程度、意见领袖的介入时机（全选）。", "freq": 1, "tag": "选择"}, {"q": "内容分析法的方法特征是？（多选）(2026.4新考)", "a": "客观、系统、定量。", "freq": 1, "tag": "选择"}, {"q": "网络舆论定量判断指标包括哪些？（多选）(2026.4新考)", "a": "传播扩散度、民众关注度、内容敏感度、态度倾向性（全选）。", "freq": 1, "tag": "选择"}, {"q": "说服性传播有效达到预期目标的策略包括哪些？（多选）(2026.4新考)", "a": "微观修辞创新、说理法、诉求法、提示法（全选）。", "freq": 1, "tag": "选择"}, {"q": "判断（A=正确/B=错误）：民意是个人随时表达自己的意见，但不可以随意改变。(2026.4新考)", "a": "B错误。民意可因认知变化而改变。", "freq": 1, "tag": "选择"}, {"q": "判断（A=正确/B=错误）：作为治国理政的舆论是新时代中国共产党舆论观的成熟完善。(2026.4新考)", "a": "A正确。", "freq": 1, "tag": "选择"}, {"q": "判断（A=正确/B=错误）：信念是人们在社会化过程中习得的绝对固定的价值观、道德信条等。(2026.4新考)", "a": "A正确。", "freq": 1, "tag": "选择"}, {"q": "判断（A=正确/B=错误）：“多数人”还是“少数人”都不能构成判断舆论主体的必要元素。(2026.4新考)", "a": "A正确。", "freq": 1, "tag": "选择"}, {"q": "判断（A=正确/B=错误）：网络社会空间基本逻辑包括虚拟化、数字化、流动性和弹性、全球化、个人化。(2026.4新考)", "a": "A正确。", "freq": 1, "tag": "选择"}, {"q": "判断（A=正确/B=错误）：张量是多源异构大数据一体化的表示方法。(2026.4新考)", "a": "A正确。", "freq": 1, "tag": "选择"}, {"q": "判断（A=正确/B=错误）：网络首发型事件和传统媒体首发型事件的阶段表现一样。(2026.4新考)", "a": "B错误。二者阶段表现有所不同。", "freq": 1, "tag": "选择"}, {"q": "媒体审判是什么？(2026.4新考)", "a": "新闻媒体在司法程序尚未终结前，通过倾向性报道或评论对案件预先定性、定罪，影响公众判断乃至司法公正的现象。", "freq": 1, "tag": "名解"}, {"q": "民粹主义是什么？(2026.4新考)", "a": "强调平民群众利益和意志、反对精英集团和既有政治体制的政治思潮或社会运动，以“人民”为话语核心，反建制、直接民主、情绪化表达。", "freq": 1, "tag": "名解"}, {"q": "人肉搜索引擎是什么？(2026.4新考)", "a": "利用互联网平台、通过网民人工参与和信息协作，对特定人物、事件进行信息挖掘和身份追踪的网络信息搜索方式。", "freq": 1, "tag": "名解"}, {"q": "信度是什么？(2026.4新考)", "a": "测量工具的可靠性、稳定性和一致性程度；舆论调查中信度高意味着多次测量结果一致性高。", "freq": 1, "tag": "名解"}, {"q": "简述中国共产党舆论观演进中的启示。(2026.4新考)", "a": "与时俱进（斗争→引导→治国理政）、人民中心、科学管理（舆情监测预警引导机制）、法治保障、媒介融合、全球化视野。", "freq": 1, "tag": "简答"}, {"q": "简述舆论分析的基本原则。(2026.4新考)", "a": "客观性、系统性、动态性、分层分析、定性与定量结合、价值中立。", "freq": 1, "tag": "简答"}, {"q": "试述舆论产业链的市场结构。(2026.4新考)", "a": "上游：数据采集与监测（舆情软件/爬虫/API/数据源）→中游：数据分析与加工（舆情分析机构/文本挖掘/可视化/人工研判）→下游：应用与服务交付（政府/企业/媒体/公关/金融）→支撑层（云计算/AI技术/学术研究/行业协会）；市场特征：技术驱动、平台集中度高、政策敏感性强、需求多样化、数据源依赖性强。", "freq": 1, "tag": "论述"}, {"q": "论述舆论形成的六个阶段及各阶段特点。", "a": "潜舆论酝酿期（意见零散、私下议论）→话题公开化（媒体/意见领袖介入，关注度快速上升）→意见分化交锋（观点对立、情绪化）→舆论高涨期（主导意见占上风，“舆论波”）→舆论成熟期（主导意见形成，呈正态分布）→衰减反馈期（热度下降，留下“舆论遗产”）。舆论分布三种形态：正态分布、双众数分布、单众数分布。", "freq": 3, "tag": "论述"}, {"q": "论述舆论调控的理论前提。", "a": "即调控的必要性和可能性。必要性：舆论两面性（健康舆论是纽带，失控致失序）；群体心理非理性（勒庞《乌合之众》：易冲动轻信情绪化）；舆论与事实可能脱节（“两种舆论”背离）；维护公共利益和稳定。可能性：舆论规律可把握；传播手段可调控（议程设置/把关人/意见领袖）；公众可沟通；制度渠道畅通。", "freq": 3, "tag": "论述"}, {"q": "论述先秦社会的舆论秩序。", "a": "五种舆论形式：乡校议政（子产不毁乡校，闻过而改）；采诗观风（观风俗知得失，最早的民意调查雏形）；国人参政（“防民之口，甚于防川”警示）；朝议（朝廷议论国事）；百工谏、庶人传语（自上而下的民意吸纳）。特点：制度化渠道吸纳民意；压制舆论必致更大危机。", "freq": 2, "tag": "论述"}, {"q": "论述网络调查的特征、局限性与对策。", "a": "特征：匿名保密、跨时空、即时高效、互动性强、客观性。局限性：样本代表性不足、身份难核验、问卷设计要求高、参与局限性。途径：电子邮件/网站/论坛社区/即时通信调查。对策：配额抽样+事后加权；身份验证技术；优化问卷设计；与传统调查结合互补。", "freq": 2, "tag": "论述"}, {"q": "试述调查报告的结构和主要内容。", "a": "三部分：导言部分（背景目的、对象抽样、实施过程，判断可信度）；主体部分（数据呈现分析、图表、主要发现，报告核心）；讨论部分（解释评价、结论建议、局限展望）。另含标题、摘要、关键词、附录；要求结构完整、数据真实、分析深入、语言简洁。", "freq": 2, "tag": "论述"}, {"q": "试述问卷设计的主要步骤。", "a": "三步：探索性工作（熟悉内容、划定范围、列提纲）→设计问卷初稿（卡片法/框图法；表述简洁，题目不超70个、作答控制在30分钟内）→试用和修改（30-100份小样本试调查，求信度效度，反复修订定稿）。注意：发放前做适用性检测；卷首语“表明身份、交代目的”。", "freq": 2, "tag": "论述"}, {"q": "简述舆论社会目标设定的维度。", "a": "时间维度（长期/中期/短期）；层次维度（认知—让公众知道、态度—让公众认同、行为—让公众行动）；范围维度（全局性/局部性）；主体维度（决策层/公众/媒体）；内容维度（议题/形象/关系）。", "freq": 1, "tag": "简答"}, {"q": "简述舆论的客体及其规定性特征。", "a": "客体：舆论所指向的对象，即社会公共事务、社会问题和事件（“舆论的靶子”）。规定性特征：公共性、公开性、现实针对性、多数性。客体决定舆论性质，客体越重大舆论强度越大。", "freq": 1, "tag": "简答"}, {"q": "简述学术真理性标准所应具备的四个特点。", "a": "客观性（符合客观实际，不以主观意志为转移）；可检验性（可重复验证，经得起实践检验）；逻辑一致性（内部自洽）；实践标准（最终由社会实践检验）。", "freq": 1, "tag": "简答"}, {"q": "简述舆论测量的原则和特点。", "a": "原则：客观性、科学性、可操作性、伦理原则。特点：量化（意见转数字）、抽样（部分推总体）、标准化（统一问卷程序）、间接性（通过指标推测舆论）。", "freq": 1, "tag": "简答"}, {"q": "简要回答转型期中国的社会大众心理。", "a": "焦虑心态（未来不确定性）；公平焦虑（分配不公、阶层固化）；安全感缺失；戾气与宣泄（网络情绪化表达）；期待心态（对美好生活、公平正义的期待）。", "freq": 1, "tag": "简答"}, {"q": "简要回答内容分析的实施过程包含几个部分。", "a": "确定研究问题与假设→界定总体与抽样→建构分析类目体系→制定编码规则并培训编码员→信度检验→数据统计与结果分析。", "freq": 1, "tag": "简答"}, {"q": "灾害报道是什么？", "a": "对自然灾害、事故灾难等突发性灾害事件的新闻报道。要求及时准确全面，注重人文关怀，避免“次生伤害”，发挥预警和安抚功能。", "freq": 1, "tag": "名解"}, {"q": "网络舆论是什么？", "a": "网民通过互联网平台，围绕社会公共事务表达的意见、情绪和态度的集合。即时性、互动性、情绪化、裂变式传播，是当代舆论的主场形态之一。", "freq": 1, "tag": "名解"}, {"q": "概念是什么？", "a": "舆论测量与研究中的基本范畴，是对客观事物本质属性的抽象概括。变量就是由概念构成的；概念须经操作化定义转化为可测变量指标。", "freq": 1, "tag": "名解"}, {"q": "变量是什么？", "a": "可取不同值的概念，即属性在不同个体或时间上存在差异的概念（如性别、年龄、态度强度）。是舆论定量测量的基本分析单位；测量层次分定类、定序、定距、定比。", "freq": 1, "tag": "名解"}, {"q": "朝议是什么？", "a": "在朝廷上议论国事，是先秦时期重要的参政舆论形式。君臣在朝堂就国家大事发表意见展开辩论，是决策程序也是舆论表达的制度化渠道。", "freq": 1, "tag": "名解"}, {"q": "私人领域是什么？", "a": "与公共领域相对的概念，指个人私密生活、家庭事务的空间范围。哈贝马斯理论中私人领域是公共领域的基础；私人领域的意见进入公共讨论才可能转化为舆论。", "freq": 1, "tag": "名解"}, {"q": "舆论是什么？", "a": "公众围绕社会公共事务，通过公开表达形成的具有一定影响力的共同意见、情绪和态度，具有公共性、公开性、多数性等特征。注意区分：网络舆论是舆论在网络空间的表现形态。", "freq": 1, "tag": "名解"}, {"q": "突发事件是什么？", "a": "突然发生、造成重大人员伤亡或财产损失、需要紧急处置的事件（自然灾害/事故灾难/公共卫生/社会安全事件）。是舆论生成的强触媒，极易短时形成高强度舆论。", "freq": 1, "tag": "名解"}, {"q": "人格是什么？", "a": "个体所具有的各项比较重要和相当持久的心理特征的总和。人格差异导致公众在舆论形成中的反应不同，是解释舆论主体差异性的重要变量。", "freq": 2, "tag": "名解"}, {"q": "网络流行语是什么？", "a": "网民在网络交际中创造并迅速广泛传播的语言形式（如“躺平”“内卷”）。浓缩社会情绪，是网络舆论的温度计，反映特定时期的社会心态。", "freq": 1, "tag": "名解"}, {"q": "群体极化是什么？", "a": "群体成员经过讨论协商后，意见向更极端的方向偏移的现象。网络中回声室效应和算法推荐加剧群体极化，是网络舆论非理性化的重要机制。", "freq": 1, "tag": "名解"}, {"q": "信念回响效应是什么？", "a": "即使原有信念所依据的信息被证伪，该信念仍持续影响人们判断的心理现象。解释了辟谣后谣言仍有市场，是网络虚假信息治理的心理根源。", "freq": 1, "tag": "名解"}, {"q": "舆论传播是什么？", "a": "舆论借助大众媒介和人际渠道，在公众中扩散、互动、强化的过程。包括形成传播、舆论领袖中介作用、舆论反馈等环节，是舆论学研究的核心过程之一。", "freq": 1, "tag": "名解"}, {"q": "测量层次辨析：定类、定序、定距、定比的典型例子分别是？", "a": "定类—性别（只分类无顺序）；定序—文化程度（有等级无相等单位，定序测量在定类基础上）；定距—温度/智商测试（有相等单位无绝对零点）；定比—身高（有绝对零点可做比率）。口诀“类序距比”。", "freq": 3, "tag": "选择"}, {"q": "利克特量表从结构形式上看属于什么量表？", "a": "总加量表。（三卷同题复现）", "freq": 3, "tag": "选择"}, {"q": "问卷发放前应对什么进行检测？", "a": "适用性。", "freq": 1, "tag": "选择"}, {"q": "问卷第一部分卷首语应写什么？", "a": "“表明身份、交代目的”。", "freq": 1, "tag": "选择"}, {"q": "刘建明“舆论波”的四种情形是？", "a": "中心辐射、遍地涌动、多点呼应、多渠道互补。", "freq": 2, "tag": "选择"}, {"q": "社会治理过程是由谁为主体承担公共领域内的社会管理决策的过程？", "a": "公众。", "freq": 2, "tag": "选择"}, {"q": "中国传统社会的道德教化是？", "a": "儒学。", "freq": 2, "tag": "选择"}, {"q": "舆论的形成是___舆论向___舆论转化的过程。", "a": "潜舆论→显舆论。", "freq": 1, "tag": "选择"}, {"q": "显舆论是以公开形式表达的对舆论___的态度。", "a": "客体。", "freq": 1, "tag": "选择"}, {"q": "舆论分布常见的三种类型是？成熟阶段多呈哪种形态？", "a": "正态分布、双众数分布、单众数分布；成熟阶段多呈正态分布（单众数分布）。", "freq": 2, "tag": "选择"}]</script>
<script>
var SLUG="08257", NAME="舆论学";
var RAW=JSON.parse(document.getElementById('cards-data').textContent);
var ORDER=RAW.map(function(c,i){return i;}).sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
var KEY='zk_cards_'+SLUG;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.known&&s.wrong)return s;}catch(e){}return {known:[],wrong:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
var store=load();
var queue=[],retry=[],qi=0,roundTotal=0,roundKnown=0,roundAttempted={},phase='';
var TAGC={"名解": "#2a7a4b", "简答": "#b3541e", "论述": "#7a3b12", "选择": "#1a6fa8", "综合": "#6a3fa0", "填空": "#1a6fa8"};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n').join('<br>');}
function freqLabel(f){var hot=f>=2?' hot':'';return '<span class="freq'+hot+'">真题考过 '+f+' 次</span>';}
function tagPill(t){var c=TAGC[t]||'#888';return '<span class="tag" style="background:'+c+'">'+esc(t)+'</span>';}
function knownCount(){return store.known.length;}
function paintProg(done,total){
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ptext').textContent='已掌握 '+knownCount()+' / '+RAW.length+'（本轮 '+done+'/'+total+'）';
}
function startScreen(){
  phase='menu';paintProg(0,0);setTab(true);paintWCount();
  var nWrong=store.wrong.length;
  var h='<div class="center">共 '+RAW.length+' 张卡片<br>已掌握 '+knownCount()+' 张 · 待加强 '+nWrong+' 张<br><br>'+
    '<div class="btnrow"><button class="btn-show" onclick="startRound(\'full\')">开始自测</button></div>';
  if(nWrong){h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">只练错题（'+nWrong+'）</button></div>';}
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
  document.getElementById('b-retry').disabled=!nWrong;
}
function startRound(mode){
  roundAttempted={};roundKnown=0;
  if(mode==='wrong'){queue=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});}
  else{queue=ORDER.slice();}
  retry=[];qi=0;roundTotal=queue.length;phase='quiz';
  if(!queue.length){startScreen();return;}
  showCard(false);
}
function showCard(revealed){
  var i=queue[qi],c=RAW[i],st=document.getElementById('stage');
  paintProg(qi,roundTotal);
  var h='<div class="fcard">'+freqLabel(c.freq)+tagPill(c.tag)+'<div class="q">'+esc(c.q)+'</div>';
  if(revealed){
    h+='<div class="a"><div class="alabel">✓ 答案要点</div>'+esc(c.a)+'</div></div>';
    h+='<div class="btnrow"><button class="btn-know" onclick="mark(true)">会 ✓</button><button class="btn-unknow" onclick="mark(false)">不会 ✗</button></div>';
  }else{
    h+='</div><div class="btnrow"><button class="btn-show" onclick="showCard(true)">显示答案</button></div>';
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function mark(know){
  var i=queue[qi];
  roundAttempted[i]=1;
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(know){
    if(ki<0)store.known.push(i);
    if(wi>=0)store.wrong.splice(wi,1);
    roundKnown++;
  }else{
    if(wi<0)store.wrong.push(i);
    if(retry.indexOf(i)<0)retry.push(i);
  }
  save();qi++;next();
}
function next(){
  if(qi<queue.length){showCard(false);return;}
  if(retry.length){queue=retry;retry=[];qi=0;roundTotal=queue.length;showCard(false);return;}
  summary();
}
function summary(){
  phase='done';
  var total=Object.keys(roundAttempted).length;
  var rate=total?Math.round(roundKnown/total*100):0;
  paintProg(roundTotal,roundTotal);
  var h='<div class="sum"><div style="text-align:center;color:#888;font-size:14px">本轮结算</div>'+
    '<div class="rate">'+roundKnown+' / '+total+'（'+rate+'%）</div>';
  if(store.wrong.length){
    h+='<div style="font-size:14px;color:#888;margin:10px 0 4px">错题本（'+store.wrong.length+'）· 点击展开看答案</div>';
    var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.classList.toggle(\'open\')">'+esc(c.q)+'</div><div class="wa">'+freqLabel(c.freq)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+'</div></div>';
    });
  }else{
    h+='<div class="center">🎉 全部掌握！</div>';
  }
  h+='</div><div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')"'+(store.wrong.length?'':' disabled')+'>再练错题</button>'+
     '<button class="btn-ghost" onclick="startRound(\'full\')">重新开始</button></div>';
  document.getElementById('stage').innerHTML=h;
  window.scrollTo(0,0);
}
function paintWCount(){document.getElementById('wcount').textContent=store.wrong.length;}
function setTab(all){document.getElementById('tab-all').classList.toggle('on',all);document.getElementById('tab-wrong').classList.toggle('on',!all);}
function showWrongList(){
  phase='wrong';setTab(false);
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='不会的卡片共 '+store.wrong.length+' 张 · 点击问题可收起/展开答案';
  paintWCount();
  var st=document.getElementById('stage');
  var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ws.length){
    h='<div class="center">\u0001F389 没有不会的卡片，全部掌握！</div>';
  }else{
    h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">再练一遍（'+ws.length+'）</button></div>';
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.querySelector(\'.wa\').classList.toggle(\'show\')">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+freqLabel(c.freq)+' '+tagPill(c.tag)+'<br>'+esc(c.a)+
         '<br><button class="wmark" onclick="markKnownFromList('+i+',this)">\u2713 会了，移出</button></div></div>';
    });
  }
  st.innerHTML=h;
  window.scrollTo(0,0);
}
function markKnownFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki<0)store.known.push(i);
  if(wi>=0)store.wrong.splice(wi,1);
  save();paintWCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.wrong.length)showWrongList();
}
document.getElementById('tab-all').onclick=function(){startScreen();};
document.getElementById('tab-wrong').onclick=function(){showWrongList();};
document.getElementById('b-retry').onclick=function(){if(store.wrong.length)startRound('wrong');};
document.getElementById('b-reset').onclick=function(){
  if(confirm('清空本门课的全部自测进度？')){localStorage.removeItem(KEY);store={known:[],wrong:[]};startScreen();}
};
startScreen();
</script>
</body></html>
