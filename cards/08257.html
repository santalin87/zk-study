<script id="cards-data" type="application/json">[{"q": "哪位人物在1744年首次提出了“公共舆论”的现代意义？(2026.4新考)","a": "法国的卢梭，1744年。","freq": 1,"tag": "选择"},{"q": "“舆论”一词最早可追溯到哪部古籍？(2026.4新考)","a": "范晔的《后汉书》。","freq": 1,"tag": "选择"},{"q": "梁启超的舆论主张是什么？(2026.4新考)","a": "“通民隐、达民情”。","freq": 1,"tag": "选择"},{"q": "两高司法解释：诽谤信息被点击、浏览多少次以上或被转发多少次以上，认定情节严重？(2026.4新考)","a": "被点击、浏览5000次以上，或被转发500次以上。","freq": 1,"tag": "选择"},{"q": "“两微一端”指的是什么？(2026.4新考)","a": "微信、微博、客户端。","freq": 1,"tag": "选择"},{"q": "危机的产生原因是？(2026.4新考)","a": "社会结构和社会规则范式的整体扭曲。","freq": 1,"tag": "选择"},{"q": "社群回音壁效应会带来什么结果？(2026.4新考)","a": "群内同质性和群际异质性双向增强。","freq": 1,"tag": "选择"},{"q": "舆论监测的基本方法是？(2026.4新考)","a": "定向采集 + 非定向采集。","freq": 1,"tag": "选择"},{"q": "舆论长尾期的原因是？(2026.4新考)","a": "事件已成为“社会集体记忆”。","freq": 1,"tag": "选择"},{"q": "入户调查一般采用什么抽样方法？(2026.4新考)","a": "概率抽样（PPS抽样）。","freq": 1,"tag": "选择"},{"q": "态度形成三阶段是？（多选）(2026.4新考)","a": "依从、同化、内化。","freq": 1,"tag": "选择"},{"q": "中国共产党不同历史时期的舆论观包括哪些？（多选）(2026.4新考)","a": "作为斗争的舆论、作为引导的舆论、作为宣传的舆论、作为导向的舆论（全选）。","freq": 1,"tag": "选择"},{"q": "艺术形态的舆论包括哪些？（多选）(2026.4新考)","a": "音乐《小苹果》、电影《哪吒2之魔童闹海》、舞蹈《江南style》、网游《黑神话·悟空》（全选）。","freq": 1,"tag": "选择"},{"q": "拉扎斯菲尔德意见领袖三要素是？（多选）(2026.4新考)","a": "人格属性、能力、社会声望。","freq": 1,"tag": "选择"},{"q": "舆论议题包括哪些？（多选）(2026.4新考)","a": "领导干部违法乱纪、热点明星火爆事件、涉及国家利益、敏感国家突发国际事件（全选）。","freq": 1,"tag": "选择"},{"q": "舆论发展生命周期包括哪些阶段？（多选）(2026.4新考)","a": "生成、发展、高潮、消亡（全选）。","freq": 1,"tag": "选择"},{"q": "决定舆论质量的要素包括哪些？（多选）(2026.4新考)","a": "意见发表的平台、群体利益相关性、意见发表的自由程度、意见领袖的介入时机（全选）。","freq": 1,"tag": "选择"},{"q": "内容分析法的方法特征是？（多选）(2026.4新考)","a": "客观、系统、定量。","freq": 1,"tag": "选择"},{"q": "网络舆论定量判断指标包括哪些？（多选）(2026.4新考)","a": "传播扩散度、民众关注度、内容敏感度、态度倾向性（全选）。","freq": 1,"tag": "选择"},{"q": "说服性传播有效达到预期目标的策略包括哪些？（多选）(2026.4新考)","a": "微观修辞创新、说理法、诉求法、提示法（全选）。","freq": 1,"tag": "选择"},{"q": "判断（A=正确/B=错误）：民意是个人随时表达自己的意见，但不可以随意改变。(2026.4新考)","a": "B错误。民意可因认知变化而改变。","freq": 1,"tag": "选择"},{"q": "判断（A=正确/B=错误）：作为治国理政的舆论是新时代中国共产党舆论观的成熟完善。(2026.4新考)","a": "A正确。","freq": 1,"tag": "选择"},{"q": "判断（A=正确/B=错误）：信念是人们在社会化过程中习得的绝对固定的价值观、道德信条等。(2026.4新考)","a": "A正确。","freq": 1,"tag": "选择"},{"q": "判断（A=正确/B=错误）：“多数人”还是“少数人”都不能构成判断舆论主体的必要元素。(2026.4新考)","a": "A正确。","freq": 1,"tag": "选择"},{"q": "判断（A=正确/B=错误）：网络社会空间基本逻辑包括虚拟化、数字化、流动性和弹性、全球化、个人化。(2026.4新考)","a": "A正确。","freq": 1,"tag": "选择"},{"q": "判断（A=正确/B=错误）：张量是多源异构大数据一体化的表示方法。(2026.4新考)","a": "A正确。","freq": 1,"tag": "选择"},{"q": "判断（A=正确/B=错误）：网络首发型事件和传统媒体首发型事件的阶段表现一样。(2026.4新考)","a": "B错误。二者阶段表现有所不同。","freq": 1,"tag": "选择"},{"q": "媒体审判是什么？(2026.4新考)","a": "新闻媒体在司法程序尚未终结前，通过倾向性报道或评论对案件预先定性、定罪，影响公众判断乃至司法公正的现象。","freq": 1,"tag": "名解"},{"q": "民粹主义是什么？(2026.4新考)","a": "强调平民群众利益和意志、反对精英集团和既有政治体制的政治思潮或社会运动，以“人民”为话语核心，反建制、直接民主、情绪化表达。","freq": 1,"tag": "名解"},{"q": "人肉搜索引擎是什么？(2026.4新考)","a": "利用互联网平台、通过网民人工参与和信息协作，对特定人物、事件进行信息挖掘和身份追踪的网络信息搜索方式。","freq": 1,"tag": "名解"},{"q": "信度是什么？(2026.4新考)","a": "测量工具的可靠性、稳定性和一致性程度；舆论调查中信度高意味着多次测量结果一致性高。","freq": 1,"tag": "名解"},{"q": "简述中国共产党舆论观演进中的启示。(2026.4新考)","a": "与时俱进（斗争→引导→治国理政）、人民中心、科学管理（舆情监测预警引导机制）、法治保障、媒介融合、全球化视野。","freq": 1,"tag": "简答"},{"q": "简述舆论分析的基本原则。(2026.4新考)","a": "客观性、系统性、动态性、分层分析、定性与定量结合、价值中立。","freq": 1,"tag": "简答"},{"q": "试述舆论产业链的市场结构。(2026.4新考)","a": "上游：数据采集与监测（舆情软件/爬虫/API/数据源）→中游：数据分析与加工（舆情分析机构/文本挖掘/可视化/人工研判）→下游：应用与服务交付（政府/企业/媒体/公关/金融）→支撑层（云计算/AI技术/学术研究/行业协会）；市场特征：技术驱动、平台集中度高、政策敏感性强、需求多样化、数据源依赖性强。","freq": 1,"tag": "论述"},{"q": "论述舆论形成的六个阶段及各阶段特点。","a": "潜舆论酝酿期（意见零散、私下议论）→话题公开化（媒体/意见领袖介入，关注度快速上升）→意见分化交锋（观点对立、情绪化）→舆论高涨期（主导意见占上风，“舆论波”）→舆论成熟期（主导意见形成，呈正态分布）→衰减反馈期（热度下降，留下“舆论遗产”）。舆论分布三种形态：正态分布、双众数分布、单众数分布。","freq": 3,"tag": "论述"},{"q": "论述舆论调控的理论前提。","a": "即调控的必要性和可能性。必要性：舆论两面性（健康舆论是纽带，失控致失序）；群体心理非理性（勒庞《乌合之众》：易冲动轻信情绪化）；舆论与事实可能脱节（“两种舆论”背离）；维护公共利益和稳定。可能性：舆论规律可把握；传播手段可调控（议程设置/把关人/意见领袖）；公众可沟通；制度渠道畅通。","freq": 3,"tag": "论述"},{"q": "论述先秦社会的舆论秩序。","a": "五种舆论形式：乡校议政（子产不毁乡校，闻过而改）；采诗观风（观风俗知得失，最早的民意调查雏形）；国人参政（“防民之口，甚于防川”警示）；朝议（朝廷议论国事）；百工谏、庶人传语（自上而下的民意吸纳）。特点：制度化渠道吸纳民意；压制舆论必致更大危机。","freq": 2,"tag": "论述"},{"q": "论述网络调查的特征、局限性与对策。","a": "特征：匿名保密、跨时空、即时高效、互动性强、客观性。局限性：样本代表性不足、身份难核验、问卷设计要求高、参与局限性。途径：电子邮件/网站/论坛社区/即时通信调查。对策：配额抽样+事后加权；身份验证技术；优化问卷设计；与传统调查结合互补。","freq": 2,"tag": "论述"},{"q": "试述调查报告的结构和主要内容。","a": "三部分：导言部分（背景目的、对象抽样、实施过程，判断可信度）；主体部分（数据呈现分析、图表、主要发现，报告核心）；讨论部分（解释评价、结论建议、局限展望）。另含标题、摘要、关键词、附录；要求结构完整、数据真实、分析深入、语言简洁。","freq": 2,"tag": "论述"},{"q": "试述问卷设计的主要步骤。","a": "三步：探索性工作（熟悉内容、划定范围、列提纲）→设计问卷初稿（卡片法/框图法；表述简洁，题目不超70个、作答控制在30分钟内）→试用和修改（30-100份小样本试调查，求信度效度，反复修订定稿）。注意：发放前做适用性检测；卷首语“表明身份、交代目的”。","freq": 2,"tag": "论述"},{"q": "简述舆论社会目标设定的维度。","a": "时间维度（长期/中期/短期）；层次维度（认知—让公众知道、态度—让公众认同、行为—让公众行动）；范围维度（全局性/局部性）；主体维度（决策层/公众/媒体）；内容维度（议题/形象/关系）。","freq": 1,"tag": "简答"},{"q": "简述舆论的客体及其规定性特征。","a": "客体：舆论所指向的对象，即社会公共事务、社会问题和事件（“舆论的靶子”）。规定性特征：公共性、公开性、现实针对性、多数性。客体决定舆论性质，客体越重大舆论强度越大。","freq": 1,"tag": "简答"},{"q": "简述学术真理性标准所应具备的四个特点。","a": "客观性（符合客观实际，不以主观意志为转移）；可检验性（可重复验证，经得起实践检验）；逻辑一致性（内部自洽）；实践标准（最终由社会实践检验）。","freq": 1,"tag": "简答"},{"q": "简述舆论测量的原则和特点。","a": "原则：客观性、科学性、可操作性、伦理原则。特点：量化（意见转数字）、抽样（部分推总体）、标准化（统一问卷程序）、间接性（通过指标推测舆论）。","freq": 1,"tag": "简答"},{"q": "简要回答转型期中国的社会大众心理。","a": "焦虑心态（未来不确定性）；公平焦虑（分配不公、阶层固化）；安全感缺失；戾气与宣泄（网络情绪化表达）；期待心态（对美好生活、公平正义的期待）。","freq": 1,"tag": "简答"},{"q": "简要回答内容分析的实施过程包含几个部分。","a": "确定研究问题与假设→界定总体与抽样→建构分析类目体系→制定编码规则并培训编码员→信度检验→数据统计与结果分析。","freq": 1,"tag": "简答"},{"q": "灾害报道是什么？","a": "对自然灾害、事故灾难等突发性灾害事件的新闻报道。要求及时准确全面，注重人文关怀，避免“次生伤害”，发挥预警和安抚功能。","freq": 1,"tag": "名解"},{"q": "网络舆论是什么？","a": "网民通过互联网平台，围绕社会公共事务表达的意见、情绪和态度的集合。即时性、互动性、情绪化、裂变式传播，是当代舆论的主场形态之一。","freq": 1,"tag": "名解"},{"q": "概念是什么？","a": "舆论测量与研究中的基本范畴，是对客观事物本质属性的抽象概括。变量就是由概念构成的；概念须经操作化定义转化为可测变量指标。","freq": 1,"tag": "名解"},{"q": "变量是什么？","a": "可取不同值的概念，即属性在不同个体或时间上存在差异的概念（如性别、年龄、态度强度）。是舆论定量测量的基本分析单位；测量层次分定类、定序、定距、定比。","freq": 1,"tag": "名解"},{"q": "朝议是什么？","a": "在朝廷上议论国事，是先秦时期重要的参政舆论形式。君臣在朝堂就国家大事发表意见展开辩论，是决策程序也是舆论表达的制度化渠道。","freq": 1,"tag": "名解"},{"q": "私人领域是什么？","a": "与公共领域相对的概念，指个人私密生活、家庭事务的空间范围。哈贝马斯理论中私人领域是公共领域的基础；私人领域的意见进入公共讨论才可能转化为舆论。","freq": 1,"tag": "名解"},{"q": "舆论是什么？","a": "公众围绕社会公共事务，通过公开表达形成的具有一定影响力的共同意见、情绪和态度，具有公共性、公开性、多数性等特征。注意区分：网络舆论是舆论在网络空间的表现形态。","freq": 1,"tag": "名解"},{"q": "突发事件是什么？","a": "突然发生、造成重大人员伤亡或财产损失、需要紧急处置的事件（自然灾害/事故灾难/公共卫生/社会安全事件）。是舆论生成的强触媒，极易短时形成高强度舆论。","freq": 1,"tag": "名解"},{"q": "人格是什么？","a": "个体所具有的各项比较重要和相当持久的心理特征的总和。人格差异导致公众在舆论形成中的反应不同，是解释舆论主体差异性的重要变量。","freq": 2,"tag": "名解"},{"q": "网络流行语是什么？","a": "网民在网络交际中创造并迅速广泛传播的语言形式（如“躺平”“内卷”）。浓缩社会情绪，是网络舆论的温度计，反映特定时期的社会心态。","freq": 1,"tag": "名解"},{"q": "群体极化是什么？","a": "群体成员经过讨论协商后，意见向更极端的方向偏移的现象。网络中回声室效应和算法推荐加剧群体极化，是网络舆论非理性化的重要机制。","freq": 1,"tag": "名解"},{"q": "信念回响效应是什么？","a": "即使原有信念所依据的信息被证伪，该信念仍持续影响人们判断的心理现象。解释了辟谣后谣言仍有市场，是网络虚假信息治理的心理根源。","freq": 1,"tag": "名解"},{"q": "舆论传播是什么？","a": "舆论借助大众媒介和人际渠道，在公众中扩散、互动、强化的过程。包括形成传播、舆论领袖中介作用、舆论反馈等环节，是舆论学研究的核心过程之一。","freq": 1,"tag": "名解"},{"q": "测量层次辨析：定类、定序、定距、定比的典型例子分别是？","a": "定类—性别（只分类无顺序）；定序—文化程度（有等级无相等单位，定序测量在定类基础上）；定距—温度/智商测试（有相等单位无绝对零点）；定比—身高（有绝对零点可做比率）。口诀“类序距比”。","freq": 3,"tag": "选择"},{"q": "利克特量表从结构形式上看属于什么量表？","a": "总加量表。（三卷同题复现）","freq": 3,"tag": "选择"},{"q": "问卷发放前应对什么进行检测？","a": "适用性。","freq": 1,"tag": "选择"},{"q": "问卷第一部分卷首语应写什么？","a": "“表明身份、交代目的”。","freq": 1,"tag": "选择"},{"q": "刘建明“舆论波”的四种情形是？","a": "中心辐射、遍地涌动、多点呼应、多渠道互补。","freq": 2,"tag": "选择"},{"q": "社会治理过程是由谁为主体承担公共领域内的社会管理决策的过程？","a": "公众。","freq": 2,"tag": "选择"},{"q": "中国传统社会的道德教化是？","a": "儒学。","freq": 2,"tag": "选择"},{"q": "舆论的形成是___舆论向___舆论转化的过程。","a": "潜舆论→显舆论。","freq": 1,"tag": "选择"},{"q": "显舆论是以公开形式表达的对舆论___的态度。","a": "客体。","freq": 1,"tag": "选择"},{"q": "舆论分布常见的三种类型是？成熟阶段多呈哪种形态？","a": "正态分布、双众数分布、单众数分布；成熟阶段多呈正态分布（单众数分布）。","freq": 2,"tag": "选择"},{"q": "西周初年，周武王之弟周公旦\"制礼作乐\"。关于礼乐制度表述正确的是\nA.礼乐是文化艺术制度\nB.礼乐是舆论控制的手段\nC.礼乐制度专为皇室贵族制定\nD.礼乐只包含吉礼和宾礼","a": "【参考答案】B（礼乐是舆论控制的手段）。","tag": "单选","freq": 2,"src": "2022.4真题","ai": true},{"q": "下列关于社会治理的过程表述正确的是\nA.承担公共领域内的科学决策\nB.公众自行决策\nC.由政府为主体\nD.由公众为主体承担公共领域内的社会管理决策过程","a": "【参考答案】D。","tag": "单选","freq": 2,"src": "2022.4真题","ai": true},{"q": "作为舆论的存在形式——意见，其规定性具有下列哪项特征？\nA.集合性与表层性\nB.公共性与公开性\nC.合理性与合规性\nD.离散性与连续性","a": "【参考答案】B（公共性与公开性）。","tag": "单选","freq": 2,"src": "2022.4真题","ai": true},{"q": "关于 重人文关怀，避免对受害者造成\"次生伤害\"；发挥预警和安抚功能。","tag": "名解","freq": 2,"src": "2022.4真题","ai": true},{"q": "网络舆论是什么？","a": "【参考答案】网民通过互联网平台，围绕社会公共事务表达的意见、情绪和态度的集合。具有即时性、互动性、情绪化、裂变式传播等特点。","tag": "名解","freq": 2,"src": "2022.4真题","ai": true},{"q": "概念是什么？","a": "【参考答案】舆论测量与研究中的基本范畴，是对客观事物本质属性的抽象概括。变量就是由概念构成的；概念须经操作化定义转化为可测变量指标。","tag": "名解","freq": 2,"src": "2022.4真题","ai": true},{"q": "简述舆论社会目标设定的维度。","a": "【按背诵资料整理】时间维度（长期/中期/短期）；层次维度（认知—让公众知道、态度—让公众认同、行为—让公众行动）；范围维度（全局性/局部性）；主体维度（决策层/公众/媒体）；内容维度（议题/形象/关系）。","tag": "简答","freq": 2,"src": "2022.4真题","ai": true},{"q": "简述舆论调控的理论前提。","a": "【按背诵资料整理】即调控的必要性和可能性。必要性：舆论两面性（健康舆论是纽带，失控致失序）、群体心理非理性（勒庞《乌合之众》）、舆论与事实可能脱节（\"两种舆论\"背离）、维护公共利益和稳定；可能性：舆论规律可把握、传播手段可调控（议程设置/把关人/意见领袖）、公众可沟通、制度渠道畅通。","tag": "简答","freq": 2,"src": "2022.4真题","ai": true},{"q": "简述网络调查的途径与网上调查的特征。","a": "【按背诵资料整理】途径：电子邮件调查、网站调查、论坛/社区调查、即时通信调查。特征：匿名保密、跨时空、即时高效、互动性强、客观性。","tag": "简答","freq": 2,"src": "2022.4真题","ai": true},{"q": "论述先秦社会的舆论秩序。","a": "【按背诵资料整理】五种舆论形式：乡校议政（子产不毁乡校，闻过而改）；采诗观风（观风俗知得失，最早的民意调查雏形）；国人参政（\"防民之口，甚于防川\"）；朝议（朝廷议论国事）；百工谏、庶人传语（自上而下的民意吸纳）。特点：制度化渠道吸纳民意；压制舆论必致更大危机。","tag": "论述","freq": 2,"src": "2022.4真题","ai": true},{"q": "论述舆论形成的六个阶段及各阶段特点。","a": "【按背诵资料整理】潜舆论酝酿期（意见零散、私下议论）→话题公开化（媒体/意见领袖介入，关注度快速上升）→意见分化交锋（观点对立、情绪化）→舆论高涨期（主导意见占上风，\"舆论波\"）→舆论成熟期（主导意见形成，呈正态分布）→衰减反馈期（热度下降，留下\"舆论遗产\"）。舆论分布三种形态：正态分布、双众数分布、单众数分布。","tag": "论述","freq": 2,"src": "2022.4真题","ai": true},{"q": "下列不属于官僚体制内的舆论秩序的是\nA.朝议制度\nB.谏诤制度\nC.官报\nD.上书请愿","a": "【参考答案】D（上书请愿属于体制外/民间的舆论表达）。","tag": "单选","freq": 2,"src": "2022.10真题","ai": true},{"q": "关于舆论作用发挥的前提与保证表述正确的是\nA.民意反馈是前提\nB.政治透明是前提\nC.科学制度是保障\nD.合理性是目标","a": "【参考答案】B（政治透明是舆论作用发挥的前提）。","tag": "单选","freq": 2,"src": "2022.10真题","ai": true},{"q": "社会问题不是一个私人问题，而是一个公共问题。关于公共性，表述正确的是\nA.公共性是企业利益的表现\nB.公共性与社会观念无关\nC.公共性、私人性和专业性问题之间是可以转化的\nD.公共性与社会关系无关","a": "【参考答案】C。","tag": "单选","freq": 2,"src": "2022.10真题","ai": true},{"q": "下列属于\"舆论波\"的波动情形的是\nA.中心辐射\nB.轮状辐射\nC.多渠道扩散\nD.多点呼应","a": "【参考答案】A（中心辐射）。注：D\"多点呼应\"亦为刘建明\"舆论波\"四种情形之一，本题疑有两个正确选项。","tag":  "名解","freq": 2,"src": "2022.10真题","ai": true},{"q": "私人领域是什么？","a": "【参考答案】与公共领域相对的概念，指个人私密生活、家庭事务的空间范围。哈贝马斯理论中私人领域是公共领域的基础；私人领域的意见进入公共讨论才可能转化为舆论。","tag": "名解","freq": 2,"src": "2022.10真题","ai": true},{"q": "简述舆论的客体及其规定性特征。","a": "【按背诵资料整理】客体：舆论所指向的对象，即社会公共事务、社会问题和事件（\"舆论的靶子\"）。规定性特征：公共性、公开性、现实针对性、多数性。客体决定舆论性质，客体越重大舆论强度越大。","tag": "简答","freq": 2,"src": "2022.10真题","ai": true},{"q": "简述网络舆论形成的六个阶段。","a": "【按背诵资料整理】潜舆论酝酿→话题公开化→意见分化交锋→舆论高涨→主导意见形成（成熟，呈正态分布）→衰减反馈。","tag": "简答","freq": 2,"src": "2022.10真题","ai": true},{"q": "简述学术真理性标准所应具备的四个特点。","a": "【按背诵资料整理】客观性（符合客观实际，不以主观意志为转移）；可检验性（可重复验证，经得起实践检验）；逻辑一致性（内部自洽）；实践标准（最终由社会实践检验）。","tag": "简答","freq": 2,"src": "2022.10真题","ai": true},{"q": "论述舆论调控的理论前提。","a": "【按背诵资料整理】即调控的必要性和可能性。必要性：舆论两面性、群体心理非理性（勒庞《乌合之众》）、舆论与事实可能脱节、维护公共利益和稳定；可能性：舆论规律可把握、传播手段可调控、公众可沟通、制度渠道畅通。","tag": "论述","freq": 2,"src": "2022.10真题","ai": true},{"q": "论述网络调查的特征、局限性与对策。","a": "【按背诵资料整理】特征：匿名保密、跨时空、即时高效、互动性强、客观性。局限性：样本代表性不足、身份难核验、问卷设计要求高、参与局限性。对策：配额抽样+事后加权、身份验证技术、优化问卷设计、与传统调查结合互补。","tag": "论述","freq": 2,"src": "2022.10真题","ai": true},{"q": "下列属于中国传统社会的道德教化的是\nA.宗教\nB.儒学\nC.新闻\nD.法学","a": "【参考答案】B（儒学）。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "关于先秦古典舆论观表达正确的是\nA.民主主义舆论观起源于春秋时期\nB.民主主义舆论观代表人物是周武王\nC.轻言主义的主要代表是儒家学派\nD.商鞅是法学家学派奠基者之一","a": "【参考答案】D。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "西方舆论思想存在两种截然不同的观点。关于两个学派观点的再认识表述正确的是\nA.必然会有一个面临灭亡\nB.必然会有一个是不合理的\nC.着眼于社会公共管理决策不同层面的差异性\nD.都属于科学管理决策中的角色","a": "【参考答案】C。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "下列量表从结构形式上属于总加量表的是\nA.鲍格达拉斯量表\nB.盖特曼量表\nC.计算机量表\nD.利克特量表","a": "【参考答案】D（利克特量表）。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "舆论调控的理论前提包括\nA.舆论调控的必要性和可能性\nB.舆论调控的合理性和完整性\nC.舆论调控的科学性和严谨性\nD.以上三项均不是","a": "【参考答案】A。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "关于舆论与舆情的关系，表述正确的是\nA.舆论与舆情无关\nB.舆论与舆情并没有本质差别，它们是同一事物的两个方面\nC.舆论表达了民意，而舆情表达了社会态度\nD.舆情会对政治、经济产生影响，而舆论不会产生影响","a": "【参考答案】B。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "下列关于测量工具的表达正确的是\nA.测量工具必须能够正确代表所反映的事实\nB.测量工具只能测量少数事物\nC.只要是尺子，就可以作为身高的测量工具\nD.测量工具不包含书面工具","a": "【参考答案】A。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "下列属于定距测量的是\nA.性别\nB.智商测试\nC.文化程度\nD.来自地区","a": "【参考答案】B（智商测试）。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "关于抽样的表述正确的是\nA.样本可以与总体无关\nB.样本数量越少越好\nC.舆论调查的常规性手段是抽样调查\nD.抽样不可以是随机的","a": "【参考答案】C。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "下列属于量表类型的是\nA.时间序列标记\nB.平衡记分卡\nC.个人身分量表\nD.社会距离量表","a": "【参考答案】D（社会距离量表）。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "问卷设计的主要步骤包括\nA.探索性工作、设计问卷初稿、试用和修改\nB.只需要设计问卷初稿\nC.探索性工作和设计初稿\nD.设计问卷初稿和发放问卷","a": "【参考答案】A。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "关于访问员，下列表述不正确的是\nA.需要有基本条件要求\nB.访问员不需要进行调查程序和调查技巧的培训\nC.是调查的直接实施者\nD.是研究者与调查对象的中介","a": "【参考答案】B。","tag": "单选","freq": 2,"src": "2023.4真题","ai": true},{"q": "所谓公共性问题，就是指和人们社会利益相关、和人们______相关、和人们社会观念相关的问题。","a": "【参考答案】社会关系。","tag": "填空","freq": 2,"src": "2023.4真题","ai": true},{"q": "社会治理过程是由______为主体承担公共领域内的社会管理决策的过程。","a": "【参考答案】公众。","tag": "填空","freq": 2,"src": "2023.4真题","ai": true},{"q": "舆论分布常见的三种类型分别是：______分布、双众数分布、______分布。","a": "【参考答案】正态分布、单众数分布。","tag": "填空","freq": 2,"src": "2023.4真题","ai": true},{"q": "所谓\"显问题\"是指\"______\"在积累到一定阶段，其对社会公共利益构成的某种威胁已经通过某种中介性的事件集中体现出来。","a": "【参考答案】潜问题。","tag": "填空","freq": 2,"src": "2023.4真题","ai": true},{"q": "在进行意见传播时，不但要强调传播者自己的主张和观点，而且要有意识、有计划地安排一些反对意见。这种现象被称为\"______\"和\"______\"。","a": "【参考答案】免疫、接种（麦奎尔\"接种理论\"：预先呈现弱化的反方观点可产生免疫效果）。","tag": "填空","freq": 2,"src": "2023.4真题","ai": true},{"q": "舆论是什么？","a": "【参考答案】公众围绕社会公共事务，通过公开表达形成的具有一定影响力的共同意见、情绪和态度，具有公共性、公开性、多数性等特征。","tag": "名解","freq": 2,"src": "2023.4真题","ai": true},{"q": "突发事件是什么？","a": "【参考答案】突然发生、造成重大人员伤亡或财产损失、需要紧急处置的事件（自然灾害/事故灾难/公共卫生/社会安全事件）。是舆论生成的强触媒，极易短时形成高强度舆论。","tag": "名解","freq": 2,"src": "2023.4真题","ai": true},{"q": "人格是什么？","a": "【参考答案】个体所具有的各项比较重要和相当持久的心理特征的总和。人格差异导致公众在舆论形成中的反应不同，是解释舆论主体差异性的重要变量。","tag": "名解","freq": 2,"src": "2023.4真题","ai": true},{"q": "简述先秦社会的舆论秩序。","a": "【按背诵资料整理】乡校议政（子产不毁乡校）、采诗观风（观风俗知得失）、国人参政（防民之口甚于防川）、朝议（朝廷议论国事）、百工谏与庶人传语。","tag": "简答","freq": 2,"src": "2023.4真题","ai": true},{"q": "简述舆论形成的六个阶段。","a": "【按背诵资料整理】潜舆论酝酿→话题公开化→意见分化交锋→舆论高涨→主导意见形成（成熟，呈正态分布）→衰减反馈。","tag": "简答","freq": 2,"src": "2023.4真题","ai": true},{"q": "简述舆论测量的原则和特点。","a": "【按背诵资料整理】原则：客观性、科学性、可操作性、伦理原则。特点：量化（意见转数字）、抽样（部分推总体）、标准化（统一问卷程序）、间接性（通过指标推测舆论）。","tag": "简答","freq": 2,"src": "2023.4真题","ai": true},{"q": "进行民意调查所获得的结果，要以调查报告的形式反映出来。试述调查报告的结构和主要内容。","a": "【按背诵资料整理】三部分：导言部分（背景目的、对象抽样、实施过程）、主体部分（数据呈现分析、图表、主要发现，报告核心）、讨论部分（解释评价、结论建议、局限展望）。另含标题、摘要、关键词、附录。","tag": "论述","freq": 2,"src": "2023.4真题","ai": true},{"q": "试述问卷设计的主要步骤。","a": "【按背诵资料整理】探索性工作（熟悉内容、划定范围、列提纲）→设计问卷初稿（卡片法/框图法；题目不超70个、作答控制在30分钟内）→试用和修改（30-100份小样本试调查，求信度效度，反复修订定稿）。","tag": "论述","freq": 2,"src": "2023.4真题","ai": true},{"q": "1920年______在《北京大学月刊》上发表论文《舆论之研究》，成为迄今为止最早将\"舆论\"作为独立问题开展研究的学术论文。\nA.戈公振\nB.徐宝璜\nC.邵飘萍\nD.王韬","a": "【参考答案】B（徐宝璜）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "中国共产党的百年舆论观一以贯之的灵魂和内核是\nA.党性和人民性\nB.社会现实和人民性\nC.媒介技术和社会现实\nD.媒介技术和人民性","a": "【参考答案】A（党性和人民性）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆论表达中______是强度最大、最有行动力的形态。\nA.文艺舆论\nB.行为舆论\nC.潜舆论\nD.显舆论","a": "【参考答案】B（行为舆论）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "奥尔波特提出一个谣言的公式，认为谣言更容易产生是因为\nA.事件越重要，公开透明度越低\nB.事件越重要，公开透明度越高\nC.事件越不重要，公开透明度越低\nD.事件越不重要，公开透明度越高","a": "【参考答案】A（事件越重要，公开透明度越低；谣言=重要性×模糊性）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "前总统里根夫人曾拍摄了一个反毒品的公益广告，结果反而成了社会示范，这是______效应。\nA.可视化带来的负效应\nB.延时机制效应\nC.逆火效应\nD.长尾效应","a": "暂无可靠答案，先记题干","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "______是进行舆论引导的第一步。\nA.判断舆论源头\nB.判断舆论质量\nC.判断舆论平台\nD.判断舆论事由","a": "【参考答案】D（判断舆论事由）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "网络民族主义的鲜明特征是\nA.刷榜\nB.网络抵制\nC.表情包轰炸\nD.线下集会","a": "【参考答案】B（网络抵制）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "诗经中的______相当于原始的舆论调查。\nA.雅\nB.颂\nC.歌\nD.风","a": "【参考答案】D（风；采诗观风）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "网络社会治理需要建立在承认网络文化具有个性化、______的基础上。\nA.年轻化\nB.理论化\nC.跨文化\nD.多元化","a": "【参考答案】D（多元化）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "社会网络分析在研究视角上可以大致分为关系取向和\nA.时间取向\nB.人群取向\nC.位置取向\nD.主题取向","a": "【参考答案】C（位置取向）。","tag": "单选","freq": 2,"src": "2025.4真题","ai": true},{"q": "国内学者对舆论史的研究主要有以下______类。\nA.中国历代舆论事件或运动\nB.不同时代的报刊与舆论的关系\nC.重要的报人和政治家的舆论思想\nD.研究外国历史上的舆论现象","a": "【参考答案】A、B、C。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "以下______是中国近代资产阶级的办报理论和舆论思想。\nA.郑观应的\"通民隐，达民情\"\nB.王韬的\"强中御远\"\nC.谭嗣同的\"通上下之情\"\nD.梁启超的\"去塞求通\"","a": "【参考答案】A、B、C、D（全选）。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆论作为一种意见和观点信息，具备的信息形态包括\nA.信息形态的舆论\nB.意见形态的舆论\nC.艺术形态的舆论\nD.历史形态的舆论","a": "【参考答案】A、B、C（信息形态、意见形态、艺术形态的舆论）。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "网络水军的具体行为特征有以下\nA.身份隐蔽\nB.灵活性强\nC.集中且广泛\nD.广泛且分散","a": "【参考答案】A、B、C（身份隐蔽、灵活性强、集中且广泛）。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "一个正常的社会结构应该是三层，分别是\nA.政治精英\nB.中层组织\nC.民众\nD.小资产阶级","a": "【参考答案】A、B、C（政治精英、中层组织、民众）。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "后真相时代的情感动员策略包含\nA.怀疑策略\nB.示弱策略\nC.简单归因策略\nD.贴标签策略","a": "【参考答案】A、B、C、D（全选）。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆论很大层面上是一种______和______，有一个缓慢的形成过程及人们的感知阶段。\nA.社会氛围\nB.群体行动\nC.心理反馈\nD.话语气候","a": "暂无可靠答案，先记题干","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "社交茧房形成的\"舆情遮蔽\"类型包括\nA.职业茧房\nB.性别茧房\nC.世代茧房\nD.地域茧房","a": "【参考答案】A、B、C、D（全选）。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆论测量方法未来发展的趋势有\nA.文本+关系+情绪的多元耦合分析\nB.数据爬取分析\nC.地理位置+社会关系网的综合研判\nD.动态化+实时化结构演进分析","a": "【参考答案】A、B、C、D（全选）。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "对网络舆情研判时，就传播形式而言，一般需要具备的条件是\nA.结构具有逻辑\nB.有图有真相\nC.标题吸引眼球\nD.篇幅简短","a": "【参考答案】A、B、C。","tag": "多选","freq": 2,"src": "2025.4真题","ai": true},{"q": "态度表现为对外界事物的内在感受、情感和意向三个方面。\nA.正确 B.错误","a": "【参考答案】B（错误；态度三成分是认知、情感、意向/行为倾向）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "刻板成见是指人们对特定的事物所持有的固定化、复杂化的观念和印象。\nA.正确 B.错误","a": "【参考答案】B（错误；刻板成见是固定化、简单化/脸谱化的观念和印象）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "中国共产党的舆论认知在建党初期确实是深受康梁传统精英的舆论观影响的。\nA.正确 B.错误","a": "【参考答案】A（正确）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "互联网治理的本质要义就是互动和调和，说明党对舆论中各种互动关系的认知在不断深化和趋于完善。\nA.正确 B.错误","a": "【参考答案】A（正确）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "信息搬运工指的是将信息从信息节点A搬运到信息节点B的所有主体和受众。\nA.正确 B.错误","a": "【参考答案】A（正确）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆论的启动分为信息爆料启动型和群体组织启动型。\nA.正确 B.错误","a": "【参考答案】A（正确）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆论产生的一个基本前提是，民众对舆论客体的表达意见是自由、自在的。\nA.正确 B.错误","a": "暂无可靠答案，先记题干","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "判断抽样的特点在于样本的代表性很容易判断。\nA.正确 B.错误","a": "【参考答案】B（错误；判断抽样的样本代表性难以判断）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆情监测中定向采集是利用一些网络平台内部的站内搜索来实现。\nA.正确 B.错误","a": "【参考答案】A（正确）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "态度倾向性指标可以用以表征民众所持有的观点态度（即民意）倾向。\nA.正确 B.错误","a": "【参考答案】A（正确）。","tag": "判断","freq": 2,"src": "2025.4真题","ai": true},{"q": "网络流行语是什么？","a": "【参考答案】网民在网络交际中创造并迅速广泛传播的语言形式（如\"躺平\"\"内卷\"）。浓缩社会情绪，是网络舆论的温度计，反映特定时期的社会心态。","tag": "名解","freq": 2,"src": "2025.4真题","ai": true},{"q": "群体极化是什么？","a": "【参考答案】群体成员经过讨论协商后，意见向更极端的方向偏移的现象。网络中回声室效应和算法推荐加剧群体极化，是网络舆论非理性化的重要机制。","tag": "名解","freq": 2,"src": "2025.4真题","ai": true},{"q": "信念回响效应是什么？","a": "【参考答案】即使原有信念所依据的信息被证伪，该信念仍持续影响人们判断的心理现象。解释了辟谣后谣言仍有市场，是网络虚假信息治理的心理根源。","tag": "名解","freq": 2,"src": "2025.4真题","ai": true},{"q": "舆论传播是什么？","a": "【参考答案】舆论借助大众媒介和人际渠道，在公众中扩散、互动、强化的过程。包括形成传播、舆论领袖中介作用、舆论反馈等环节，是舆论学研究的核心过程之一。","tag": "名解","freq": 2,"src": "2025.4真题","ai": true},{"q": "简要回答转型期中国的社会大众心理。","a": "【按背诵资料整理】焦虑心态（对未来不确定性的担忧）；公平焦虑（对分配不公、阶层固化的敏感）；安全感缺失；戾气与宣泄（网络空间情绪化表达增多）；期待心态（对美好生活、公平正义的强烈期待）。","tag": "简答","freq": 2,"src": "2025.4真题","ai": true},{"q": "简要回答内容分析的实施过程包含几个部分。","a": "【按背诵资料 "【官方答案】A（正确）。","tag": "判断","freq": 2,"src": "2026.4真题","ai": false},{"q": "对于较为复杂、涉及面广的客体的意见，需要通过科学的方法来估量舆论的数量。\nA.正确 B.错误","a": "【官方答案】A（正确）。","tag": "判断","freq": 2,"src": "2026.4真题","ai": false},{"q": "概率抽样中起决定作用的不是抽中样本数量的多寡。\nA.正确 B.错误","a": "【官方答案】A（正确）。","tag": "判断","freq": 2,"src": "2026.4真题","ai": false},{"q": "张量是一种有效的多源异构大数据一体化的表示方法。\nA.正确 B.错误","a": "【官方答案】A（正确）。","tag": "判断","freq": 2,"src": "2026.4真题","ai": false},{"q": "尽管网络首发事件和传统媒体首发事件之间首发媒体的属性和导入网络传播场域的方式不同，但在具体的阶段表现上是一样的。\nA.正确 B.错误","a": "【官方答案】B（错误）——二者阶段表现有所不同。","tag": "判断","freq": 2,"src": "2026.4真题","ai": false},{"q": "社会网络的分析包含行动者和关系、联结。\nA.正确 B.错误","a": "【官方答案】A（正确）。","tag": "判断","freq": 2,"src": "2026.4真题","ai": false},{"q": "媒体审判是什么？","a": "【官方答案】新闻媒体在司法程序尚未终结之前，通过倾向性报道或评论，对案件进行预先定性、定罪，从而影响公众判断乃至司法公正的现象。","tag": "名解","freq": 2,"src": "2026.4真题","ai": false},{"q": "人肉搜索引擎是什么？","a": "【官方答案】利用互联网平台，通过网民的人工参与和信息协作，对特定人物、事件进行信息挖掘和身份追踪的网络信息搜索方式。","tag": "名解","freq": 2,"src": "2026.4真题","ai": false},{"q": "民粹主义是什么？","a": "【官方答案】一种强调平民群众利益和意志、反对精英集团和既有政治体制的政治思潮或社会运动，常以\"人民\"为话语核心，具有反建制、直接民主、情绪化表达等特征。","tag": "名解","freq": 2,"src": "2026.4真题","ai": false},{"q": "信度是什么？","a": "【官方答案】测量工具的可靠性、稳定性和一致性程度。在舆论调查中，信度高意味着多次测量结果具有较高的一致性。","tag": "名解","freq": 2,"src": "2026.4真题","ai": false},{"q": "简要回答中国共产党舆论观演进中的启示。","a": "【官方答案】1.与时俱进：从\"作为斗争的舆论\"到\"作为引导的舆论\"再到\"作为治国理政的舆论\"，不断适应时代发展；2.人民中心：始终坚持\"以人民为中心\"，重视民意、倾听民声；3.科学管理：建立和完善舆情监测、预警、引导机制；4.法治保障：通过法律法规规范舆论传播秩序；5.媒介融合：重视新媒体环境下的舆论引导能力建设；6.全球化视野：在国际舆论场中主动设置议程，提升话语权。","tag": "简答","freq": 2,"src": "2026.4真题","ai": false},{"q": "简要回答舆论分析的基本原则是什么？","a": "【官方答案】1.客观性原则：基于事实和数据，避免主观臆断；2.系统性原则：从整体和关联的角度分析舆论现象；3.动态性原则：关注舆论发展变化的全过程；4.分层分析原则：区分不同人群、不同平台的舆论特征；5.定性与定量结合原则：综合运用内容分析、情感分析、数据统计等方法；6.价值中立原则：尽可能减少分析者自身立场对结果的干扰。","tag": "简答","freq": 2,"src": "2026.4真题","ai": false},{"q": "简要论述舆论产业链的市场结构主要包含哪些？","a": "【官方答案】一、上游：数据采集与监测（舆情监测软件/平台开发商、网络爬虫与数据采集服务商、社交媒体API数据接口提供商、新闻网站/论坛/短视频平台等数据源）；二、中游：数据分析与加工（舆情分析机构、情感分析/文本挖掘技术服务商、可视化报告制作机构、人工研判与专家解读团队）；三、下游：应用与服务交付（政府部门、企业客户、媒体机构、公关公司、金融机构）；四、支撑层（云计算与大数据基础设施、人工智能/自然语言处理技术、学术研究机构、行业协会与标准制定组织）；五、市场结构特征：技术驱动明显、平台集中度高、政策敏感性强、需求多样化、数据源依赖性强。","tag": "论述","freq": 2,"src": "2026.4真题","ai": false}]</script>
<script>
var SLUG="08257", NAME="舆论学";
var RAW=JSON.parse(document.getElementById('cards-data').textContent);
var ORDER=RAW.map(function(c,i){return i;}).sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
var KEY='zk_cards_'+SLUG;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.known&&s.wrong)return s;}catch(e){}return {known:[],wrong:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(store));}
var store=load();
var queue=[],retry=[],qi=0,roundTotal=0,roundKnown=0,roundAttempted={},phase='';
var roundMode='full',inRetry=false,resumed=false;
var POSKEY='zk_pos_'+SLUG;
function loadPos(){try{var p=parseInt(localStorage.getItem(POSKEY),10);if(!isNaN(p))return p;}catch(e){}return 0;}
function savePos(){if(roundMode==='full'&&!inRetry&&qi>=0&&qi<RAW.length){try{localStorage.setItem(POSKEY,String(qi));}catch(e){}}}
function clearPos(){try{localStorage.removeItem(POSKEY);}catch(e){}}
function paintBar(){var bar=document.getElementById('navctrl');if(!bar)return;if(phase==='quiz'){bar.style.display='flex';document.getElementById('navpos').textContent='第 '+(qi+1)+' / '+roundTotal+' 题';}else{bar.style.display='none';}}
function navRowHtml(){return '<div class="btnrow navrow"><button class="btn-ghost" onclick="goPrev()"'+(qi<=0?' disabled':'')+'>← 上一题</button><button class="btn-ghost" onclick="goNext()">'+(qi>=queue.length-1?'进入结算 →':'下一题 →')+'</button></div>';}
function goPrev(){if(phase!=='quiz'||qi<=0)return;resumed=false;qi--;savePos();showCard(false);}
function goNext(){if(phase!=='quiz')return;resumed=false;if(qi<queue.length-1){qi++;savePos();showCard(false);}else{qi++;advance();}}
function goJump(){var inp=document.getElementById('jumpin');var v=parseInt(inp.value,10);if(isNaN(v)||v<1||v>roundTotal){alert('请输入 1 到 '+roundTotal+' 之间的题号');return;}resumed=false;qi=v-1;savePos();inp.value='';showCard(false);}
function restartAll(){clearPos();startRound('full');}
function advance(){next();}

var TAGC={"名解": "#2a7a4b", "简答": "#b3541e", "论述": "#7a3b12", "选择": "#1a6fa8", "单选": "#1a6fa8", "多选": "#1a6fa8", "判断": "#8e44ad", "综合": "#6a3fa0", "填空": "#1a6fa8"};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n').join('<br>');}
function freqLabel(f){var hot=f>=2?' hot':'';return '<span class="freq'+hot+'">真题考过 '+f+' 次</span>';}
function tagPill(t){var c=TAGC[t]||'#888';return '<span class="tag" style="background:'+c+'">'+esc(t)+'</span>';}
function srcPill(c){return c.src?'<span class="srcpill">'+esc(c.src)+'</span>':'';}
function knownCount(){return store.known.length;}
function paintProg(done,total){
  document.getElementById('pfill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ptext').textContent='已掌握 '+knownCount()+' / '+RAW.length+'（本轮 '+done+'/'+total+'）';
}
function startScreen(){
  phase='menu';paintBar();paintProg(0,0);setTab('all');paintWCount();paintKCount();
  var nWrong=store.wrong.length;
  var h='<div class="center">共 '+RAW.length+' 张卡片<br>已掌握 '+knownCount()+' 张 · 待加强 '+nWrong+' 张<br><br>'+
    '<div class="btnrow"><button class="btn-show" onclick="startRound(\'full\')">开始自测</button></div>';
  if(nWrong){h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">只练错题（'+nWrong+'）</button></div>';}
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
  document.getElementById('b-retry').disabled=!nWrong;
}
function startRound(mode){
  roundAttempted={};roundKnown=0;
  if(mode==='wrong'){queue=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});}
  else{queue=ORDER.slice();}
  retry=[];roundMode=mode;inRetry=false;resumed=false;qi=0;roundTotal=queue.length;phase='quiz';
  if(mode==='full'){var _p=loadPos();if(_p>0&&_p<queue.length){qi=_p;resumed=true;}}
  if(!queue.length){startScreen();return;}
  showCard(false);
}
function showCard(revealed){
  var i=queue[qi],c=RAW[i],st=document.getElementById('stage');
  paintProg(qi,roundTotal);
  if(resumed)document.getElementById('ptext').textContent='第 '+(qi+1)+' / '+roundTotal+' 题 · 已从上次进度恢复';
  var h='<div class="fcard">'+freqLabel(c.freq)+tagPill(c.tag)+srcPill(c)+'<div class="q">'+esc(c.q)+'</div>';
  if(revealed){
    h+='<div class="a"><div class="alabel">✓ 答案要点</div>'+esc(c.a)+'</div></div>';
    h+='<div class="btnrow"><button class="btn-know" onclick="mark(true)">会 ✓</button><button class="btn-unknow" onclick="mark(false)">不会 ✗</button></div>';
    h+=navRowHtml();
  }else{
    h+='</div><div class="btnrow"><button class="btn-show" onclick="showCard(true)">显示答案</button></div>';
    h+=navRowHtml();
  }
  st.innerHTML=h;
  paintBar();resumed=false;
  window.scrollTo(0,0);
}
function mark(know){
  var i=queue[qi];
  roundAttempted[i]=1;
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(know){
    if(ki<0)store.known.push(i);
    if(wi>=0)store.wrong.splice(wi,1);
    roundKnown++;
  }else{
    if(wi<0)store.wrong.push(i);
    if(retry.indexOf(i)<0)retry.push(i);
  }
  save();paintKCount();qi++;savePos();next();
}
function next(){
  if(qi<queue.length){showCard(false);return;}
  if(retry.length){queue=retry;retry=[];qi=0;inRetry=true;roundTotal=queue.length;showCard(false);return;}
  summary();
}
function summary(){
  phase='done';clearPos();paintBar();
  var total=Object.keys(roundAttempted).length;
  var rate=total?Math.round(roundKnown/total*100):0;
  paintProg(roundTotal,roundTotal);
  var h='<div class="sum"><div style="text-align:center;color:#888;font-size:14px">本轮结算</div>'+
    '<div class="rate">'+roundKnown+' / '+total+'（'+rate+'%）</div>';
  if(store.wrong.length){
    h+='<div style="font-size:14px;color:#888;margin:10px 0 4px">错题本（'+store.wrong.length+'）· 点击展开看答案</div>';
    var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.classList.toggle(\'open\')">'+esc(c.q)+'</div><div class="wa">'+freqLabel(c.freq)+' '+tagPill(c.tag)+' '+srcPill(c)+'<br>'+esc(c.a)+'</div></div>';
    });
  }else{
    h+='<div class="center">🎉 全部掌握！</div>';
  }
  h+='</div><div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')"'+(store.wrong.length?'':' disabled')+'>再练错题</button>'+
     '<button class="btn-ghost" onclick="startRound(\'full\')">重新开始</button></div>';
  document.getElementById('stage').innerHTML=h;
  window.scrollTo(0,0);
}
function paintWCount(){document.getElementById('wcount').textContent=store.wrong.length;}
function setTab(mode){document.getElementById('tab-all').classList.toggle('on',mode==='all');document.getElementById('tab-wrong').classList.toggle('on',mode==='wrong');document.getElementById('tab-known').classList.toggle('on',mode==='known');}
function paintKCount(){document.getElementById('kcount').textContent=store.known.length;}
function showWrongList(){
  phase='wrong';setTab('wrong');
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='不会的卡片共 '+store.wrong.length+' 张 · 点击问题可收起/展开答案';
  paintWCount();
  var st=document.getElementById('stage');
  var ws=store.wrong.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ws.length){
    h='<div class="center">\u0001F389 没有不会的卡片，全部掌握！</div>';
  }else{
    h+='<div class="btnrow"><button class="btn-know" onclick="startRound(\'wrong\')">再练一遍（'+ws.length+'）</button></div>';
    ws.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq" onclick="this.parentNode.querySelector(\'.wa\').classList.toggle(\'show\')">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+freqLabel(c.freq)+' '+tagPill(c.tag)+' '+srcPill(c)+'<br>'+esc(c.a)+
         '<br><button class="wmark" onclick="markKnownFromList('+i+',this)">\u2713 会了，移出</button></div></div>';
    });
  }
  st.innerHTML=h;
  paintBar();resumed=false;
  window.scrollTo(0,0);
}
function markKnownFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki<0)store.known.push(i);
  if(wi>=0)store.wrong.splice(wi,1);
  save();paintWCount();paintKCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.wrong.length)showWrongList();
}
document.getElementById('tab-all').onclick=function(){startScreen();};
document.getElementById('tab-wrong').onclick=function(){showWrongList();};
document.getElementById('tab-known').onclick=function(){showKnownList();};
function showKnownList(){
  phase='known';setTab('known');
  document.getElementById('pfill').style.width='0%';
  document.getElementById('ptext').textContent='已掌握的卡片共 '+store.known.length+' 张 · 答案直接展示';
  paintWCount();paintKCount();
  var st=document.getElementById('stage');
  var ks=store.known.slice().sort(function(a,b){return RAW[b].freq-RAW[a].freq;});
  var h='';
  if(!ks.length){
    h='<div class="center">还没有已掌握的卡片<br>去背诵练习里把会的卡片标出来吧</div>';
  }else{
    ks.forEach(function(i){
      var c=RAW[i];
      h+='<div class="witem"><div class="wq">'+esc(c.q)+'</div>'+
         '<div class="wa show">'+tagPill(c.tag)+' '+srcPill(c)+'<br>'+esc(c.a)+
         '<br><button class="wback" onclick="markUnknownFromList('+i+',this)">\u21a9 还是不会</button></div></div>';
    });
  }
  st.innerHTML=h;
  paintBar();resumed=false;
  window.scrollTo(0,0);
}
function markUnknownFromList(i,btn){
  var ki=store.known.indexOf(i),wi=store.wrong.indexOf(i);
  if(ki>=0)store.known.splice(ki,1);
  if(wi<0)store.wrong.push(i);
  save();paintWCount();paintKCount();
  document.getElementById('b-retry').disabled=!store.wrong.length;
  var item=btn.closest('.witem');if(item)item.remove();
  if(!store.known.length)showKnownList();
}
document.getElementById('b-retry').onclick=function(){if(store.wrong.length)startRound('wrong');};
document.getElementById('b-reset').onclick=function(){
  if(confirm('清空本门课的全部自测进度？')){localStorage.removeItem(KEY);localStorage.removeItem(POSKEY);store={known:[],wrong:[]};startScreen();}
};
document.getElementById('jumpbtn').onclick=function(){goJump();};
document.getElementById('restartbtn').onclick=function(){restartAll();};
document.getElementById('jumpin').addEventListener('keydown',function(e){if(e.key==='Enter')goJump();});
(function(){var _sx=0,_sy=0;var _st=document.getElementById('stage');_st.addEventListener('touchstart',function(e){if(e.touches.length===1){_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;}},false);_st.addEventListener('touchend',function(e){if(phase!=='quiz')return;var _t=e.changedTouches[0];var _dx=_t.clientX-_sx,_dy=_t.clientY-_sy;if(Math.abs(_dx)>=48&&Math.abs(_dx)>Math.abs(_dy)*1.4){if(_dx>0)goNext();else goPrev();}},false);})();
(function(){var _p=loadPos();if(_p>0&&_p<RAW.length){startRound('full');}else{startScreen();}})();
</script>
</body></html>
